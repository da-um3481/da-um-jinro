<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Google Sheets 데이터 테스트</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #1a1a1a;
            color: #fff;
        }
        pre {
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        .section {
            margin-bottom: 2rem;
        }
        h2 {
            color: #4ade80;
        }
    </style>
</head>
<body>
    <h1>🔍 Google Sheets 데이터 구조 확인</h1>
    
    <div class="section">
        <h2>1. Raw Response</h2>
        <pre id="rawData">Loading...</pre>
    </div>
    
    <div class="section">
        <h2>2. 첫 번째 학생 데이터</h2>
        <pre id="firstStudent">Loading...</pre>
    </div>
    
    <div class="section">
        <h2>3. 첫 번째 학생의 Records</h2>
        <pre id="firstRecords">Loading...</pre>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxCRKmOjkjEbSPkpjzb_RF6c-o3g9GsvHBMjFzu2YxLbac7nK_MwV2AT5VYfzFR7aP7MQ/exec';
        
        async function testData() {
            try {
                const url = `${WEB_APP_URL}?action=getStudyRecords&group_by=student`;
                console.log('Fetching:', url);
                
                const response = await fetch(url);
                const result = await response.json();
                
                console.log('Full response:', result);
                
                // Raw data
                document.getElementById('rawData').textContent = JSON.stringify(result, null, 2);
                
                if (result.data && result.data.length > 0) {
                    // First student
                    const firstStudent = result.data[0];
                    document.getElementById('firstStudent').textContent = JSON.stringify(firstStudent, null, 2);
                    
                    // First student records
                    if (firstStudent.records) {
                        document.getElementById('firstRecords').textContent = JSON.stringify(firstStudent.records, null, 2);
                    } else {
                        document.getElementById('firstRecords').textContent = 'No records field';
                    }
                } else {
                    document.getElementById('firstStudent').textContent = 'No students found';
                    document.getElementById('firstRecords').textContent = 'No students found';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('rawData').textContent = 'ERROR: ' + error.message;
            }
        }
        
        testData();
    </script>
</body>
</html>
