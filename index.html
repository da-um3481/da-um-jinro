<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=daum-classroom-v2/student.html">
    <title>다움 클래스룸 - 리다이렉트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #1f2937;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
            color: #1f2937;
        }
        p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #6b7280;
        }
        a {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        .spinner {
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="daum-classroom-v2/images/daum-logo.png" alt="다움 로고" class="logo">
        <h1>다움 클래스룸</h1>
        <p>학생 포털로 이동 중...</p>
        <div class="spinner"></div>
        <p style="font-size: 14px; margin-top: 30px;">자동으로 이동하지 않으면 아래 버튼을 클릭하세요</p>
        <a href="daum-classroom-v2/student.html">🚀 클래스룸 입장하기</a>
    </div>
</body>
</html>
