<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선행학습 프로그램 - 공부를 어떻게 할지 모르겠어요~~</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <!-- 상단 네비게이션 -->
    <nav class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">🚀 선행학습 프로그램</h1>
                    <p class="text-sm text-indigo-200">상위권 학생을 위한 맞춤형 선행 커리큘럼</p>
                </div>
                <div class="flex space-x-4">
                    <a href="index.html" class="px-4 py-2 hover:bg-indigo-700 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="students.html" class="px-4 py-2 hover:bg-indigo-700 rounded-lg transition">
                        <i class="fas fa-users mr-2"></i>학생 관리
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <div class="container mx-auto px-4 py-8">
        <!-- 학생 선택 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user-graduate mr-2 text-indigo-600"></i>선행학습 대상 학생 선택
                    </label>
                    <select id="studentSelect" onchange="loadStudentAdvancedPlan()" class="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">학생을 선택하세요</option>
                    </select>
                </div>
                <div>
                    <button onclick="openCreatePlanModal()" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold">
                        <i class="fas fa-plus mr-2"></i>선행 계획 만들기
                    </button>
                </div>
            </div>
        </div>

        <!-- 학생 정보 카드 -->
        <div id="studentInfoCard" class="hidden mb-6">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 rounded-lg shadow-lg p-6 text-white">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold mb-2" id="studentName">-</h2>
                        <p class="text-indigo-100" id="studentInfo">-</p>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-bold" id="advancedProgress">0%</div>
                        <div class="text-sm text-indigo-100">선행 진도율</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 선행 목표 설정 -->
        <div id="advancedTargetCard" class="hidden mb-6">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-target text-indigo-600 mr-2"></i>
                    선행학습 목표
                </h3>
                <div class="grid md:grid-cols-3 gap-4">
                    <div class="border rounded-lg p-4">
                        <div class="text-sm text-gray-600 mb-1">선행 범위</div>
                        <div class="text-2xl font-bold text-indigo-600" id="targetRange">-</div>
                    </div>
                    <div class="border rounded-lg p-4">
                        <div class="text-sm text-gray-600 mb-1">목표 진도율</div>
                        <div class="text-2xl font-bold text-green-600" id="targetProgress">70%</div>
                    </div>
                    <div class="border rounded-lg p-4">
                        <div class="text-sm text-gray-600 mb-1">예상 기간</div>
                        <div class="text-2xl font-bold text-purple-600" id="targetDuration">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 과목별 선행 진도 -->
        <div id="subjectProgressSection" class="hidden mb-6">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-chart-line text-indigo-600 mr-2"></i>
                    과목별 선행 진도
                </h3>
                <div id="subjectProgressContainer" class="space-y-4">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>

        <!-- 추천 교재 및 강의 -->
        <div id="materialsSection" class="hidden mb-6">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fas fa-book text-indigo-600 mr-2"></i>
                    추천 선행 교재 및 EBS 강의
                </h3>
                <div id="materialsContainer" class="grid md:grid-cols-2 gap-6">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>

        <!-- 주간 학습 계획 -->
        <div id="weeklyPlanSection" class="hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold flex items-center">
                        <i class="fas fa-calendar-week text-indigo-600 mr-2"></i>
                        주간 선행학습 계획
                    </h3>
                    <button onclick="openAddWeeklyPlanModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        <i class="fas fa-plus mr-2"></i>계획 추가
                    </button>
                </div>
                <div id="weeklyPlanContainer" class="space-y-3">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 선행 계획 생성 모달 -->
    <div id="createPlanModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">선행학습 계획 만들기</h3>
                <button onclick="closeCreatePlanModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- 학생 선택 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">대상 학생</label>
                    <select id="planStudentSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="">선택하세요</option>
                    </select>
                </div>

                <!-- 선행 범위 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">선행 범위</label>
                    <select id="planRange" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="next_semester">다음 학기</option>
                        <option value="high_1_1">고등학교 1학년 1학기</option>
                    </select>
                </div>

                <!-- 목표 진도율 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">목표 진도율</label>
                    <input type="number" id="planTargetProgress" value="70" min="50" max="100" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    <p class="text-sm text-gray-500 mt-1">권장: 70% (전체 내용의 70% 이해 목표)</p>
                </div>

                <!-- 기간 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">학습 기간 (주)</label>
                    <input type="number" id="planDuration" value="12" min="8" max="24" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    <p class="text-sm text-gray-500 mt-1">권장: 12주 (약 3개월)</p>
                </div>

                <!-- 과목 선택 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">선행 과목</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="checkbox" class="subject-check" value="수학" checked>
                            <span class="ml-2">수학</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="subject-check" value="영어" checked>
                            <span class="ml-2">영어</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="subject-check" value="과학" checked>
                            <span class="ml-2">과학</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="subject-check" value="국어">
                            <span class="ml-2">국어</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" class="subject-check" value="사회">
                            <span class="ml-2">사회</span>
                        </label>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="flex space-x-4 pt-4">
                    <button onclick="createAdvancedPlan()" class="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold">
                        <i class="fas fa-check mr-2"></i>계획 생성
                    </button>
                    <button onclick="closeCreatePlanModal()" class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        취소
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 주간 계획 추가 모달 -->
    <div id="addWeeklyPlanModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">주간 학습 계획 추가</h3>
                <button onclick="closeAddWeeklyPlanModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">과목</label>
                    <select id="weeklySubject" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="수학">수학</option>
                        <option value="영어">영어</option>
                        <option value="과학">과학</option>
                        <option value="국어">국어</option>
                        <option value="사회">사회</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">단원/챕터</label>
                    <input type="text" id="weeklyChapter" placeholder="예: 이차함수" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">학습 내용</label>
                    <textarea id="weeklyContent" rows="3" placeholder="예: 이차함수의 그래프, 최댓값과 최솟값" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">예상 학습 시간 (시간)</label>
                    <input type="number" id="weeklyHours" value="3" min="1" max="20" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>

                <div class="flex space-x-4 pt-4">
                    <button onclick="addWeeklyPlan()" class="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold">
                        추가
                    </button>
                    <button onclick="closeAddWeeklyPlanModal()" class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        취소
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/advanced-learning.js"></script>
</body>
</html>
