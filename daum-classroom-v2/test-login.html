<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-3xl font-black mb-6 text-center">로그인 테스트</h1>
        
        <div id="loginScreen">
            <input 
                type="text" 
                id="nameInput" 
                placeholder="이름을 입력하세요"
                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg mb-4 focus:outline-none focus:border-blue-500"
            >
            <button 
                onclick="testLogin()"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700"
            >
                로그인
            </button>
        </div>
        
        <div id="mainScreen" class="hidden">
            <p class="text-xl font-bold text-center mb-4" id="welcomeMsg"></p>
            <button 
                onclick="location.href='student.html'"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700"
            >
                학생 포털로 이동
            </button>
        </div>
        
        <div id="debugInfo" class="mt-6 p-4 bg-gray-50 rounded-lg">
            <h3 class="font-bold mb-2">디버그 정보:</h3>
            <pre id="debugText" class="text-xs"></pre>
        </div>
    </div>
    
    <script>
        function testLogin() {
            const name = document.getElementById('nameInput').value.trim();
            const debugText = document.getElementById('debugText');
            
            debugText.textContent = `입력된 이름: "${name}"\n`;
            
            if (!name) {
                alert('이름을 입력해주세요');
                debugText.textContent += '❌ 이름이 비어있음\n';
                return;
            }
            
            debugText.textContent += '✅ 이름 입력 확인\n';
            
            try {
                const studentData = {
                    name: name,
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('daum_v2_current_student', JSON.stringify(studentData));
                localStorage.setItem('currentStudentName', name);
                
                debugText.textContent += '✅ localStorage 저장 완료\n';
                debugText.textContent += `저장된 데이터: ${JSON.stringify(studentData, null, 2)}\n`;
                
                document.getElementById('welcomeMsg').textContent = `${name}님 환영합니다! 👋`;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                
                debugText.textContent += '✅ 화면 전환 완료\n';
            } catch (error) {
                debugText.textContent += `❌ 오류 발생: ${error.message}\n`;
                alert('로그인 중 오류가 발생했습니다: ' + error.message);
            }
        }
        
        // 페이지 로드 시 기존 로그인 확인
        window.addEventListener('DOMContentLoaded', function() {
            const saved = localStorage.getItem('daum_v2_current_student');
            const debugText = document.getElementById('debugText');
            
            if (saved) {
                try {
                    const student = JSON.parse(saved);
                    debugText.textContent = `기존 로그인 발견: ${student.name}\n`;
                    debugText.textContent += `데이터: ${JSON.stringify(student, null, 2)}\n`;
                    
                    document.getElementById('welcomeMsg').textContent = `${student.name}님 다시 오셨군요! 👋`;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainScreen').classList.remove('hidden');
                } catch (error) {
                    debugText.textContent = `⚠️ 저장된 데이터 파싱 실패: ${error.message}\n`;
                }
            } else {
                debugText.textContent = '로그인 기록 없음\n';
            }
        });
    </script>
</body>
</html>
