<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 클래스룸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-sky-50 to-teal-50">
    <!-- 헤더 -->
    <header class="bg-white border-b-2 border-gray-200 py-4 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <img src="images/daum-logo.png" alt="다움 로고" style="height: 65px;">
                <div>
                    <h1 class="text-xl md:text-4xl font-black text-gray-800">다움 클래스룸</h1>
                    <p class="text-sm md:text-base text-gray-600 font-semibold">교사 포털</p>
                </div>
            </a>
            <button onclick="location.href='../index.html'" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors font-bold">
                <i class="fas fa-home mr-2"></i>홈으로
            </button>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <!-- 탭 네비게이션 -->
            <div class="bg-white rounded-2xl shadow-lg p-2 mb-6 flex gap-2 overflow-x-auto">
                <button onclick="showTab('assignments')" id="tab-assignments" class="tab-btn flex-1 px-6 py-3 rounded-xl font-bold transition-all bg-blue-600 text-white whitespace-nowrap">
                    <i class="fas fa-tasks mr-2"></i>과제 관리
                </button>
                <button onclick="showTab('students')" id="tab-students" class="tab-btn flex-1 px-6 py-3 rounded-xl font-bold transition-all text-gray-600 hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-users mr-2"></i>학생 관리
                </button>
                <button onclick="showTab('analytics')" id="tab-analytics" class="tab-btn flex-1 px-6 py-3 rounded-xl font-bold transition-all text-gray-600 hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-chart-line mr-2"></i>학습 현황
                </button>
                <button onclick="showTab('questions')" id="tab-questions" class="tab-btn flex-1 px-6 py-3 rounded-xl font-bold transition-all text-gray-600 hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-question-circle mr-2"></i>질문 답변
                </button>
                <button onclick="showTab('feedback')" id="tab-feedback" class="tab-btn flex-1 px-6 py-3 rounded-xl font-bold transition-all text-gray-600 hover:bg-gray-100 whitespace-nowrap">
                    <i class="fas fa-comments mr-2"></i>피드백
                </button>
            </div>

            <!-- 과제 관리 탭 -->
            <div id="content-assignments" class="tab-content">
            <!-- 과제 생성 섹션 -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-plus-circle text-indigo-600 mr-2"></i>
                    과제 만들기
                </h2>
                
                <div class="space-y-4">
                    <!-- 과목 선택 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">과목</label>
                        <select id="subject" class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:outline-none">
                            <option value="수학">수학</option>
                            <option value="영어">영어</option>
                            <option value="국어">국어</option>
                            <option value="과학">과학</option>
                            <option value="사회">사회</option>
                        </select>
                    </div>

                    <!-- 제목 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">제목</label>
                        <input type="text" id="title" placeholder="예: 이차방정식 연습문제 20개"
                               class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:outline-none">
                    </div>

                    <!-- 설명 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">설명 (안내사항)</label>
                        <textarea id="description" rows="4" placeholder="과제 내용을 자세히 설명해주세요..."
                                  class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:outline-none"></textarea>
                    </div>

                    <!-- 마감일 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">마감일</label>
                        <input type="datetime-local" id="deadline"
                               class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-indigo-500 focus:outline-none">
                    </div>

                    <!-- 버튼 -->
                    <div class="flex gap-3">
                        <button onclick="createAssignment()" 
                                class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors">
                            <i class="fas fa-paper-plane mr-2"></i>과제 배포하기
                        </button>
                        <button onclick="clearForm()" 
                                class="px-6 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-300 transition-colors">
                            <i class="fas fa-redo mr-2"></i>초기화
                        </button>
                    </div>
                </div>
            </div>

            <!-- 과제 목록 섹션 -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-list text-purple-600 mr-2"></i>
                    배포된 과제 목록
                </h2>

                <!-- 과제 목록 -->
                <div id="assignmentList" class="space-y-4">
                    <!-- 동적으로 추가될 영역 -->
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>아직 배포된 과제가 없습니다</p>
                        <p class="text-sm mt-2">위에서 과제를 만들어보세요!</p>
                    </div>
                </div>
            </div>
            </div>

            <!-- 학생 관리 탭 -->
            <div id="content-students" class="tab-content hidden">
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-users text-blue-600 mr-2"></i>
                        학생 목록
                    </h2>
                    <div id="studentList" class="space-y-3">
                        <!-- 동적으로 추가될 영역 -->
                    </div>
                </div>
            </div>

            <!-- 학습 현황 탭 -->
            <div id="content-analytics" class="tab-content hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <div class="text-3xl font-bold text-blue-600 mb-2" id="totalAssignments">0</div>
                        <div class="text-gray-600 font-semibold">총 과제 수</div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <div class="text-3xl font-bold text-green-600 mb-2" id="completionRate">0%</div>
                        <div class="text-gray-600 font-semibold">평균 완료율</div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-lg p-6">
                        <div class="text-3xl font-bold text-purple-600 mb-2" id="activeStudents">0</div>
                        <div class="text-gray-600 font-semibold">활동 학생 수</div>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">과목별 평균 완료율</h2>
                    <div id="subjectStats" class="space-y-3">
                        <!-- 동적으로 추가될 영역 -->
                    </div>
                </div>
            </div>

            <!-- 질문 답변 탭 -->
            <div id="content-questions" class="tab-content hidden">
                <!-- 통계 카드 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold text-gray-600 mb-1">전체 질문</p>
                                <p class="text-3xl font-black text-gray-800" id="totalQuestions">0</p>
                            </div>
                            <div class="bg-blue-100 p-3 rounded-lg">
                                <i class="fas fa-question-circle text-blue-600 text-2xl"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-yellow-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold text-gray-600 mb-1">답변 대기</p>
                                <p class="text-3xl font-black text-gray-800" id="pendingQuestions">0</p>
                            </div>
                            <div class="bg-yellow-100 p-3 rounded-lg">
                                <i class="fas fa-clock text-yellow-600 text-2xl"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-500">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold text-gray-600 mb-1">답변 완료</p>
                                <p class="text-3xl font-black text-gray-800" id="answeredQuestions">0</p>
                            </div>
                            <div class="bg-green-100 p-3 rounded-lg">
                                <i class="fas fa-check-circle text-green-600 text-2xl"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 필터 -->
                <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
                    <div class="flex gap-2">
                        <button onclick="filterQuestions('all')" class="filter-btn active flex-1 px-4 py-2 rounded-lg font-bold transition-all bg-blue-600 text-white">
                            전체
                        </button>
                        <button onclick="filterQuestions('pending')" class="filter-btn flex-1 px-4 py-2 rounded-lg font-bold transition-all text-gray-600 hover:bg-gray-100">
                            답변 대기
                        </button>
                        <button onclick="filterQuestions('answered')" class="filter-btn flex-1 px-4 py-2 rounded-lg font-bold transition-all text-gray-600 hover:bg-gray-100">
                            답변 완료
                        </button>
                    </div>
                </div>

                <!-- 질문 목록 -->
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-list text-indigo-600 mr-2"></i>
                        학생 질문 목록
                    </h2>
                    <div id="allQuestionsList" class="space-y-4">
                        <!-- 동적으로 생성됨 -->
                    </div>
                </div>
            </div>

            <!-- 피드백 탭 -->
            <div id="content-feedback" class="tab-content hidden">
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-comments text-purple-600 mr-2"></i>
                        학생 피드백 작성
                    </h2>
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">학생 선택</label>
                            <select id="feedbackStudent" class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-blue-500 focus:outline-none">
                                <option value="">학생을 선택하세요</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">피드백 내용</label>
                            <textarea id="feedbackContent" rows="4" placeholder="학생에게 전달할 피드백을 작성하세요..."
                                      class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 focus:border-blue-500 focus:outline-none"></textarea>
                        </div>
                        <button onclick="sendFeedback()" 
                                class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">
                            <i class="fas fa-paper-plane mr-2"></i>피드백 보내기
                        </button>
                    </div>
                    <div class="border-t-2 pt-6">
                        <h3 class="font-bold text-gray-800 mb-3">최근 피드백 내역</h3>
                        <div id="feedbackHistory" class="space-y-3">
                            <!-- 동적으로 추가될 영역 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // LocalStorage 키 (기존과 완전 분리)
        const STORAGE_KEY = 'classroom_mvp_assignments';

        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', function() {
            loadAssignments();
            
            // 내일 오후 6시로 기본 마감일 설정
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(18, 0, 0, 0);
            document.getElementById('deadline').value = tomorrow.toISOString().slice(0, 16);
        });

        // 과제 생성
        function createAssignment() {
            const subject = document.getElementById('subject').value;
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const deadline = document.getElementById('deadline').value;

            // 유효성 검사
            if (!title) {
                alert('⚠️ 과제 제목을 입력해주세요!');
                return;
            }

            if (!deadline) {
                alert('⚠️ 마감일을 선택해주세요!');
                return;
            }

            // 과제 객체 생성
            const assignment = {
                id: 'assign_' + Date.now(),
                subject: subject,
                title: title,
                description: description,
                deadline: deadline,
                createdAt: new Date().toISOString(),
                completedBy: [] // 완료한 학생 ID 목록
            };

            // 저장
            const assignments = getAssignments();
            assignments.push(assignment);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));

            // 성공 메시지
            alert('✅ 과제가 성공적으로 배포되었습니다!');

            // 폼 초기화 및 목록 새로고침
            clearForm();
            loadAssignments();
        }

        // 과제 목록 불러오기
        function getAssignments() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 과제 목록 표시
        function loadAssignments() {
            const assignments = getAssignments();
            const container = document.getElementById('assignmentList');

            if (assignments.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>아직 배포된 과제가 없습니다</p>
                        <p class="text-sm mt-2">위에서 과제를 만들어보세요!</p>
                    </div>
                `;
                return;
            }

            // 최신순 정렬
            assignments.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            container.innerHTML = assignments.map(assign => {
                const deadline = new Date(assign.deadline);
                const now = new Date();
                const isOverdue = deadline < now;
                const daysLeft = Math.ceil((deadline - now) / (1000 * 60 * 60 * 24));

                return `
                    <div class="border-2 border-gray-200 rounded-xl p-4 hover:border-indigo-300 transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-lg text-sm font-bold">${assign.subject}</span>
                                ${isOverdue ? 
                                    '<span class="px-3 py-1 bg-red-100 text-red-700 rounded-lg text-xs">마감됨</span>' :
                                    `<span class="px-3 py-1 bg-green-100 text-green-700 rounded-lg text-xs">D-${daysLeft}</span>`
                                }
                            </div>
                            <button onclick="deleteAssignment('${assign.id}')" 
                                    class="text-red-500 hover:text-red-700">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        
                        <h3 class="font-bold text-lg text-gray-800 mb-2">${assign.title}</h3>
                        
                        ${assign.description ? 
                            `<p class="text-gray-600 text-sm mb-3">${assign.description}</p>` : 
                            ''
                        }
                        
                        <div class="flex items-center gap-4 text-sm text-gray-500">
                            <span><i class="far fa-calendar mr-1"></i>${formatDate(deadline)}</span>
                            <span><i class="far fa-clock mr-1"></i>${formatTime(deadline)}</span>
                        </div>

                        <div class="mt-3 pt-3 border-t border-gray-200">
                            <span class="text-sm text-gray-600">
                                완료한 학생: <strong>${assign.completedBy.length}명</strong>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 과제 삭제
        function deleteAssignment(id) {
            if (!confirm('정말 이 과제를 삭제하시겠습니까?')) return;

            const assignments = getAssignments();
            const filtered = assignments.filter(a => a.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
            loadAssignments();
        }

        // 폼 초기화
        function clearForm() {
            document.getElementById('subject').value = '수학';
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(18, 0, 0, 0);
            document.getElementById('deadline').value = tomorrow.toISOString().slice(0, 16);
        }

        // 날짜 포맷
        function formatDate(date) {
            return new Date(date).toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'short'
            });
        }

        // 시간 포맷
        function formatTime(date) {
            return new Date(date).toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 탭 전환
        function showTab(tabName) {
            // 모든 탭 버튼 비활성화
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('text-gray-600', 'hover:bg-gray-100');
            });
            
            // 선택된 탭 활성화
            document.getElementById('tab-' + tabName).classList.add('bg-blue-600', 'text-white');
            document.getElementById('tab-' + tabName).classList.remove('text-gray-600', 'hover:bg-gray-100');
            
            // 모든 콘텐츠 숨김
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // 선택된 콘텐츠 표시
            document.getElementById('content-' + tabName).classList.remove('hidden');
            
            // 탭별 데이터 로드
            if (tabName === 'students') loadStudents();
            if (tabName === 'analytics') loadAnalytics();
            if (tabName === 'feedback') loadFeedbackOptions();
        }

        // 학생 목록 로드 (localStorage에서)
        function loadStudents() {
            const students = JSON.parse(localStorage.getItem('classroom_students') || '[]');
            const studentList = document.getElementById('studentList');
            
            if (students.length === 0) {
                studentList.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-user-slash text-4xl mb-3"></i>
                        <p>등록된 학생이 없습니다</p>
                    </div>
                `;
                return;
            }
            
            studentList.innerHTML = students.map(student => `
                <div class="border-2 border-gray-200 rounded-lg p-4 hover:border-blue-400 transition-colors">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
                                <i class="fas fa-user text-blue-600 text-xl"></i>
                            </div>
                            <div>
                                <div class="font-bold text-gray-800">${student.name || '학생'}</div>
                                <div class="text-sm text-gray-500">마지막 접속: ${student.lastLogin ? new Date(student.lastLogin).toLocaleDateString() : '정보 없음'}</div>
                            </div>
                        </div>
                        <div class="text-sm font-semibold text-blue-600">
                            완료: ${student.completedAssignments || 0}개
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 학습 현황 로드
        function loadAnalytics() {
            const assignments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const students = JSON.parse(localStorage.getItem('classroom_students') || '[]');
            
            // 총 과제 수
            document.getElementById('totalAssignments').textContent = assignments.length;
            
            // 평균 완료율
            let totalCompletion = 0;
            assignments.forEach(assignment => {
                if (students.length > 0) {
                    totalCompletion += (assignment.completedBy?.length || 0) / students.length * 100;
                }
            });
            const avgCompletion = assignments.length > 0 ? (totalCompletion / assignments.length).toFixed(1) : 0;
            document.getElementById('completionRate').textContent = avgCompletion + '%';
            
            // 활동 학생 수
            document.getElementById('activeStudents').textContent = students.length;
            
            // 과목별 통계
            const subjectMap = {};
            assignments.forEach(assignment => {
                if (!subjectMap[assignment.subject]) {
                    subjectMap[assignment.subject] = { total: 0, completed: 0 };
                }
                subjectMap[assignment.subject].total++;
                subjectMap[assignment.subject].completed += assignment.completedBy?.length || 0;
            });
            
            const subjectStats = document.getElementById('subjectStats');
            const subjects = Object.keys(subjectMap);
            
            if (subjects.length === 0) {
                subjectStats.innerHTML = '<div class="text-center text-gray-400 py-4">과제 데이터가 없습니다</div>';
                return;
            }
            
            subjectStats.innerHTML = subjects.map(subject => {
                const data = subjectMap[subject];
                const rate = students.length > 0 ? (data.completed / (data.total * students.length) * 100).toFixed(1) : 0;
                return `
                    <div>
                        <div class="flex justify-between mb-2">
                            <span class="font-semibold text-gray-700">${subject}</span>
                            <span class="text-blue-600 font-bold">${rate}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3">
                            <div class="bg-blue-600 h-3 rounded-full transition-all" style="width: ${rate}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 피드백 옵션 로드
        function loadFeedbackOptions() {
            const students = JSON.parse(localStorage.getItem('classroom_students') || '[]');
            const select = document.getElementById('feedbackStudent');
            
            select.innerHTML = '<option value="">학생을 선택하세요</option>' +
                students.map(student => `<option value="${student.name}">${student.name}</option>`).join('');
            
            loadFeedbackHistory();
        }

        // 피드백 보내기
        function sendFeedback() {
            const student = document.getElementById('feedbackStudent').value;
            const content = document.getElementById('feedbackContent').value.trim();
            
            if (!student) {
                alert('⚠️ 학생을 선택해주세요!');
                return;
            }
            
            if (!content) {
                alert('⚠️ 피드백 내용을 입력해주세요!');
                return;
            }
            
            const feedback = {
                id: 'feedback_' + Date.now(),
                student: student,
                content: content,
                date: new Date().toISOString()
            };
            
            const feedbacks = JSON.parse(localStorage.getItem('classroom_feedbacks') || '[]');
            feedbacks.unshift(feedback);
            localStorage.setItem('classroom_feedbacks', JSON.stringify(feedbacks));
            
            alert('✅ 피드백이 전송되었습니다!');
            document.getElementById('feedbackContent').value = '';
            loadFeedbackHistory();
        }

        // 피드백 내역 로드
        function loadFeedbackHistory() {
            const feedbacks = JSON.parse(localStorage.getItem('classroom_feedbacks') || '[]');
            const history = document.getElementById('feedbackHistory');
            
            if (feedbacks.length === 0) {
                history.innerHTML = '<div class="text-center text-gray-400 py-4">아직 작성한 피드백이 없습니다</div>';
                return;
            }
            
            history.innerHTML = feedbacks.slice(0, 5).map(feedback => `
                <div class="border-2 border-gray-200 rounded-lg p-4">
                    <div class="flex justify-between mb-2">
                        <span class="font-bold text-gray-800">${feedback.student}</span>
                        <span class="text-sm text-gray-500">${new Date(feedback.date).toLocaleDateString()}</span>
                    </div>
                    <p class="text-gray-600">${feedback.content}</p>
                </div>
            `).join('');
        }
    </script>
    
    <!-- Google Sheets API -->
    <script src="js/google-sheets-api.js"></script>
    <script src="js/sync-status.js"></script>
    
    <!-- 사진 업로드 -->
    <script src="js/photo-upload.js"></script>
    
    <!-- 질문 답변 시스템 -->
    <script src="js/questions.js"></script>
    
    <!-- 질문 탭 초기화 -->
    <script>
        // 질문 탭이 선택되면 자동 로드
        const originalShowTab = window.showTab;
        window.showTab = function(tabName) {
            originalShowTab(tabName);
            
            if (tabName === 'questions') {
                loadAllQuestions();
            }
        };
    </script>
</body>
