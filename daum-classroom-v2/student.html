<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA.UM - 학생 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .tab-active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .study-hour-btn.selected {
            border-color: #3B82F6;
            background-color: #DBEAFE;
        }
        .subject-check-btn input:checked + div {
            border-color: #3B82F6;
            background-color: #DBEAFE;
        }
        .rotate-180 {
            transform: rotate(180deg);
        }
        #planToggleIcon {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 헤더 -->
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">DA.UM 학생 포털</h1>
                <p class="text-sm opacity-90" id="studentName">로그인 해주세요</p>
            </div>
            <button onclick="logout()" class="bg-white text-purple-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition">
                <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
            </button>
        </div>
    </header>

    <!-- 로그인 화면 -->
    <div id="loginScreen" class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
            <div class="text-center mb-6">
                <i class="fas fa-user-circle text-6xl text-blue-500"></i>
                <h2 class="text-2xl font-bold mt-4">학생 로그인</h2>
            </div>
            <input 
                type="text" 
                id="nameInput" 
                placeholder="이름을 입력하세요" 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <button onclick="login()" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">
                입장하기
            </button>
        </div>
    </div>

    <!-- 메인 화면 -->
    <div id="mainScreen" class="hidden">
        <!-- 탭 메뉴 -->
        <div class="bg-white shadow-md sticky top-0 z-10">
            <div class="container mx-auto px-4">
                <div class="flex overflow-x-auto">
                    <button onclick="showTab('journal')" id="tab-journal" class="tab-active px-6 py-4 whitespace-nowrap">
                        <i class="fas fa-book mr-2"></i>학습 일지
                    </button>
                    <button onclick="showTab('mission')" id="tab-mission" class="px-6 py-4 whitespace-nowrap hover:bg-gray-100 transition">
                        <i class="fas fa-bullseye mr-2"></i>학습 미션
                    </button>
                    <button onclick="showTab('materials')" id="tab-materials" class="px-6 py-4 whitespace-nowrap hover:bg-gray-100 transition">
                        <i class="fas fa-folder-open mr-2"></i>자료실
                    </button>
                    <button onclick="showTab('coaching')" id="tab-coaching" class="px-6 py-4 whitespace-nowrap hover:bg-gray-100 transition">
                        <i class="fas fa-robot mr-2"></i>AI 코칭
                    </button>
                </div>
            </div>
        </div>

        <!-- 컨텐츠 영역 -->
        <div class="container mx-auto px-4 py-6">
            <!-- 학습 시작 도우미 버튼 -->
            <div class="mb-6">
                <button onclick="openStudyHelperModal()" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-lg shadow-lg hover:shadow-xl transition flex items-center justify-center gap-3">
                    <i class="fas fa-rocket text-2xl"></i>
                    <span class="text-lg font-bold">학습 시작이 막막하신가요? 일주일 계획 자동 생성하기</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- 학습 시작 도우미 모달 -->
            <div id="studyHelperModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4" onclick="if(event.target === this) closeStudyHelperModal()">
                <div class="bg-white rounded-lg shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                    <!-- 모달 헤더 -->
                    <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 rounded-t-lg sticky top-0">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-3xl font-bold mb-2">🚀 학습 시작 도우미</h2>
                                <p class="text-lg opacity-90">일주일 학습 계획을 자동으로 만들어드릴게요!</p>
                            </div>
                            <button onclick="closeStudyHelperModal()" class="text-white hover:bg-white hover:bg-opacity-20 rounded-full w-10 h-10 flex items-center justify-center transition ml-4">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 모달 바디 -->
                    <div class="p-6">
                        <div class="mb-6">
                            <label class="block text-lg font-bold mb-3">📝 오늘 몇 시간 공부할 수 있나요?</label>
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                <button onclick="selectStudyHours(2)" class="study-hour-btn px-6 py-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                                    <div class="text-3xl font-bold">2</div>
                                    <div class="text-sm">시간</div>
                                </button>
                                <button onclick="selectStudyHours(3)" class="study-hour-btn px-6 py-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                                    <div class="text-3xl font-bold">3</div>
                                    <div class="text-sm">시간</div>
                                </button>
                                <button onclick="selectStudyHours(4)" class="study-hour-btn px-6 py-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                                    <div class="text-3xl font-bold">4</div>
                                    <div class="text-sm">시간</div>
                                </button>
                                <button onclick="selectStudyHours(5)" class="study-hour-btn px-6 py-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                                    <div class="text-3xl font-bold">5</div>
                                    <div class="text-sm">시간</div>
                                </button>
                                <button onclick="selectStudyHours(6)" class="study-hour-btn px-6 py-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                                    <div class="text-3xl font-bold">6</div>
                                    <div class="text-sm">시간</div>
                                </button>
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="block text-lg font-bold mb-3">📚 집중하고 싶은 과목은? (선택사항)</label>
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                <label class="subject-check-btn cursor-pointer">
                                    <input type="checkbox" value="국어" class="hidden subject-checkbox">
                                    <div class="px-4 py-3 border-2 border-gray-300 rounded-lg text-center hover:border-blue-500 hover:bg-blue-50 transition">
                                        <i class="fas fa-book text-2xl mb-1"></i>
                                        <div class="font-semibold">국어</div>
                                    </div>
                                </label>
                                <label class="subject-check-btn cursor-pointer">
                                    <input type="checkbox" value="영어" class="hidden subject-checkbox">
                                    <div class="px-4 py-3 border-2 border-gray-300 rounded-lg text-center hover:border-blue-500 hover:bg-blue-50 transition">
                                        <i class="fas fa-language text-2xl mb-1"></i>
                                        <div class="font-semibold">영어</div>
                                    </div>
                                </label>
                                <label class="subject-check-btn cursor-pointer">
                                    <input type="checkbox" value="수학" class="hidden subject-checkbox">
                                    <div class="px-4 py-3 border-2 border-gray-300 rounded-lg text-center hover:border-blue-500 hover:bg-blue-50 transition">
                                        <i class="fas fa-calculator text-2xl mb-1"></i>
                                        <div class="font-semibold">수학</div>
                                    </div>
                                </label>
                                <label class="subject-check-btn cursor-pointer">
                                    <input type="checkbox" value="과학" class="hidden subject-checkbox">
                                    <div class="px-4 py-3 border-2 border-gray-300 rounded-lg text-center hover:border-blue-500 hover:bg-blue-50 transition">
                                        <i class="fas fa-flask text-2xl mb-1"></i>
                                        <div class="font-semibold">과학</div>
                                    </div>
                                </label>
                                <label class="subject-check-btn cursor-pointer">
                                    <input type="checkbox" value="사회" class="hidden subject-checkbox">
                                    <div class="px-4 py-3 border-2 border-gray-300 rounded-lg text-center hover:border-blue-500 hover:bg-blue-50 transition">
                                        <i class="fas fa-globe text-2xl mb-1"></i>
                                        <div class="font-semibold">사회</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button onclick="generateWeeklyPlan()" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-lg text-xl font-bold hover:shadow-xl transition">
                            <i class="fas fa-magic mr-2"></i>자동 계획 만들기 ✨
                        </button>
                    </div>
                </div>
            </div>

            <!-- 생성된 주간 학습 계획 (접기/펼치기) -->
            <div id="weeklyPlanView" class="mb-6 hidden">
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <!-- 계획표 헤더 (항상 보임) -->
                    <div class="p-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white cursor-pointer hover:opacity-90 transition" onclick="toggleWeeklyPlan()">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <i class="fas fa-calendar-alt text-2xl"></i>
                                <div>
                                    <h3 class="text-lg font-bold">나의 일주일 학습 계획</h3>
                                    <p class="text-sm opacity-90" id="planExpiryDate">클릭하여 펼치기/접기</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="event.stopPropagation(); showStudyHelper()" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition text-sm font-semibold">
                                    <i class="fas fa-redo mr-1"></i>다시 만들기
                                </button>
                                <i id="planToggleIcon" class="fas fa-chevron-down text-2xl transition-transform"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 계획표 내용 (접을 수 있음) -->
                    <div id="weeklyPlanContent" class="p-6 space-y-4 hidden"></div>
                </div>
            </div>

            <!-- 학습 일지 탭 -->
            <div id="content-journal" class="tab-content">
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <h3 class="text-xl font-bold mb-4">오늘의 학습 기록</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">과목</label>
                        <select id="subject" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="국어">국어</option>
                            <option value="영어">영어</option>
                            <option value="수학">수학</option>
                            <option value="과학">과학</option>
                            <option value="사회">사회</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">학습 내용</label>
                        <textarea id="content" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="무엇을 공부했나요?"></textarea>
                    </div>

                    <!-- 타이머 섹션 -->
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">⏱️ 학습 시간 측정</label>
                        
                        <!-- 대기 상태 -->
                        <div id="timerIdle" class="border-2 border-blue-300 rounded-lg p-4 bg-blue-50">
                            <button onclick="startTimer()" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition font-semibold text-lg">
                                <i class="fas fa-play mr-2"></i>학습 시작
                            </button>
                        </div>

                        <!-- 학습 중 상태 -->
                        <div id="timerRunning" class="hidden border-2 border-green-500 rounded-lg p-4 bg-green-50">
                            <div class="text-center mb-3">
                                <div class="text-green-600 font-bold mb-2">
                                    <i class="fas fa-circle animate-pulse"></i> 학습 중...
                                </div>
                                <div class="text-sm text-gray-600 mb-1">
                                    시작: <span id="startTime" class="font-semibold"></span>
                                </div>
                                <div class="text-3xl font-bold text-gray-800 mb-2" id="elapsedTime">
                                    00:00:00
                                </div>
                            </div>
                            <button onclick="stopTimer()" class="w-full bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 transition font-semibold text-lg">
                                <i class="fas fa-stop mr-2"></i>완료
                            </button>
                        </div>

                        <!-- 완료 상태 -->
                        <div id="timerCompleted" class="hidden border-2 border-green-500 rounded-lg p-4 bg-green-50">
                            <div class="text-center mb-3">
                                <div class="text-green-600 font-bold mb-2">
                                    <i class="fas fa-check-circle"></i> 완료!
                                </div>
                                <div class="text-sm text-gray-600 space-y-1">
                                    <div>시작: <span id="completedStartTime" class="font-semibold"></span></div>
                                    <div>종료: <span id="completedEndTime" class="font-semibold"></span></div>
                                    <div class="text-xl font-bold text-blue-600 mt-2">
                                        학습 시간: <span id="completedDuration"></span>
                                    </div>
                                </div>
                            </div>
                            <button onclick="resetTimer()" class="w-full bg-gray-500 text-white py-2 rounded-lg hover:bg-gray-600 transition">
                                <i class="fas fa-redo mr-2"></i>다시 측정
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">📷 사진 첨부 (선택, 최대 3개)</label>
                        <input type="file" id="photoUpload" accept="image/*" multiple class="w-full px-4 py-2 border rounded-lg" onchange="handlePhotoUpload(event)">
                        <p class="text-xs text-gray-500 mt-1">JPG, PNG 형식 / 각 파일 최대 2MB</p>
                        <div id="photoPreview" class="mt-3 grid grid-cols-3 gap-2"></div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">메모</label>
                        <textarea id="memo" rows="2" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="어려웠던 점, 느낀 점 등"></textarea>
                    </div>

                    <button onclick="saveJournal()" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">
                        <i class="fas fa-save mr-2"></i>저장하기
                    </button>
                </div>

                <!-- 학습 기록 목록 -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-bold mb-4">나의 학습 기록</h3>
                    <div id="journalList" class="space-y-4"></div>
                </div>
            </div>

            <!-- 학습 미션 탭 -->
            <div id="content-mission" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-bold mb-4">이번 주 학습 미션</h3>
                    <div id="missionList" class="space-y-4"></div>
                </div>
            </div>

            <!-- 자료실 탭 -->
            <div id="content-materials" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-bold mb-4">학습 자료</h3>
                    <div id="materialsList" class="grid md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- AI 코칭 탭 -->
            <div id="content-coaching" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <h3 class="text-xl font-bold mb-4">AI에게 질문하기</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">질문 내용</label>
                        <textarea id="questionText" rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="궁금한 것을 물어보세요"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">📷 문제 사진 첨부 (선택)</label>
                        <input type="file" id="questionPhoto" accept="image/*" class="w-full px-4 py-2 border rounded-lg" onchange="handleQuestionPhotoUpload(event)">
                        <p class="text-xs text-gray-500 mt-1">문제 사진을 첨부하면 더 정확한 답변을 받을 수 있습니다</p>
                        <div id="questionPhotoPreview" class="mt-2"></div>
                    </div>

                    <button onclick="askAI()" class="w-full bg-purple-500 text-white py-3 rounded-lg hover:bg-purple-600 transition">
                        <i class="fas fa-robot mr-2"></i>AI에게 질문하기
                    </button>
                </div>

                <!-- 질문 목록 -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-bold mb-4">나의 질문</h3>
                    <div id="questionList" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/student.js"></script>
</body>
</html>
