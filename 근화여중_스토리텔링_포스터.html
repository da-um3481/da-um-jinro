<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 챌린지 - 스토리텔링</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster {
            width: 100%;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1a0b2e 0%, #2c1654 50%, #4a148c 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        
        /* 왼쪽: 스토리 소개 */
        .left-section {
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: 
                radial-gradient(circle at 30% 50%, rgba(102, 126, 234, 0.2), transparent 70%);
        }
        
        .chapter-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            align-self: flex-start;
            text-transform: uppercase;
        }
        
        .main-title {
            font-size: 82px;
            font-weight: 900;
            color: white;
            line-height: 0.95;
            margin-bottom: 30px;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
        }
        
        .quote-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border-left: 5px solid #667eea;
            margin-bottom: 40px;
        }
        
        .quote-text {
            font-size: 22px;
            color: white;
            font-weight: 500;
            line-height: 1.6;
            font-style: italic;
        }
        
        .cta-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 22px 60px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 900;
            display: inline-block;
            text-decoration: none;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
            align-self: flex-start;
            text-transform: uppercase;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.7);
        }
        
        /* 오른쪽: 타임라인 */
        .right-section {
            padding: 80px 60px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .timeline-title {
            font-size: 36px;
            color: #FFD700;
            font-weight: 900;
            text-align: center;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }
        
        .timeline-item {
            display: flex;
            gap: 25px;
            position: relative;
        }
        
        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 34px;
            top: 70px;
            width: 3px;
            height: calc(100% + 35px);
            background: linear-gradient(180deg, #667eea, #764ba2);
        }
        
        .timeline-dot {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.6);
            position: relative;
            z-index: 1;
        }
        
        .timeline-content {
            flex: 1;
            padding-top: 8px;
        }
        
        .timeline-date {
            font-size: 16px;
            color: #FFD700;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .timeline-title-text {
            font-size: 24px;
            color: white;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .timeline-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 1200px) {
            .poster {
                grid-template-columns: 1fr;
                aspect-ratio: 9 / 16;
            }
            
            .left-section {
                padding: 50px 40px;
            }
            
            .main-title {
                font-size: 56px;
            }
            
            .subtitle {
                font-size: 22px;
            }
            
            .right-section {
                padding: 50px 40px;
            }
        }
        
        @media (max-width: 768px) {
            .left-section {
                padding: 40px 30px;
            }
            
            .main-title {
                font-size: 48px;
            }
            
            .subtitle {
                font-size: 20px;
            }
            
            .quote-text {
                font-size: 18px;
            }
            
            .right-section {
                padding: 40px 30px;
            }
            
            .timeline-title {
                font-size: 28px;
            }
            
            .timeline-dot {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            
            .timeline-item:not(:last-child)::after {
                left: 29px;
            }
        }
        
        @media (max-width: 480px) {
            .main-title {
                font-size: 42px;
            }
            
            .subtitle {
                font-size: 18px;
            }
            
            .timeline-title-text {
                font-size: 20px;
            }
            
            .timeline-desc {
                font-size: 14px;
            }
            
            .cta-button {
                padding: 18px 40px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- 왼쪽: 스토리 소개 -->
        <div class="left-section">
            <div class="chapter-badge">Winter Story 2025</div>
            
            <div class="main-title">
                나의 성장<br>
                스토리
            </div>
            
            <div class="subtitle">
                30일 동안 펼쳐질<br>
                특별한 겨울방학 이야기
            </div>
            
            <div class="quote-box">
                <div class="quote-text">
                    "나도 할 수 있을까?"<br>
                    고민하던 그 순간부터,<br>
                    나의 변화가 시작되었다.
                </div>
            </div>
            
            <a href="#" class="cta-button">시작하기 →</a>
        </div>
        
        <!-- 오른쪽: 타임라인 -->
        <div class="right-section">
            <div class="timeline-title">The Journey</div>
            
            <div class="timeline">
                <div class="timeline-item">
                    <div class="timeline-dot">📋</div>
                    <div class="timeline-content">
                        <div class="timeline-date">~12/26</div>
                        <div class="timeline-title-text">시작</div>
                        <div class="timeline-desc">
                            친구들과 함께 신청하고 나만의 목표를 세운다
                        </div>
                    </div>
                </div>
                
                <div class="timeline-item">
                    <div class="timeline-dot">🎯</div>
                    <div class="timeline-content">
                        <div class="timeline-date">~12/30</div>
                        <div class="timeline-title-text">준비</div>
                        <div class="timeline-desc">
                            오리엔테이션으로 성공적인 시작을 다진다
                        </div>
                    </div>
                </div>
                
                <div class="timeline-item">
                    <div class="timeline-dot">💪</div>
                    <div class="timeline-content">
                        <div class="timeline-date">4주간</div>
                        <div class="timeline-title-text">성장</div>
                        <div class="timeline-desc">
                            매일 조금씩 성장하며 나의 가능성을 발견한다
                        </div>
                    </div>
                </div>
                
                <div class="timeline-item">
                    <div class="timeline-dot">🏆</div>
                    <div class="timeline-content">
                        <div class="timeline-date">2/2~2/5</div>
                        <div class="timeline-title-text">완성</div>
                        <div class="timeline-desc">
                            달라진 나를 확인하고 새 학기를 준비한다
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
