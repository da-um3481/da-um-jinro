<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 챌린지 - 스토리텔링</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 210 / 297; /* A4 비율 */
            background: linear-gradient(180deg, #1a0b2e 0%, #2c1654 50%, #4a148c 100%);
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        /* 상단 헤더 */
        .header {
            padding: 40px 50px;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at center, rgba(102, 126, 234, 0.2), transparent);
        }
        
        .chapter-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            color: #FFD700;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        
        .main-title {
            font-size: 62px;
            font-weight: 900;
            color: white;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
            line-height: 1.4;
        }
        
        /* 명언 박스 */
        .quote-section {
            padding: 30px 50px;
        }
        
        .quote-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border-left: 5px solid #667eea;
        }
        
        .quote-text {
            font-size: 19px;
            color: white;
            font-weight: 500;
            line-height: 1.6;
            font-style: italic;
        }
        
        /* 타임라인 */
        .timeline-section {
            flex: 1;
            padding: 20px 50px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .timeline-title {
            font-size: 28px;
            color: #FFD700;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .timeline {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .timeline-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px 20px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            text-align: center;
        }
        
        .timeline-emoji {
            font-size: 56px;
            margin-bottom: 15px;
            display: block;
        }
        
        .timeline-date {
            font-size: 16px;
            color: #FFD700;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .timeline-title-text {
            font-size: 28px;
            color: white;
            font-weight: 900;
            margin-bottom: 10px;
        }
        
        .timeline-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            font-weight: 500;
        }
        
        /* CTA 섹션 */
        .cta-section {
            padding: 35px 50px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .cta-text {
            font-size: 24px;
            color: white;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .cta-subtext {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }
        
        .cta-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 900;
            display: inline-block;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            text-transform: uppercase;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .poster {
                max-width: 600px;
            }
            
            .header {
                padding: 30px 35px;
            }
            
            .main-title {
                font-size: 48px;
            }
            
            .subtitle {
                font-size: 18px;
            }
            
            .quote-section {
                padding: 25px 35px;
            }
            
            .timeline-section {
                padding: 20px 35px;
            }
            
            .timeline {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .cta-section {
                padding: 30px 35px;
            }
        }
        
        @media (max-width: 480px) {
            .poster {
                max-width: 400px;
            }
            
            .main-title {
                font-size: 38px;
            }
            
            .quote-text {
                font-size: 16px;
            }
            
            .timeline-emoji {
                font-size: 36px;
            }
            
            .cta-button {
                padding: 15px 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- 헤더 -->
        <div class="header">
            <div class="chapter-badge">Winter Story 2025</div>
            <div class="main-title">
                나의 성장<br>
                스토리
            </div>
            <div class="subtitle">
                30일 동안 펼쳐질 특별한 겨울방학 이야기
            </div>
        </div>
        
        <!-- 명언 -->
        <div class="quote-section">
            <div class="quote-box">
                <div class="quote-text">
                    "나도 할 수 있을까?" 고민하던 그 순간부터,<br>
                    나의 변화가 시작되었다.
                </div>
            </div>
        </div>
        
        <!-- 타임라인 -->
        <div class="timeline-section">
            <div class="timeline-title">The Journey</div>
            
            <div class="timeline">
                <div class="timeline-item">
                    <span class="timeline-emoji">📋</span>
                    <div class="timeline-date">~12/26</div>
                    <div class="timeline-title-text">시작</div>
                    <div class="timeline-desc">친구들과 함께<br>목표 세우기</div>
                </div>
                
                <div class="timeline-item">
                    <span class="timeline-emoji">🎯</span>
                    <div class="timeline-date">~12/30</div>
                    <div class="timeline-title-text">준비</div>
                    <div class="timeline-desc">오리엔테이션으로<br>시작 다지기</div>
                </div>
                
                <div class="timeline-item">
                    <span class="timeline-emoji">💪</span>
                    <div class="timeline-date">4주간</div>
                    <div class="timeline-title-text">성장</div>
                    <div class="timeline-desc">매일 조금씩<br>발전하기</div>
                </div>
                
                <div class="timeline-item">
                    <span class="timeline-emoji">🏆</span>
                    <div class="timeline-date">2/2~2/5</div>
                    <div class="timeline-title-text">완성</div>
                    <div class="timeline-desc">달라진 나를<br>확인하기</div>
                </div>
            </div>
        </div>
        
        <!-- CTA -->
        <div class="cta-section">
            <div class="cta-text">당신의 스토리를 시작하세요</div>
            <div class="cta-subtext">담임쌤 또는 진로쌤께 신청</div>
            <a href="#" class="cta-button">지금 시작 →</a>
        </div>
    </div>
</body>
</html>
