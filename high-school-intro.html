<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>2027-2029 고등학생 입시 및 학습관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .slide-container {
            width: 1280px;
            max-width: 100vw;
            height: 720px;
            max-height: 100vh;
            position: relative;
            overflow: hidden;
            background-image: url('https://www.genspark.ai/api/files/s/wt2EqlyZ?cache_control=3600');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.45);
            z-index: 1;
        }
        
        .content-wrapper {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 40px;
            color: white;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .title-divider {
            width: 80px;
            height: 4px;
            background-color: #3B82F6;
            margin: 2rem auto;
            border-radius: 2px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 1s ease-out;
        }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            margin-top: 2rem;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }
        
        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .slide-container {
                height: 100vh;
            }
            
            .content-wrapper {
                padding: 0 20px;
            }
            
            h1 {
                font-size: 2.5rem !important;
            }
            
            .glass-panel {
                flex-direction: column !important;
                gap: 20px !important;
                padding: 20px !important;
            }
            
            .w-px {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Background Overlay -->
        <div class="overlay"></div>
        
        <!-- Header -->
        <div class="absolute top-0 left-0 w-full p-8 z-10 flex justify-between items-center text-white opacity-90">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center backdrop-filter backdrop-blur-sm">
                    <i class="fas fa-university text-xl"></i>
                </div>
                <div class="flex flex-col text-left">
                    <p class="text-xs font-light text-blue-200 uppercase tracking-widest">Future Education</p>
                    <p class="text-lg font-bold tracking-wide">입시·학습 관리 시스템</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-sm font-medium bg-blue-900 bg-opacity-60 px-3 py-1 rounded border border-blue-700">2027-2029학년도 대비</p>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="content-wrapper">
            <div class="animate-fade-in-up">
                <!-- Tag -->
                <div class="inline-flex items-center gap-2 bg-blue-600 bg-opacity-90 px-4 py-1.5 rounded-full mb-6 shadow-lg">
                    <i class="fas fa-check-circle text-xs"></i>
                    <p class="text-sm font-bold tracking-wider uppercase">Official Guideline</p>
                </div>
                
                <!-- Main Title -->
                <h1 class="text-6xl font-black leading-tight tracking-tight mb-2 drop-shadow-xl">
                    <span class="block text-blue-100 text-3xl font-bold mb-2">2027-2029</span>
                    고등학생 입시 및<br/>
                    학습관리 시스템
                </h1>
                
                <!-- Subtitle -->
                <p class="text-2xl font-light text-blue-50 mt-6 tracking-wide drop-shadow-md">
                    2022 개정교육과정·고교학점제 기반<br/>
                    <span class="font-bold text-white">공교육 중심 통합 솔루션</span>
                </p>
                
                <div class="title-divider"></div>
                
                <!-- CTA Button -->
                <a href="high-student-dashboard.html" class="cta-button">
                    <i class="fas fa-rocket"></i>
                    시스템 시작하기
                </a>
            </div>
            
            <!-- Bottom Info Panel -->
            <div class="glass-panel rounded-2xl px-10 py-6 mt-8 flex items-center gap-12 text-left">
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center flex-shrink-0 shadow-lg">
                        <i class="fas fa-bullseye text-white"></i>
                    </div>
                    <div>
                        <p class="text-blue-200 text-xs font-bold uppercase mb-1 tracking-wider">목적</p>
                        <p class="text-base font-medium leading-snug">대입 대비 학교 중심<br/>학습·입시 관리 표준안 제시</p>
                    </div>
                </div>
                
                <div class="w-px h-12 bg-white bg-opacity-20"></div>
                
                <div class="flex items-start gap-4">
                    <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center flex-shrink-0 shadow-lg">
                        <i class="fas fa-users text-white"></i>
                    </div>
                    <div>
                        <p class="text-blue-200 text-xs font-bold uppercase mb-1 tracking-wider">대상</p>
                        <p class="text-base font-medium leading-snug">고1~고3 학생,<br/>담임·진로부, 학부모</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer Decorative Line -->
        <div class="absolute bottom-0 w-full h-1.5 bg-gradient-to-r from-blue-600 via-indigo-500 to-blue-400 z-10"></div>
    </div>
</body>
</html>
