<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교재 관리 - 공부를 어떻게 할지 모르겠어요~~</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        @media (max-width: 768px) {
            body { font-size: 14px; }
            nav h1 { font-size: 1rem !important; }
            nav p { font-size: 0.75rem !important; display: none; }
            .container { padding-left: 1rem !important; padding-right: 1rem !important; }
            .md\:grid-cols-2, .md\:grid-cols-3, .md\:grid-cols-4 { grid-template-columns: 1fr !important; }
            .glass-effect, .bg-white { padding: 1rem !important; }
            input, select, textarea { font-size: 0.875rem !important; padding: 0.75rem !important; }
            button { font-size: 0.875rem !important; padding: 0.75rem !important; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 상단 헤더 - DA.UM 아이덴티티 -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <!-- 로고 및 타이틀 (왼편 배치) -->
                <div class="flex items-center space-x-3">
                    <img src="images/daum-logo-transparent.png" alt="DA.UM Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl shadow-lg bg-white p-1" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black">DA.UM 교재 관리</h1>
                        <p class="text-xs sm:text-sm text-indigo-100 font-medium">Materials & Lecture Management</p>
                    </div>
                </div>
                <!-- 네비게이션 -->
                <nav class="hidden md:flex space-x-2">
                    <a href="index.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="students.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-users mr-2"></i>학생 관리
                    </a>
                    <a href="lessons.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-book mr-2"></i>수업 관리
                    </a>
                    <a href="materials.html" class="px-4 py-2 bg-white/30 rounded-lg transition">
                        <i class="fas fa-book-open mr-2"></i>교재 관리
                    </a>
                </nav>
                <!-- 모바일 메뉴 -->
                <button onclick="window.location.href='index.html'" class="md:hidden px-3 py-2 hover:bg-white/20 rounded-lg transition">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <div class="container mx-auto px-4 py-8">
        <!-- 필터 및 검색 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">🔍 교재 검색 및 필터</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <select id="filterType" onchange="loadMaterials()" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">전체 유형</option>
                    <option value="교재">교재</option>
                    <option value="EBS강의">EBS강의</option>
                </select>
                
                <select id="filterSubject" onchange="loadMaterials()" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">전체 과목</option>
                    <option value="국어">국어</option>
                    <option value="영어">영어</option>
                    <option value="수학">수학</option>
                    <option value="과학">과학</option>
                    <option value="사회">사회</option>
                </select>
                
                <select id="filterLevel" onchange="loadMaterials()" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">전체 수준</option>
                    <option value="상">상</option>
                    <option value="중">중</option>
                    <option value="하">하</option>
                </select>
                
                <input type="text" id="searchText" placeholder="제목 검색..." 
                    class="px-4 py-2 border border-gray-300 rounded-lg" onkeyup="searchMaterials()">
            </div>
        </div>

        <!-- 교재 목록 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">📚 등록된 교재 목록</h2>
                <p class="text-sm text-gray-600">총 <span id="materialCount" class="font-semibold text-indigo-600">0</span>개</p>
            </div>
            
            <div id="materialsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>
    </div>

    <script src="js/materials.js"></script>
</body>
</html>
