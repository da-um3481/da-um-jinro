<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 챌린지 - 인스타 스타일</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 210 / 297; /* A4 비율 */
            background: linear-gradient(180deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        /* 인스타 헤더 */
        .insta-header {
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        
        .profile-info {
            flex: 1;
        }
        
        .username {
            color: white;
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 3px;
        }
        
        .location {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        
        /* 메인 콘텐츠 */
        .main-content {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }
        
        .main-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        
        .hashtags {
            font-size: 22px;
            color: #FFD700;
            font-weight: 700;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .story-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 40px;
        }
        
        .story-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .story-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        
        .story-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .story-desc {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .info-pills {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .pill {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        
        .cta-button {
            background: white;
            color: #667eea;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: inline-block;
        }
        
        /* 인스타 푸터 */
        .insta-footer {
            padding: 25px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .like-btn {
            font-size: 28px;
            cursor: pointer;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .poster {
                max-width: 600px;
            }
            
            .main-title {
                font-size: 48px;
            }
            
            .hashtags {
                font-size: 18px;
            }
            
            .story-grid {
                gap: 15px;
            }
            
            .story-emoji {
                font-size: 40px;
            }
            
            .story-title {
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .poster {
                max-width: 400px;
            }
            
            .main-content {
                padding: 30px 25px;
            }
            
            .main-title {
                font-size: 36px;
            }
            
            .hashtags {
                font-size: 16px;
            }
            
            .cta-button {
                padding: 15px 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- 인스타 헤더 -->
        <div class="insta-header">
            <div class="profile-pic">🏫</div>
            <div class="profile-info">
                <div class="username">근화여자중학교</div>
                <div class="location">경주 · 겨울방학 특별 프로그램</div>
            </div>
        </div>
        
        <!-- 메인 콘텐츠 -->
        <div class="main-content">
            <div class="main-title">
                자기주도학습<br>
                UP 챌린지
            </div>
            
            <div class="hashtags">
                #겨울방학_대박 #성적UP<br>
                #친구들이랑_함께
            </div>
            
            <div class="story-grid">
                <div class="story-item">
                    <span class="story-emoji">📚</span>
                    <div class="story-title">맞춤 학습</div>
                    <div class="story-desc">나만의 플랜</div>
                </div>
                
                <div class="story-item">
                    <span class="story-emoji">🎯</span>
                    <div class="story-title">주 1회 피드백</div>
                    <div class="story-desc">1:1 코칭</div>
                </div>
                
                <div class="story-item">
                    <span class="story-emoji">👥</span>
                    <div class="story-title">함께 성장</div>
                    <div class="story-desc">친구들과</div>
                </div>
                
                <div class="story-item">
                    <span class="story-emoji">🏆</span>
                    <div class="story-title">성적 향상</div>
                    <div class="story-desc">확실한 결과</div>
                </div>
            </div>
            
            <div class="info-pills">
                <div class="pill">🎯 20~40명 모집</div>
                <div class="pill">📅 ~12/26 마감</div>
                <div class="pill">⏰ 4주 프로그램</div>
            </div>
            
            <a href="#" class="cta-button">지금 신청하기 🚀</a>
        </div>
        
        <!-- 인스타 푸터 -->
        <div class="insta-footer">
            <div class="like-btn">❤️</div>
            <div class="like-btn">💬</div>
            <div class="like-btn">📤</div>
            <div style="flex: 1;"></div>
            <div class="like-btn">🔖</div>
        </div>
    </div>
</body>
</html>
