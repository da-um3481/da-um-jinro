<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입시 분석 및 합격 예측 - DA.UM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            
            nav h1 {
                font-size: 0.95rem !important;
            }
            
            nav p {
                font-size: 0.7rem !important;
            }
            
            nav a {
                padding: 0.5rem !important;
                font-size: 0.8rem !important;
            }
            
            main {
                padding: 1rem !important;
            }
            
            .glass-effect {
                padding: 1rem !important;
                margin-bottom: 1rem !important;
            }
            
            .glass-effect h2 {
                font-size: 1.25rem !important;
            }
            
            .glass-effect h3 {
                font-size: 1rem !important;
            }
            
            /* 성적 입력 그리드 */
            .md\\:grid-cols-2 {
                grid-template-columns: 1fr !important;
            }
            
            /* 라디오 버튼 그리드 */
            .grid-cols-2 {
                grid-template-columns: 1fr !important;
            }
            
            select,
            input {
                font-size: 0.875rem !important;
                padding: 0.75rem !important;
            }
            
            button {
                padding: 0.875rem !important;
                font-size: 0.95rem !important;
            }
            
            /* 대학 추천 카드 */
            .flex.items-center.justify-between {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 0.75rem;
            }
            
            .flex.items-center.space-x-3 {
                gap: 0.5rem !important;
            }
        }
        
        @media (max-width: 480px) {
            nav h1 {
                font-size: 0.85rem !important;
            }
            
            .glass-effect {
                padding: 0.875rem !important;
            }
            
            .glass-effect h2 {
                font-size: 1.1rem !important;
            }
        }
    </style>
    <script src="js/security.js"></script>
</head>
<body>
    <!-- 상단 네비게이션 -->
    <nav class="glass-effect sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-university text-3xl text-purple-600"></i>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900">입시 분석 및 합격 예측</h1>
                        <p class="text-xs text-gray-600">2025학년도 기준</p>
                    </div>
                </div>
                <a href="teacher-dashboard.html?level=high" class="flex items-center space-x-2 px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full text-sm font-semibold hover:shadow-lg transition">
                    <i class="fas fa-arrow-left"></i>
                    <span>대시보드</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <!-- 성적 입력 섹션 -->
        <div class="glass-effect rounded-2xl shadow-xl p-8 animate-slide-up">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                <i class="fas fa-edit text-purple-600 mr-3"></i>
                성적 정보 입력
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 모의고사 등급 -->
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-4">📊 모의고사 등급 (9월 기준)</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">국어</label>
                            <select id="korean" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="">선택</option>
                                <option value="1">1등급</option>
                                <option value="2">2등급</option>
                                <option value="3">3등급</option>
                                <option value="4">4등급</option>
                                <option value="5">5등급</option>
                                <option value="6">6등급</option>
                                <option value="7">7등급</option>
                                <option value="8">8등급</option>
                                <option value="9">9등급</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">수학</label>
                            <select id="math" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="">선택</option>
                                <option value="1">1등급</option>
                                <option value="2">2등급</option>
                                <option value="3">3등급</option>
                                <option value="4">4등급</option>
                                <option value="5">5등급</option>
                                <option value="6">6등급</option>
                                <option value="7">7등급</option>
                                <option value="8">8등급</option>
                                <option value="9">9등급</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">영어</label>
                            <select id="english" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="">선택</option>
                                <option value="1">1등급</option>
                                <option value="2">2등급</option>
                                <option value="3">3등급</option>
                                <option value="4">4등급</option>
                                <option value="5">5등급</option>
                                <option value="6">6등급</option>
                                <option value="7">7등급</option>
                                <option value="8">8등급</option>
                                <option value="9">9등급</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">탐구 평균</label>
                            <select id="inquiry" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="">선택</option>
                                <option value="1">1등급</option>
                                <option value="2">2등급</option>
                                <option value="3">3등급</option>
                                <option value="4">4등급</option>
                                <option value="5">5등급</option>
                                <option value="6">6등급</option>
                                <option value="7">7등급</option>
                                <option value="8">8등급</option>
                                <option value="9">9등급</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- 내신 등급 -->
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-4">📚 내신 등급 (3년 평균)</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">전체 내신 평균</label>
                            <input type="number" id="gpa" step="0.1" min="1" max="9" placeholder="예: 2.5" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        </div>
                        
                        <div class="mt-6">
                            <h4 class="text-sm font-semibold text-gray-700 mb-3">희망 계열 선택</h4>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center space-x-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-500 transition">
                                    <input type="radio" name="major" value="인문" class="w-4 h-4 text-purple-600">
                                    <span class="text-sm font-medium">인문계열</span>
                                </label>
                                <label class="flex items-center space-x-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-500 transition">
                                    <input type="radio" name="major" value="자연" class="w-4 h-4 text-purple-600">
                                    <span class="text-sm font-medium">자연계열</span>
                                </label>
                                <label class="flex items-center space-x-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-500 transition">
                                    <input type="radio" name="major" value="예체능" class="w-4 h-4 text-purple-600">
                                    <span class="text-sm font-medium">예체능</span>
                                </label>
                                <label class="flex items-center space-x-2 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-purple-500 transition">
                                    <input type="radio" name="major" value="의약학" class="w-4 h-4 text-purple-600">
                                    <span class="text-sm font-medium">의약학계열</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">학생 이름 (선택)</label>
                            <input type="text" id="studentName" placeholder="김민준" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        </div>
                    </div>
                </div>
            </div>
            
            <button onclick="analyzeAdmission()" class="mt-8 w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all hover:scale-105">
                <i class="fas fa-chart-line mr-2"></i>입시 분석 시작
            </button>
        </div>

        <!-- 분석 결과 섹션 (숨김 처리) -->
        <div id="resultSection" class="hidden space-y-6">
            <!-- 종합 평가 -->
            <div class="glass-effect rounded-2xl shadow-xl p-8 animate-slide-up">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                    <i class="fas fa-trophy text-yellow-500 mr-3"></i>
                    종합 평가
                </h2>
                <div id="overallResult" class="space-y-4"></div>
            </div>

            <!-- 추천 대학 -->
            <div class="glass-effect rounded-2xl shadow-xl p-8 animate-slide-up">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                    <i class="fas fa-university text-purple-600 mr-3"></i>
                    추천 대학 목록
                </h2>
                <div id="universityList" class="space-y-3"></div>
            </div>

            <!-- 보완 사항 -->
            <div class="glass-effect rounded-2xl shadow-xl p-8 animate-slide-up">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                    <i class="fas fa-lightbulb text-yellow-500 mr-3"></i>
                    학습 보완 사항
                </h2>
                <div id="improvements" class="space-y-3"></div>
            </div>

            <!-- 성적 비교 차트 -->
            <div class="glass-effect rounded-2xl shadow-xl p-8 animate-slide-up">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                    <i class="fas fa-chart-bar text-blue-600 mr-3"></i>
                    과목별 성적 분석
                </h2>
                <canvas id="gradeChart" width="400" height="200"></canvas>
            </div>
        </div>

    </main>

    <script>
        // 대학 데이터베이스 (2024-2025 기준)
        const universityDatabase = {
            "서울대학교": { tier: 1, cutline: 1.3, region: "서울", type: "국립" },
            "연세대학교": { tier: 1, cutline: 1.5, region: "서울", type: "사립" },
            "고려대학교": { tier: 1, cutline: 1.6, region: "서울", type: "사립" },
            "서강대학교": { tier: 2, cutline: 1.8, region: "서울", type: "사립" },
            "성균관대학교": { tier: 2, cutline: 1.9, region: "서울", type: "사립" },
            "한양대학교": { tier: 2, cutline: 2.0, region: "서울", type: "사립" },
            "중앙대학교": { tier: 2, cutline: 2.2, region: "서울", type: "사립" },
            "경희대학교": { tier: 2, cutline: 2.3, region: "서울", type: "사립" },
            "한국외국어대학교": { tier: 2, cutline: 2.3, region: "서울", type: "사립" },
            "서울시립대학교": { tier: 2, cutline: 2.4, region: "서울", type: "공립" },
            "건국대학교": { tier: 3, cutline: 2.5, region: "서울", type: "사립" },
            "동국대학교": { tier: 3, cutline: 2.6, region: "서울", type: "사립" },
            "홍익대학교": { tier: 3, cutline: 2.7, region: "서울", type: "사립" },
            "숙명여자대학교": { tier: 3, cutline: 2.7, region: "서울", type: "사립" },
            "숭실대학교": { tier: 3, cutline: 2.8, region: "서울", type: "사립" },
            "세종대학교": { tier: 3, cutline: 2.9, region: "서울", type: "사립" },
            "국민대학교": { tier: 3, cutline: 3.0, region: "서울", type: "사립" },
            "광운대학교": { tier: 3, cutline: 3.1, region: "서울", type: "사립" },
            "명지대학교": { tier: 4, cutline: 3.2, region: "서울", type: "사립" },
            "가톨릭대학교": { tier: 4, cutline: 3.3, region: "경기", type: "사립" },
            "성신여자대학교": { tier: 4, cutline: 3.3, region: "서울", type: "사립" },
            "서울여자대학교": { tier: 4, cutline: 3.4, region: "서울", type: "사립" },
            "인하대학교": { tier: 3, cutline: 2.8, region: "인천", type: "사립" },
            "아주대학교": { tier: 3, cutline: 2.9, region: "경기", type: "사립" },
            "경기대학교": { tier: 4, cutline: 3.5, region: "경기", type: "사립" },
            "부산대학교": { tier: 2, cutline: 2.3, region: "부산", type: "국립" },
            "경북대학교": { tier: 2, cutline: 2.5, region: "대구", type: "국립" },
            "전남대학교": { tier: 3, cutline: 2.8, region: "광주", type: "국립" },
            "충남대학교": { tier: 3, cutline: 2.9, region: "대전", type: "국립" },
            "전북대학교": { tier: 3, cutline: 3.0, region: "전주", type: "국립" }
        };

        function analyzeAdmission() {
            // 입력값 가져오기
            const korean = parseInt(document.getElementById('korean').value);
            const math = parseInt(document.getElementById('math').value);
            const english = parseInt(document.getElementById('english').value);
            const inquiry = parseInt(document.getElementById('inquiry').value);
            const gpa = parseFloat(document.getElementById('gpa').value);
            const major = document.querySelector('input[name="major"]:checked')?.value;
            const studentName = document.getElementById('studentName').value || "학생";

            // 유효성 검사
            if (!korean || !math || !english || !inquiry || !gpa || !major) {
                alert('모든 항목을 입력해주세요!');
                return;
            }

            // 평균 등급 계산
            const avgGrade = (korean + math + english + inquiry) / 4;

            // 결과 섹션 표시
            document.getElementById('resultSection').classList.remove('hidden');

            // 종합 평가 생성
            generateOverallResult(studentName, avgGrade, gpa, korean, math, english, inquiry);

            // 추천 대학 목록 생성
            generateUniversityList(avgGrade, gpa, major);

            // 보완 사항 생성
            generateImprovements(korean, math, english, inquiry, gpa);

            // 차트 생성
            createGradeChart(korean, math, english, inquiry);

            // 결과로 스크롤
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function generateOverallResult(name, avgGrade, gpa, korean, math, english, inquiry) {
            const container = document.getElementById('overallResult');
            
            let level, color, icon, message;
            if (avgGrade <= 2.0 && gpa <= 2.5) {
                level = "최상위권";
                color = "text-yellow-600";
                icon = "fa-crown";
                message = `${name} 학생은 서울 주요 대학 합격이 가능한 최상위권입니다!`;
            } else if (avgGrade <= 3.0 && gpa <= 3.5) {
                level = "상위권";
                color = "text-blue-600";
                icon = "fa-star";
                message = `${name} 학생은 서울 및 수도권 주요 대학 합격이 가능한 상위권입니다!`;
            } else if (avgGrade <= 4.0 && gpa <= 4.5) {
                level = "중위권";
                color = "text-green-600";
                icon = "fa-check-circle";
                message = `${name} 학생은 수도권 대학 합격이 가능한 중위권입니다!`;
            } else {
                level = "하위권";
                color = "text-orange-600";
                icon = "fa-exclamation-triangle";
                message = `${name} 학생은 지방 국립대 및 수도권 대학 합격을 목표로 더 노력이 필요합니다!`;
            }

            container.innerHTML = `
                <div class="flex items-center space-x-4 p-6 bg-gradient-to-r from-purple-50 to-indigo-50 rounded-xl">
                    <div class="w-20 h-20 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full flex items-center justify-center">
                        <i class="fas ${icon} text-white text-3xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold ${color} mb-2">${level}</h3>
                        <p class="text-gray-700 text-lg">${message}</p>
                        <div class="mt-3 flex space-x-4">
                            <span class="px-3 py-1 bg-white rounded-full text-sm font-semibold">모의고사 평균: ${avgGrade.toFixed(1)}등급</span>
                            <span class="px-3 py-1 bg-white rounded-full text-sm font-semibold">내신 평균: ${gpa}등급</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateUniversityList(avgGrade, gpa, major) {
            const container = document.getElementById('universityList');
            const recommendations = [];

            // 합격 가능한 대학 찾기
            for (const [name, data] of Object.entries(universityDatabase)) {
                const score = (avgGrade + gpa) / 2;
                const diff = Math.abs(score - data.cutline);
                
                let probability;
                if (score <= data.cutline - 0.5) {
                    probability = "높음";
                } else if (score <= data.cutline + 0.3) {
                    probability = "중간";
                } else if (score <= data.cutline + 0.7) {
                    probability = "낮음";
                } else {
                    continue; // 너무 차이나면 제외
                }

                recommendations.push({
                    name,
                    region: data.region,
                    type: data.type,
                    cutline: data.cutline,
                    probability,
                    diff
                });
            }

            // 합격 가능성 순으로 정렬
            recommendations.sort((a, b) => a.diff - b.diff);

            // 상위 10개만 표시
            const top10 = recommendations.slice(0, 10);

            if (top10.length === 0) {
                container.innerHTML = '<p class="text-gray-600">추천 대학이 없습니다. 성적을 더 올려보세요!</p>';
                return;
            }

            container.innerHTML = top10.map((univ, index) => {
                const probColor = {
                    "높음": "bg-green-100 text-green-800",
                    "중간": "bg-yellow-100 text-yellow-800",
                    "낮음": "bg-orange-100 text-orange-800"
                };

                const icon = {
                    "높음": "fa-check-circle text-green-600",
                    "중간": "fa-exclamation-circle text-yellow-600",
                    "낮음": "fa-times-circle text-orange-600"
                };

                return `
                    <div class="flex items-center justify-between p-4 bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl hover:shadow-lg transition">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                                ${index + 1}
                            </div>
                            <div>
                                <h4 class="text-lg font-bold text-gray-900">${univ.name}</h4>
                                <p class="text-sm text-gray-600">${univ.region} · ${univ.type} · 컷라인: ${univ.cutline}등급</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="px-4 py-2 ${probColor[univ.probability]} rounded-full font-semibold text-sm">
                                합격 가능성: ${univ.probability}
                            </span>
                            <i class="fas ${icon[univ.probability]} text-2xl"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function generateImprovements(korean, math, english, inquiry, gpa) {
            const container = document.getElementById('improvements');
            const improvements = [];

            // 과목별 분석
            if (korean >= 3) {
                improvements.push({
                    subject: "국어",
                    icon: "fa-book",
                    color: "blue",
                    message: "비문학 독해력 향상이 필요합니다. 매일 지문 2개 이상 풀이를 권장합니다."
                });
            }
            if (math >= 3) {
                improvements.push({
                    subject: "수학",
                    icon: "fa-calculator",
                    color: "red",
                    message: "개념 이해와 문제 유형 학습이 필요합니다. 기출 문제 풀이를 강화하세요."
                });
            }
            if (english >= 3) {
                improvements.push({
                    subject: "영어",
                    icon: "fa-language",
                    color: "green",
                    message: "어휘력과 독해 속도 향상이 필요합니다. EBS 교재 정독을 권장합니다."
                });
            }
            if (inquiry >= 3) {
                improvements.push({
                    subject: "탐구",
                    icon: "fa-flask",
                    color: "purple",
                    message: "개념 암기와 문제 적용 능력이 필요합니다. 개념서 복습을 강화하세요."
                });
            }
            if (gpa >= 3.0) {
                improvements.push({
                    subject: "내신",
                    icon: "fa-graduation-cap",
                    color: "yellow",
                    message: "학교 시험 대비 철저히 하세요. 학교 프린트와 기출 문제 반복 학습이 중요합니다."
                });
            }

            if (improvements.length === 0) {
                improvements.push({
                    subject: "유지",
                    icon: "fa-thumbs-up",
                    color: "green",
                    message: "현재 성적을 잘 유지하고 있습니다! 꾸준히 학습하세요."
                });
            }

            const colorMap = {
                blue: "from-blue-500 to-blue-600",
                red: "from-red-500 to-red-600",
                green: "from-green-500 to-green-600",
                purple: "from-purple-500 to-purple-600",
                yellow: "from-yellow-500 to-yellow-600"
            };

            container.innerHTML = improvements.map(item => `
                <div class="flex items-start space-x-4 p-4 bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl">
                    <div class="w-12 h-12 bg-gradient-to-br ${colorMap[item.color]} rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas ${item.icon} text-white text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-lg font-bold text-gray-900 mb-1">${item.subject}</h4>
                        <p class="text-gray-700">${item.message}</p>
                    </div>
                </div>
            `).join('');
        }

        function createGradeChart(korean, math, english, inquiry) {
            const ctx = document.getElementById('gradeChart').getContext('2d');
            
            // 기존 차트 제거
            if (window.gradeChartInstance) {
                window.gradeChartInstance.destroy();
            }

            window.gradeChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['국어', '수학', '영어', '탐구'],
                    datasets: [{
                        label: '현재 등급',
                        data: [korean, math, english, inquiry],
                        backgroundColor: [
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(168, 85, 247, 0.8)'
                        ],
                        borderColor: [
                            'rgb(59, 130, 246)',
                            'rgb(239, 68, 68)',
                            'rgb(34, 197, 94)',
                            'rgb(168, 85, 247)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 9,
                            reverse: true,
                            ticks: {
                                stepSize: 1,
                                callback: function(value) {
                                    return value + '등급';
                                }
                            },
                            title: {
                                display: true,
                                text: '등급 (낮을수록 좋음)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: '과목별 등급 현황',
                            font: {
                                size: 16,
                                weight: 'bold'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
