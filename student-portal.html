<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 학습 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out;
        }
        
        .card-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        
        .timer-display {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }
        
        /* 프로그레스 바 애니메이션 */
        .progress-bar {
            transition: width 0.3s ease-out;
        }
        
        /* 버튼 호버 효과 */
        .btn-primary {
            transition: all 0.2s ease;
        }
        
        .btn-primary:active {
            transform: scale(0.95);
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .mobile-compact {
                padding: 1rem;
            }
        }
        
        /* 성공 메시지 스타일 */
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            animation: slideUp 0.3s ease-out;
        }
        
        /* 추가 모바일 최적화 */
        @media (max-width: 768px) {
            nav h1 {
                font-size: 0.95rem !important;
            }
            
            nav p {
                font-size: 0.7rem !important;
            }
            
            .glass-effect h2,
            .glass-effect h3 {
                font-size: 1.1rem !important;
            }
            
            .grid-cols-3 {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
    <!-- 학생 포털은 보안 불필요 -->
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-gray-50 min-h-screen">
    
    <!-- 성공 메시지 (토스트) -->
    <div id="successMessage" class="hidden success-toast"></div>
    
    <!-- 상단 네비게이션 -->
    <nav class="glass-effect sticky top-0 z-50 shadow-lg border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- 로고 & 인사말 -->
                <div class="flex items-center space-x-3">
                    <div class="text-3xl">🎓</div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-900">나의 학습 포털</h1>
                        <p class="text-xs text-gray-600" id="studentInfo">학생을 선택하세요</p>
                    </div>
                </div>
                
                <!-- 우측 메뉴 (대시보드 링크 제거) -->
                <div class="flex items-center space-x-2">
                    <a href="student-intro.html" class="p-2 text-gray-600 hover:text-gray-600 transition">
                        <i class="fas fa-question-circle text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        
        <!-- 학생 이름 입력 -->
        <div class="glass-effect rounded-2xl shadow-lg p-6 animate-slide-up">
            <label class="block text-sm font-semibold text-gray-700 mb-3">
                <i class="fas fa-user-circle mr-2 text-gray-600"></i>내 이름 입력
            </label>
            <div class="flex space-x-3">
                <input 
                    type="text" 
                    id="studentNameInput" 
                    placeholder="이름을 입력하세요 (예: 김민준)"
                    class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition text-base"
                    onkeypress="if(event.key==='Enter') loadStudentByName()"
                >
                <button 
                    onclick="loadStudentByName()"
                    class="px-6 py-3 bg-gradient-to-r from-gray-600 to-indigo-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all hover:scale-105 active:scale-95"
                >
                    <i class="fas fa-search mr-2"></i>찾기
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2">
                <i class="fas fa-info-circle mr-1"></i>이름을 정확히 입력하고 "찾기" 버튼을 눌러주세요
            </p>
        </div>

        <!-- 오늘의 날짜 & 목표 -->
        <div class="card-gradient rounded-2xl shadow-xl p-6 text-white animate-slide-up">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm opacity-90 mb-1">오늘</p>
                    <p class="text-2xl font-bold" id="todayDate">2025년 12월 7일</p>
                </div>
                <div class="text-right">
                    <p class="text-sm opacity-90 mb-1">목표 학습시간</p>
                    <div class="flex items-center space-x-2">
                        <p class="text-2xl font-bold" id="headerTarget">3.5시간</p>
                        <span id="headerDayType" class="text-xs px-3 py-1 bg-white/20 rounded-full">평일</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 animate-slide-up">
            <!-- 오늘의 학습시간 -->
            <div class="glass-effect rounded-2xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-clock text-white text-xl"></i>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-600">오늘의 학습</p>
                        <p class="text-3xl font-bold text-green-800"><span id="todayStudyTime">0</span><span class="text-xl">분</span></p>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs text-gray-600">
                        <span>목표</span>
                        <span id="goalTime">210분</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="timeProgress" class="progress-bar bg-gradient-to-r from-blue-500 to-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 완료한 과목 -->
            <div class="glass-effect rounded-2xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-green-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-check-circle text-white text-xl"></i>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-600">완료 과목</p>
                        <p class="text-3xl font-bold text-green-600"><span id="completedSubjects">0</span><span class="text-xl">/5</span></p>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs text-gray-600">
                        <span>진행률</span>
                        <span id="subjectPercent">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="subjectProgress" class="progress-bar bg-gradient-to-r from-green-500 to-green-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 이번주 달성률 -->
            <div class="glass-effect rounded-2xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-gray-500 to-gray-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-trophy text-white text-xl"></i>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-600">주간 달성률</p>
                        <p class="text-3xl font-bold text-gray-600"><span id="weeklyAchievement">0</span><span class="text-xl">%</span></p>
                    </div>
                </div>
                <p class="text-xs text-gray-600">이번주 평균</p>
            </div>
        </div>

        <!-- 오늘의 학습 체크리스트 -->
        <div class="glass-effect rounded-2xl shadow-lg p-6 animate-slide-up">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900 flex items-center">
                    <i class="fas fa-clipboard-list text-gray-600 mr-3"></i>
                    오늘의 학습
                </h2>
                <span class="text-sm text-gray-500" id="checklistCount">0개</span>
            </div>
            
            <div id="checklistContainer" class="space-y-3">
                <!-- 동적으로 생성됨 -->
            </div>
            
            <div id="emptyChecklist" class="text-center py-12">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-calendar-times text-gray-400 text-3xl"></i>
                </div>
                <p class="text-gray-600 font-semibold mb-2">오늘의 학습 계획이 없어요</p>
                <p class="text-sm text-gray-500">선생님께 학습 계획을 요청해주세요</p>
            </div>
        </div>

        <!-- 추천 교재 -->
        <div class="glass-effect rounded-2xl shadow-lg p-6 animate-slide-up">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900 flex items-center">
                    <i class="fas fa-book-open text-gray-600 mr-3"></i>
                    추천 교재
                </h2>
            </div>
            
            <div id="materialsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 동적으로 생성됨 -->
            </div>
            
            <div id="emptyMaterials" class="text-center py-12">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-book text-gray-400 text-3xl"></i>
                </div>
                <p class="text-gray-600 font-semibold mb-2">추천 교재가 없어요</p>
                <p class="text-sm text-gray-500">선생님이 곧 교재를 추천해줄 거예요</p>
            </div>
        </div>

        <!-- 선생님 피드백 -->
        <div class="glass-effect rounded-2xl shadow-lg p-6 animate-slide-up mb-20">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900 flex items-center">
                    <i class="fas fa-comment-dots text-gray-600 mr-3"></i>
                    선생님 피드백
                </h2>
            </div>
            
            <div id="feedbackContainer">
                <!-- 동적으로 생성됨 -->
            </div>
            
            <div id="emptyFeedback" class="text-center py-12">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-comment-slash text-gray-400 text-3xl"></i>
                </div>
                <p class="text-gray-600 font-semibold mb-2">아직 피드백이 없어요</p>
                <p class="text-sm text-gray-500">열심히 학습하면 선생님이 피드백을 남겨줄 거예요</p>
            </div>
        </div>
    </main>

    <!-- 하단 퀵 네비게이션 (모바일) -->
    <nav class="sm:hidden fixed bottom-0 left-0 right-0 glass-effect border-t border-gray-200 shadow-2xl">
        <div class="grid grid-cols-2 gap-1 p-2">
            <a href="student-portal.html" class="flex flex-col items-center justify-center py-3 text-gray-600 bg-gray-50 rounded-xl">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-xs font-semibold">학습</span>
            </a>
            <a href="student-intro.html" class="flex flex-col items-center justify-center py-3 text-gray-600 hover:bg-gray-50 rounded-xl transition">
                <i class="fas fa-question-circle text-xl mb-1"></i>
                <span class="text-xs font-semibold">사용법</span>
            </a>
        </div>
    </nav>

    <script src="js/student-portal.js"></script>
</body>
</html>
