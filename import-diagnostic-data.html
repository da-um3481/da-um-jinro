        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        .info {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
        }
        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }
        button:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        button.danger {
            background: #ef4444;
        }
        button.danger:hover {
            background: #dc2626;
        }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
        }
        .result.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }
        pre {
            background: #1f2937;
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 300px;
        }
    </style>

            updateStats();
            document.getElementById('dataPreview').textContent = JSON.stringify(diagnosticData, null, 2);
        });

        function updateStats() {
            const currentData = JSON.parse(localStorage.getItem('diagnostic_results')) || [];
            document.getElementById('currentCount').textContent = currentData.length;
            document.getElementById('newCount').textContent = diagnosticData.length;
            document.getElementById('totalCount').textContent = currentData.length + diagnosticData.length;
        }

        function insertDiagnosticData() {
            const confirm = window.confirm(`${diagnosticData.length}명의 진단평가 데이터를 삽입하시겠습니까?`);
            if (!confirm) return;

            try {
                // 기존 데이터 가져오기
                const existingData = JSON.parse(localStorage.getItem('diagnostic_results')) || [];
                
                // 새 데이터 추가
                const mergedData = [...existingData, ...diagnosticData];
                
                // localStorage에 저장
                localStorage.setItem('diagnostic_results', JSON.stringify(mergedData));
                
                // 결과 표시
                const resultEl = document.getElementById('result');
                resultEl.className = 'result success';
                resultEl.innerHTML = `
                    ✅ <strong>${diagnosticData.length}명</strong>의 진단평가 데이터가 성공적으로 삽입되었습니다!<br>

                        📊 결과 페이지로 이동
                    </button>
                `;
                
                updateStats();
                
            } catch (error) {
                const resultEl = document.getElementById('result');
                resultEl.className = 'result error';
                resultEl.innerHTML = `❌ 오류 발생: ${error.message}`;
                console.error('삽입 오류:', error);
            }
        }

        function clearAllData() {
            const confirm = window.confirm('⚠️ 정말로 모든 진단평가 데이터를 삭제하시겠습니까?');
            if (!confirm) return;

            localStorage.removeItem('diagnostic_results');
            
            const resultEl = document.getElementById('result');
            resultEl.className = 'result success';
            resultEl.innerHTML = '🗑️ 모든 데이터가 삭제되었습니다.';
            
            updateStats();
        }
