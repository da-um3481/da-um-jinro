<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA.UM 겨울방학 30일 - 주간 일정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #0369a1 100%);
            min-height: 100vh;
        }
        
        /* 눈송이 애니메이션 */
        @keyframes snowfall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(100px); opacity: 0; }
        }
        
        .snowflake {
            position: fixed;
            top: -10vh;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.5rem;
            z-index: 1;
            pointer-events: none;
            animation: snowfall linear infinite;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- 눈송이 효과 -->
    <div id="snowflakes"></div>

    <!-- 헤더 -->
    <header class="glass-effect shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-6 py-5">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://www.genspark.ai/api/files/s/3voQr3x8" alt="DA.UM Logo" class="w-14 h-14 rounded-xl shadow-lg">
                    <div>
                        <h1 class="text-2xl font-black bg-gradient-to-r from-cyan-600 to-blue-600 bg-clip-text text-transparent">
                            겨울방학 30일 - 주간 일정
                        </h1>
                        <p class="text-xs text-gray-600 font-medium">❄️ 4주간의 학습 계획</p>
                    </div>
                </div>
                <nav class="flex space-x-2">
                    <a href="winter-index.html" class="px-4 py-2.5 text-gray-700 hover:bg-gray-100 rounded-xl transition font-medium">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="winter-student-portal.html" class="px-4 py-2.5 text-gray-700 hover:bg-gray-100 rounded-xl transition font-medium">
                        <i class="fas fa-user-graduate mr-2"></i>학생포털
                    </a>
                    <a href="winter-weekly-schedule.html" class="px-4 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-xl hover:shadow-lg transition font-medium">
                        <i class="fas fa-calendar-week mr-2"></i>주간일정
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="container mx-auto px-6 py-8">
        <!-- 학생 선택 -->
        <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        <i class="fas fa-user-circle mr-2 text-cyan-600"></i>학생 이름
                    </label>
                    <input 
                        type="text" 
                        id="studentSelect" 
                        placeholder="학생 이름 입력 (예: 김민준)"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition text-base"
                        onkeypress="if(event.key==='Enter') loadWeeklySchedule()"
                    >
                </div>
                <div class="flex items-end">
                    <button 
                        onclick="loadWeeklySchedule()"
                        class="w-full px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all hover:scale-105 active:scale-95"
                    >
                        <i class="fas fa-search mr-2"></i>주간 일정 조회
                    </button>
                </div>
            </div>
            <div class="mt-4 flex space-x-3">
                <button 
                    onclick="generateAutoSchedule()"
                    class="flex-1 px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition-all hover:scale-105 active:scale-95"
                >
                    <i class="fas fa-magic mr-2"></i>자동 스케줄 생성
                </button>
            </div>
        </div>

        <!-- 학습 시간 가이드 -->
        <div id="timeGuideCard" class="glass-effect rounded-2xl p-6 shadow-xl mb-6 hidden">
            <h3 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-clock text-cyan-500 mr-2"></i>주간 학습 시간 가이드
            </h3>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-gradient-to-br from-cyan-50 to-blue-50 rounded-xl p-4 border-2 border-cyan-300">
                    <div class="text-center">
                        <div class="text-sm text-gray-600 mb-1">평일 (월~금)</div>
                        <div class="text-3xl font-black text-cyan-600">3.5시간</div>
                        <div class="text-xs text-gray-500 mt-1">하루 3과목</div>
                    </div>
                </div>
                <div class="bg-gradient-to-br from-purple-50 to-indigo-50 rounded-xl p-4 border-2 border-purple-300">
                    <div class="text-center">
                        <div class="text-sm text-gray-600 mb-1">주말 (토~일)</div>
                        <div class="text-3xl font-black text-purple-600">5시간</div>
                        <div class="text-xs text-gray-500 mt-1">하루 3과목</div>
                    </div>
                </div>
                <div class="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-xl p-4 border-2 border-indigo-400">
                    <div class="text-center">
                        <div class="text-sm text-gray-600 mb-1">주간 총계</div>
                        <div class="text-3xl font-black text-indigo-600">25시간</div>
                        <div class="text-xs text-gray-500 mt-1">집중 학습</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 주간 스케줄 섹션 (동적 표시) -->
        <div id="scheduleSection" class="hidden">

            <!-- 월요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-cyan-500 mr-2"></i>월요일
                    </h3>
                    <button onclick="editDaySchedule('monday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="mondaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <!-- 화요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-blue-500 mr-2"></i>화요일
                    </h3>
                    <button onclick="editDaySchedule('tuesday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="tuesdaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <!-- 수요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-indigo-500 mr-2"></i>수요일
                    </h3>
                    <button onclick="editDaySchedule('wednesday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="wednesdaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <!-- 목요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-purple-500 mr-2"></i>목요일
                    </h3>
                    <button onclick="editDaySchedule('thursday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="thursdaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <!-- 금요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-pink-500 mr-2"></i>금요일
                    </h3>
                    <button onclick="editDaySchedule('friday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="fridaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <!-- 토요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-orange-500 mr-2"></i>토요일
                    </h3>
                    <button onclick="editDaySchedule('saturday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="saturdaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <!-- 일요일 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-black text-gray-800">
                        <i class="fas fa-calendar-day text-red-500 mr-2"></i>일요일
                    </h3>
                    <button onclick="editDaySchedule('sunday')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">
                        <i class="fas fa-edit mr-1"></i>수정
                    </button>
                </div>
                <div id="sundaySchedule">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // 눈송이 생성
        const snowflakesContainer = document.getElementById('snowflakes');
        for (let i = 0; i < 15; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 10 + 10) + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowflakesContainer.appendChild(snowflake);
        }

        // 자동 스케줄 생성 함수
        function generateAutoSchedule() {
            const studentName = document.getElementById('studentSelect').value.trim();
            
            if (!studentName) {
                alert('학생 이름을 먼저 입력해주세요!');
                return;
            }
            
            // 시간 가이드 카드 표시
            document.getElementById('timeGuideCard').classList.remove('hidden');
            document.getElementById('scheduleSection').classList.remove('hidden');
            
            // 기본 주간 스케줄 템플릿
            const weekdaySchedule = [
                { time: '09:00-10:00', subject: '수학', icon: '📐', color: 'blue', goal: '개념 이해 + 문제풀이 30문제' },
                { time: '10:15-11:15', subject: '영어', icon: '🗣️', color: 'green', goal: '독해 + 문법 + 단어 50개' },
                { time: '11:30-12:30', subject: '국어', icon: '📖', color: 'red', goal: '독서 + 문법 + 어휘 학습' }
            ];
            
            const saturdaySchedule = [
                { time: '09:00-10:30', subject: '수학', icon: '📐', color: 'blue', goal: '심화 문제풀이 50문제' },
                { time: '10:45-12:15', subject: '영어', icon: '🗣️', color: 'green', goal: '모의고사 + 오답정리' },
                { time: '14:00-15:00', subject: '국어', icon: '📖', color: 'red', goal: '독해 집중 훈련' },
                { time: '15:15-16:15', subject: '과학', icon: '🔬', color: 'purple', goal: '실험 복습 + 개념 정리' }
            ];
            
            const sundaySchedule = [
                { time: '09:00-10:30', subject: '영어', icon: '🗣️', color: 'green', goal: '듣기 + 말하기 연습' },
                { time: '10:45-12:15', subject: '수학', icon: '📐', color: 'blue', goal: '주간 복습 + 오답정리' },
                { time: '14:00-15:00', subject: '사회', icon: '🌍', color: 'yellow', goal: '개념 정리 + 시사 연계' },
                { time: '15:15-16:15', subject: '전과목', icon: '📚', color: 'gray', goal: '주간 복습 + 다음 주 계획' }
            ];
            
            // 평일 스케줄 생성 (월~금)
            const weekdays = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'];
            const weekdayNames = ['월요일', '화요일', '수요일', '목요일', '금요일'];
            
            weekdays.forEach((day, index) => {
                const scheduleDiv = document.getElementById(`${day}Schedule`);
                scheduleDiv.innerHTML = renderSchedule(weekdaySchedule, weekdayNames[index]);
            });
            
            // 토요일 스케줄
            document.getElementById('saturdaySchedule').innerHTML = renderSchedule(saturdaySchedule, '토요일');
            
            // 일요일 스케줄
            document.getElementById('sundaySchedule').innerHTML = renderSchedule(sundaySchedule, '일요일');
            
            // 로컬스토리지에 저장
            const scheduleData = {
                studentName: studentName,
                weekday: weekdaySchedule,
                saturday: saturdaySchedule,
                sunday: sundaySchedule,
                createdAt: new Date().toISOString()
            };
            
            localStorage.setItem(`schedule_${studentName}`, JSON.stringify(scheduleData));
            
            // 성공 메시지
            showToast(`✅ ${studentName} 학생의 주간 일정이 자동 생성되었습니다!`);
        }
        
        // 스케줄 렌더링 함수
        function renderSchedule(schedule, dayName) {
            const colorMap = {
                'blue': 'from-blue-500 to-blue-600',
                'green': 'from-green-500 to-green-600',
                'red': 'from-red-500 to-red-600',
                'purple': 'from-purple-500 to-purple-600',
                'yellow': 'from-yellow-500 to-yellow-600',
                'gray': 'from-gray-500 to-gray-600'
            };
            
            let html = '<div class="space-y-3">';
            
            schedule.forEach(item => {
                html += `
                    <div class="flex items-center p-4 bg-gradient-to-r ${colorMap[item.color]} rounded-xl text-white shadow-lg">
                        <div class="text-3xl mr-4">${item.icon}</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xl font-bold">${item.subject}</span>
                                <span class="text-sm bg-white/20 px-3 py-1 rounded-full">${item.time}</span>
                            </div>
                            <div class="text-sm text-white/90">📋 ${item.goal}</div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }
        
        // 학생 일정 조회
        function loadWeeklySchedule() {
            const studentName = document.getElementById('studentSelect').value.trim();
            
            if (!studentName) {
                alert('학생 이름을 입력해주세요!');
                return;
            }
            
            // 로컬스토리지에서 일정 불러오기
            const savedSchedule = localStorage.getItem(`schedule_${studentName}`);
            
            if (savedSchedule) {
                const data = JSON.parse(savedSchedule);
                
                // 시간 가이드 카드 표시
                document.getElementById('timeGuideCard').classList.remove('hidden');
                document.getElementById('scheduleSection').classList.remove('hidden');
                
                // 평일 스케줄 렌더링
                const weekdays = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'];
                weekdays.forEach(day => {
                    document.getElementById(`${day}Schedule`).innerHTML = renderSchedule(data.weekday, day);
                });
                
                // 주말 스케줄 렌더링
                document.getElementById('saturdaySchedule').innerHTML = renderSchedule(data.saturday, '토요일');
                document.getElementById('sundaySchedule').innerHTML = renderSchedule(data.sunday, '일요일');
                
                showToast(`✅ ${studentName} 학생의 저장된 일정을 불러왔습니다!`);
            } else {
                alert(`${studentName} 학생의 저장된 일정이 없습니다.\n"자동 스케줄 생성" 버튼을 눌러 일정을 만들어주세요.`);
            }
        }
        
        // 요일별 일정 수정 (간단한 알림만)
        function editDaySchedule(day) {
            const dayNames = {
                'monday': '월요일',
                'tuesday': '화요일',
                'wednesday': '수요일',
                'thursday': '목요일',
                'friday': '금요일',
                'saturday': '토요일',
                'sunday': '일요일'
            };
            
            alert(`${dayNames[day]} 일정 수정 기능은 곧 추가될 예정입니다.\n현재는 "자동 스케줄 생성"으로 일정을 다시 만들어주세요.`);
        }
        
        // 토스트 메시지
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-24 right-6 bg-white rounded-xl shadow-2xl p-5 flex items-center space-x-3 border-l-4 border-cyan-500 z-50 animate-fade-in';
            toast.innerHTML = `
                <i class="fas fa-check-circle text-cyan-500 text-3xl"></i>
                <div>
                    <div class="font-bold text-gray-800">${message}</div>
                    <div class="text-xs text-gray-500 mt-1">자동으로 저장되었습니다</div>
                </div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transition = 'opacity 0.5s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
