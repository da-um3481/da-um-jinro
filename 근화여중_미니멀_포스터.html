<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 챌린지 - 미니멀 스타일</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.15);
        }
        
        .hero-section {
            background: #000;
            padding: 80px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 50%, rgba(102, 126, 234, 0.2), transparent 70%),
                radial-gradient(circle at 70% 60%, rgba(118, 75, 162, 0.2), transparent 70%);
        }
        
        .hero-text {
            font-size: 72px;
            font-weight: 800;
            color: white;
            line-height: 0.9;
            margin-bottom: 30px;
            letter-spacing: -3px;
            position: relative;
            z-index: 1;
        }
        
        .hero-text .highlight {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        
        .content-section {
            padding: 60px 40px;
        }
        
        .section-label {
            font-size: 12px;
            font-weight: 700;
            color: #667eea;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .feature-item {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .feature-number {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }
        
        .feature-content {
            flex: 1;
            padding-top: 5px;
        }
        
        .feature-title {
            font-size: 22px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .feature-desc {
            font-size: 16px;
            color: #6e6e73;
            line-height: 1.6;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: #e5e5e5;
            margin-bottom: 50px;
        }
        
        .stat-item {
            background: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #6e6e73;
            font-weight: 500;
        }
        
        .cta-section {
            background: #f5f5f7;
            padding: 50px 40px;
            text-align: center;
        }
        
        .cta-title {
            font-size: 32px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }
        
        .cta-subtitle {
            font-size: 16px;
            color: #6e6e73;
            margin-bottom: 30px;
        }
        
        .cta-button {
            background: #667eea;
            color: white;
            padding: 16px 50px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            display: inline-block;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: -0.3px;
        }
        
        .cta-button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
        }
        
        .footer {
            padding: 30px 40px;
            background: white;
            border-top: 1px solid #e5e5e5;
        }
        
        .footer-text {
            font-size: 13px;
            color: #6e6e73;
            text-align: center;
            line-height: 1.6;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .hero-section {
                padding: 60px 30px;
            }
            
            .hero-text {
                font-size: 56px;
                letter-spacing: -2px;
            }
            
            .hero-subtitle {
                font-size: 18px;
            }
            
            .content-section {
                padding: 40px 30px;
            }
            
            .feature-title {
                font-size: 20px;
            }
            
            .feature-desc {
                font-size: 15px;
            }
            
            .stats-row {
                grid-template-columns: 1fr;
            }
            
            .cta-section {
                padding: 40px 30px;
            }
            
            .cta-title {
                font-size: 28px;
            }
        }
        
        @media (max-width: 480px) {
            .hero-text {
                font-size: 48px;
            }
            
            .hero-subtitle {
                font-size: 16px;
            }
            
            .feature-number {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
            
            .feature-title {
                font-size: 18px;
            }
            
            .stat-number {
                font-size: 32px;
            }
            
            .cta-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <!-- 히어로 섹션 -->
        <div class="hero-section">
            <div class="hero-text">
                Think<br>
                <span class="highlight">Different.</span>
            </div>
            <div class="hero-subtitle">겨울방학 30일 자기주도학습 챌린지</div>
        </div>
        
        <!-- 콘텐츠 섹션 -->
        <div class="content-section">
            <div class="section-label">Features</div>
            
            <div class="feature-grid">
                <div class="feature-item">
                    <div class="feature-number">01</div>
                    <div class="feature-content">
                        <div class="feature-title">개인 맞춤 학습</div>
                        <div class="feature-desc">
                            각자의 수준에 맞는<br>
                            완벽한 커리큘럼
                        </div>
                    </div>
                </div>
                
                <div class="feature-item">
                    <div class="feature-number">02</div>
                    <div class="feature-content">
                        <div class="feature-title">주 1회 피드백</div>
                        <div class="feature-desc">
                            전문 선생님의<br>
                            1:1 맞춤 코칭
                        </div>
                    </div>
                </div>
                
                <div class="feature-item">
                    <div class="feature-number">03</div>
                    <div class="feature-content">
                        <div class="feature-title">하이브리드 학습</div>
                        <div class="feature-desc">
                            온라인+오프라인<br>
                            최적의 학습 환경
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="section-label">Program Info</div>
            
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-number">20~40</div>
                    <div class="stat-label">모집 인원</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">30일</div>
                    <div class="stat-label">프로그램 기간</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">12/26</div>
                    <div class="stat-label">신청 마감</div>
                </div>
            </div>
        </div>
        
        <!-- CTA 섹션 -->
        <div class="cta-section">
            <div class="cta-title">지금 시작하세요.</div>
            <div class="cta-subtitle">담임쌤 또는 진로쌤께 신청</div>
            <a href="#" class="cta-button">신청하기</a>
        </div>
        
        <!-- 푸터 -->
        <div class="footer">
            <div class="footer-text">
                경주 근화여자중학교<br>
                DA.UM 다움진로진학컨설팅<br>
                010-2657-3481
            </div>
        </div>
    </div>
</body>
</html>
