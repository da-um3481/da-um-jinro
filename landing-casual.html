<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 DA.UM 학습 파티 - 함께 즐기는 공부!</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #e0f7ff 50%, #fff4e6 100%);
            color: #333;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* 떠다니는 요소들 */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .float-item {
            position: absolute;
            font-size: 40px;
            animation: float-random 15s infinite ease-in-out;
            opacity: 0.6;
        }

        @keyframes float-random {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) translateX(20px) rotate(5deg);
            }
            50% {
                transform: translateY(-60px) translateX(-10px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) translateX(30px) rotate(3deg);
            }
        }

        /* 메인 컨테이너 */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* 캐릭터 마스코트 영역 */
        .mascot-area {
            text-align: center;
            margin-bottom: 40px;
            animation: bounceIn 1s ease-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .mascot {
            font-size: 120px;
            display: inline-block;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .speech-bubble {
            position: relative;
            background: white;
            border-radius: 30px;
            padding: 20px 30px;
            margin: 20px auto 0;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-out 0.5s backwards;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 15px solid white;
        }

        .speech-text {
            font-family: 'Gaegu', cursive;
            font-size: 24px;
            color: #ff6b9d;
            font-weight: 700;
            line-height: 1.5;
        }

        /* 타이틀 */
        .title-area {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 0.8s backwards;
        }

        .main-title {
            font-family: 'Gaegu', cursive;
            font-size: 64px;
            background: linear-gradient(135deg, #ff6b9d, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            animation: rainbow 3s infinite;
        }

        @keyframes rainbow {
            0%, 100% {
                filter: hue-rotate(0deg) drop-shadow(0 5px 15px rgba(255, 107, 157, 0.3));
            }
            50% {
                filter: hue-rotate(30deg) drop-shadow(0 5px 15px rgba(72, 219, 251, 0.3));
            }
        }

        .subtitle {
            font-size: 22px;
            color: #48dbfb;
            font-weight: 700;
        }

        /* 카드 컨테이너 */
        .card-container {
            background: white;
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 1s ease-out 1s backwards;
            position: relative;
            overflow: hidden;
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 107, 157, 0.05), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        .card-header {
            font-family: 'Gaegu', cursive;
            font-size: 36px;
            color: #ff6b9d;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        /* 스탯 아이템 */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #fff5f7, #f0f8ff);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            border: 3px solid transparent;
        }

        .stat-box:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #ff6b9d;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .stat-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
            animation: wiggle 1s infinite;
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        .stat-box:nth-child(1) .stat-icon { animation-delay: 0s; }
        .stat-box:nth-child(2) .stat-icon { animation-delay: 0.2s; }
        .stat-box:nth-child(3) .stat-icon { animation-delay: 0.4s; }
        .stat-box:nth-child(4) .stat-icon { animation-delay: 0.6s; }

        .stat-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 24px;
            color: #ff6b9d;
            font-weight: 900;
        }

        /* 진행바 */
        .progress-section {
            background: linear-gradient(135deg, #fff9e6, #ffe6f0);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .progress-label {
            font-size: 16px;
            color: #ff6b9d;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #feca57);
            width: 0%;
            border-radius: 15px;
            animation: fillProgress 2s ease-out 1.5s forwards;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: progress-shimmer 2s infinite;
        }

        @keyframes fillProgress {
            to { width: 42%; }
        }

        @keyframes progress-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        /* 버튼들 */
        .button-group {
            display: flex;
            gap: 15px;
            flex-direction: column;
        }

        .btn {
            font-family: 'Gaegu', cursive;
            padding: 20px 40px;
            font-size: 26px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: block;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            font-weight: 700;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 400px;
            height: 400px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            animation: button-glow 2s infinite;
        }

        @keyframes button-glow {
            0%, 100% {
                box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
            }
            50% {
                box-shadow: 0 10px 35px rgba(255, 107, 157, 0.6), 0 0 20px rgba(255, 107, 157, 0.4);
            }
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(72, 219, 251, 0.5);
        }

        /* 기능 카드들 */
        .feature-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin-top: 50px;
            animation: fadeInUp 1s ease-out 1.5s backwards;
        }

        .feature-card {
            background: white;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            border: 3px solid transparent;
        }

        .feature-card:hover {
            transform: translateY(-10px) rotate(2deg);
            border-color: #feca57;
            box-shadow: 0 15px 40px rgba(254, 202, 87, 0.3);
        }

        .feature-icon {
            font-size: 56px;
            margin-bottom: 15px;
            display: block;
        }

        .feature-title {
            font-size: 20px;
            color: #ff6b9d;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .feature-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .mascot {
                font-size: 80px;
            }

            .main-title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 18px;
            }

            .card-container {
                padding: 30px 20px;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                font-size: 22px;
                padding: 18px 30px;
            }
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 색종이 효과 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 눈 깜빡임 효과 (마스코트용) */
        @keyframes blink {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- 떠다니는 요소들 -->
    <div class="floating-elements" id="floatingElements"></div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <!-- 마스코트 영역 -->
        <div class="mascot-area">
            <div class="mascot">🐰</div>
            <div class="speech-bubble">
                <p class="speech-text">안녕! 나랑 같이<br>재미있게 공부할래? 💕</p>
            </div>
        </div>

        <!-- 타이틀 -->
        <div class="title-area">
            <h1 class="main-title">🌸 DA.UM 학습 파티 🎉</h1>
            <p class="subtitle">✨ 친구들과 함께하는 즐거운 공부 여행 ✨</p>
        </div>

        <!-- 카드 컨테이너 -->
        <div class="card-container">
            <h2 class="card-header">🎈 내 학습 현황 🎈</h2>

            <!-- 스탯 그리드 -->
            <div class="stat-grid">
                <div class="stat-box">
                    <span class="stat-icon">⭐</span>
                    <div class="stat-label">레벨</div>
                    <div class="stat-value">Lv.1</div>
                </div>

                <div class="stat-box">
                    <span class="stat-icon">💎</span>
                    <div class="stat-label">경험치</div>
                    <div class="stat-value">0 / 100</div>
                </div>

                <div class="stat-box">
                    <span class="stat-icon">🪙</span>
                    <div class="stat-label">코인</div>
                    <div class="stat-value">0</div>
                </div>

                <div class="stat-box">
                    <span class="stat-icon">🏆</span>
                    <div class="stat-label">업적</div>
                    <div class="stat-value">0 / 50</div>
                </div>
            </div>

            <!-- 진행바 -->
            <div class="progress-section">
                <div class="progress-label">
                    <span>🌟 오늘의 학습 진행도</span>
                    <span>42%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <!-- 버튼 그룹 -->
            <div class="button-group">
                <a href="daum-classroom-v2/student.html" class="btn btn-primary">
                    <span>🎮 지금 시작하기!</span>
                </a>
                <a href="#" class="btn btn-secondary" onclick="alert('친구 초대 기능은 곧 업데이트됩니다! 🎉'); return false;">
                    <span>👥 친구 초대하기</span>
                </a>
            </div>
        </div>

        <!-- 기능 카드 -->
        <div class="feature-cards">
            <div class="feature-card">
                <span class="feature-icon">🎯</span>
                <div class="feature-title">매일 미션</div>
                <div class="feature-desc">재미있는 일일 과제로<br>보상 받기!</div>
            </div>

            <div class="feature-card">
                <span class="feature-icon">🎁</span>
                <div class="feature-title">선물 상자</div>
                <div class="feature-desc">학습하고 랜덤 보상<br>받아가기!</div>
            </div>

            <div class="feature-card">
                <span class="feature-icon">🎨</span>
                <div class="feature-title">캐릭터 꾸미기</div>
                <div class="feature-desc">나만의 아바타<br>만들기!</div>
            </div>

            <div class="feature-card">
                <span class="feature-icon">🌈</span>
                <div class="feature-title">랭킹 도전</div>
                <div class="feature-desc">친구들과 순위<br>겨루기!</div>
            </div>
        </div>
    </div>

    <script>
        // 떠다니는 요소 생성
        function createFloatingElements() {
            const container = document.getElementById('floatingElements');
            const emojis = ['☁️', '⭐', '💖', '🌈', '✨', '🎈', '🌸', '🦋'];
            
            for (let i = 0; i < 15; i++) {
                const item = document.createElement('div');
                item.className = 'float-item';
                item.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                item.style.left = Math.random() * 100 + '%';
                item.style.top = Math.random() * 100 + '%';
                item.style.animationDelay = Math.random() * 5 + 's';
                item.style.animationDuration = (Math.random() * 10 + 10) + 's';
                
                container.appendChild(item);
            }
        }

        // 색종이 효과
        function createConfetti() {
            const colors = ['#ff6b9d', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            confetti.style.zIndex = '5';
            
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }

        // 초기화
        createFloatingElements();

        // 주기적으로 색종이 생성
        setInterval(createConfetti, 500);

        // 버튼 클릭 시 색종이 폭발
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => createConfetti(), i * 50);
                }
            });
        });

        // 카드 호버 시 흔들기 효과
        document.querySelectorAll('.feature-card, .stat-box').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.animation = 'none';
                setTimeout(() => {
                    this.style.animation = '';
                }, 10);
            });
        });

        // 마스코트 눈 깜빡임
        setInterval(() => {
            const mascot = document.querySelector('.mascot');
            mascot.style.animation = 'blink 0.2s';
            setTimeout(() => {
                mascot.style.animation = 'bounce 2s infinite';
            }, 200);
        }, 5000);

        // 음성 효과 (선택사항 - 실제로는 오디오 파일 필요)
        function playSound() {
            // 추후 오디오 파일 추가 시 구현
        }
    </script>
</body>
</html>
