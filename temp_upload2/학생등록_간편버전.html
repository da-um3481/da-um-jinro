<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 등록 - 간편 버전</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .section {
            background: #f8f9fa;
            padding: 30px;
            margin: 25px 0;
            border-radius: 20px;
            border-left: 6px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin: 20px 0;
        }
        
        .form-group label {
            display: block;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-family: 'Malgun Gothic', sans-serif;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }
        
        .button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        
        .button:hover {
            transform: scale(1.05);
        }
        
        .button-secondary {
            background: #6c757d;
        }
        
        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            font-size: 1.2em;
            display: none;
        }
        
        .success {
            background: #d4edda;
            border: 3px solid #28a745;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            border: 3px solid #dc3545;
            color: #721c24;
        }
        
        .student-list {
            margin-top: 20px;
        }
        
        .student-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .student-info {
            font-size: 1.1em;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        
        .counter {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            margin: 20px 0;
        }
        
        .template {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #2196f3;
        }
        
        .template pre {
            font-family: 'Consolas', monospace;
            font-size: 1.1em;
            color: #0d47a1;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 학생 등록 - 간편 버전</h1>
        
        <div class="counter" id="counter">
            등록된 학생: 0명 / 30명
        </div>
        
        <div class="section">
            <h2>✏️ 학생 정보 입력</h2>
            
            <div class="form-group">
                <label>이름 *</label>
                <input type="text" id="studentName" placeholder="예: 김철수">
            </div>
            
            <div class="form-group">
                <label>학교 *</label>
                <input type="text" id="studentSchool" value="A중학교">
            </div>
            
            <div class="form-group">
                <label>학년 *</label>
                <select id="studentGrade">
                    <option value="">선택하세요</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>프로그램 *</label>
                <input type="text" id="studentProgram" value="겨울방학 30일" readonly>
            </div>
            
            <div class="form-group">
                <label>시작일 *</label>
                <input type="date" id="studentStartDate" value="2025-01-02">
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="button" onclick="addStudent()">➕ 학생 추가</button>
                <button class="button button-secondary" onclick="clearForm()">🔄 초기화</button>
            </div>
        </div>
        
        <div class="section">
            <h2>👥 등록 대기 목록</h2>
            <div id="studentList" class="student-list">
                <p style="color: #999; text-align: center; padding: 20px;">
                    아직 등록된 학생이 없습니다
                </p>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="button" onclick="registerAll()" style="font-size: 1.5em; padding: 25px 60px;">
                    🚀 전체 등록하기
                </button>
            </div>
        </div>
        
        <div id="resultBox" class="result"></div>
        
        <div class="template">
            <h3 style="color: #2196f3; margin-bottom: 15px;">💡 빠른 입력 팁</h3>
            <p style="font-size: 1.1em; line-height: 1.8;">
                이름만 바꿔가면서 "학생 추가" 버튼을 30번 누르세요!<br>
                학교, 프로그램, 시작일은 자동으로 입력되어 있어요.<br>
                30명 다 추가한 후 "전체 등록하기" 버튼 클릭!
            </p>
        </div>
    </div>

    <script>
        let students = [];
        
        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const school = document.getElementById('studentSchool').value.trim();
            const grade = document.getElementById('studentGrade').value;
            const program = document.getElementById('studentProgram').value.trim();
            const startDate = document.getElementById('studentStartDate').value;
            
            if (!name) {
                showResult('error', '이름을 입력해주세요!');
                return;
            }
            
            if (!grade) {
                showResult('error', '학년을 선택해주세요!');
                return;
            }
            
            const student = {
                name: name,
                school: school,
                grade: grade,
                program: program,
                start_date: startDate,
                attendance_days: 0,
                study_hours: 0,
                status: 'active'
            };
            
            students.push(student);
            updateStudentList();
            clearForm();
            showResult('success', `${name} 학생이 추가되었습니다! (${students.length}/30)`);
            
            // 이름 입력란에 포커스
            document.getElementById('studentName').focus();
        }
        
        function updateStudentList() {
            const listDiv = document.getElementById('studentList');
            const counter = document.getElementById('counter');
            
            counter.textContent = `등록된 학생: ${students.length}명 / 30명`;
            
            if (students.length === 0) {
                listDiv.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">아직 등록된 학생이 없습니다</p>';
                return;
            }
            
            let html = '';
            students.forEach((student, index) => {
                html += `
                    <div class="student-item">
                        <div class="student-info">
                            <strong>${index + 1}. ${student.name}</strong> - 
                            ${student.school} ${student.grade}학년 - 
                            ${student.program}
                        </div>
                        <button class="delete-btn" onclick="removeStudent(${index})">삭제</button>
                    </div>
                `;
            });
            
            listDiv.innerHTML = html;
        }
        
        function removeStudent(index) {
            const student = students[index];
            if (confirm(`${student.name} 학생을 삭제하시겠습니까?`)) {
                students.splice(index, 1);
                updateStudentList();
                showResult('success', '학생이 삭제되었습니다.');
            }
        }
        
        function clearForm() {
            document.getElementById('studentName').value = '';
            document.getElementById('studentGrade').value = '';
            document.getElementById('studentName').focus();
        }
        
        async function registerAll() {
            if (students.length === 0) {
                showResult('error', '등록할 학생이 없습니다!');
                return;
            }
            
            if (!confirm(`${students.length}명의 학생을 등록하시겠습니까?`)) {
                return;
            }
            
            showResult('success', `⏳ ${students.length}명 등록 중... 잠시만 기다려주세요!`);
            
            let successCount = 0;
            let errorCount = 0;
            
            for (const student of students) {
                try {
                    const response = await fetch('/tables/students', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(student)
                    });
                    
                    if (response.ok) {
                        successCount++;
                    } else {
                        errorCount++;
                        console.error('등록 실패:', student.name);
                    }
                } catch (error) {
                    errorCount++;
                    console.error('등록 오류:', error);
                }
            }
            
            if (errorCount === 0) {
                showResult('success', `🎉 성공! ${successCount}명의 학생이 모두 등록되었습니다!`);
                students = [];
                updateStudentList();
            } else {
                showResult('error', `⚠️ ${successCount}명 성공, ${errorCount}명 실패했습니다.`);
            }
        }
        
        function showResult(type, message) {
            const resultBox = document.getElementById('resultBox');
            resultBox.className = `result ${type}`;
            resultBox.textContent = message;
            resultBox.style.display = 'block';
            
            setTimeout(() => {
                if (type === 'success') {
                    resultBox.style.display = 'none';
                }
            }, 3000);
        }
        
        // Enter 키로 학생 추가
        document.getElementById('studentName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addStudent();
            }
        });
        
        // 페이지 로드 시 이름 입력란에 포커스
        window.onload = function() {
            document.getElementById('studentName').focus();
        };
    </script>
</body>
</html>
