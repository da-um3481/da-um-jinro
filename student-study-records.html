<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 학습 기록 조회</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #4ade80;
            --danger: #f87171;
            --warning: #fbbf24;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 4rem;
        }

        .loading i {
            font-size: 3rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .student-list {
            display: grid;
            gap: 1.5rem;
        }

        .student-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .student-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.2);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .student-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .student-info .id {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .total-time {
            text-align: right;
        }

        .total-time .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .total-time .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .records-table th {
            text-align: left;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .records-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .records-table tr:last-child td {
            border-bottom: none;
        }

        .subject-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .time-badge {
            color: var(--success);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
        }

        .empty-state i {
            font-size: 4rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .error-state {
            text-align: center;
            padding: 4rem;
        }

        .error-state i {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 1rem;
        }

        .error-state p {
            color: var(--danger);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-clipboard-list"></i> 학생 학습 기록</h1>
            <p>Google Sheets에 저장된 모든 학습 기록을 확인하세요</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 학생 이름으로 검색...">
            </div>
            <button class="btn" onclick="loadData()">
                <i class="fas fa-sync-alt"></i>
                새로고침
            </button>
        </div>

        <div id="statsContainer"></div>
        <div id="contentContainer"></div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxCRKmOjkjEbSPkpjzb_RF6c-o3g9GsvHBMjFzu2YxLbac7nK_MwV2AT5VYfzFR7aP7MQ/exec';
        
        let allStudents = [];
        let allRecords = [];

        // Load data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterStudents(e.target.value);
            });
        });

        async function loadData() {
            const contentContainer = document.getElementById('contentContainer');
            contentContainer.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p style="margin-top: 1rem; color: var(--text-muted);">Google Sheets에서 데이터를 불러오는 중...</p>
                </div>
            `;

            try {
                const url = `${WEB_APP_URL}?action=getStudyRecords&group_by=student`;
                console.log('Fetching from:', url);
                
                const response = await fetch(url);
                const result = await response.json();
                
                console.log('Response:', result);

                if (result.status === 'success' && result.data && result.data.length > 0) {
                    allStudents = result.data;
                    
                    // Calculate all records
                    allRecords = [];
                    allStudents.forEach(student => {
                        if (student.records) {
                            allRecords = allRecords.concat(student.records);
                        }
                    });
                    
                    displayStats();
                    displayStudents(allStudents);
                } else {
                    contentContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>학습 기록이 없습니다</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading data:', error);
                contentContainer.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>데이터 로드 실패</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</p>
                    </div>
                `;
            }
        }

        function displayStats() {
            const totalStudents = allStudents.length;
            const totalRecords = allRecords.length;
            const totalMinutes = allStudents.reduce((sum, s) => sum + (s.totalMinutes || 0), 0);
            const totalHours = Math.floor(totalMinutes / 60);

            document.getElementById('statsContainer').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="icon">👥</div>
                        <div class="value">${totalStudents}</div>
                        <div class="label">총 학생 수</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📚</div>
                        <div class="value">${totalRecords}</div>
                        <div class="label">총 학습 기록</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">⏱️</div>
                        <div class="value">${totalHours}</div>
                        <div class="label">총 학습 시간 (시간)</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📊</div>
                        <div class="value">${Math.round(totalMinutes / totalStudents)}</div>
                        <div class="label">평균 학습 시간 (분)</div>
                    </div>
                </div>
            `;
        }

        function displayStudents(students) {
            const contentContainer = document.getElementById('contentContainer');
            
            if (students.length === 0) {
                contentContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>검색 결과가 없습니다</p>
                    </div>
                `;
                return;
            }

            const html = students.map(student => {
                const hours = Math.floor(student.totalMinutes / 60);
                const minutes = student.totalMinutes % 60;
                
                const recordsHtml = student.records && student.records.length > 0 ? `
                    <table class="records-table">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>과목</th>
                                <th>시간</th>
                                <th>내용</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${student.records.map(record => {
                                const recordTime = record.calculatedTime || record.time || 45;
                                const recordHours = Math.floor(recordTime / 60);
                                const recordMinutes = recordTime % 60;
                                
                                return `
                                    <tr>
                                        <td>${record.date || '-'}</td>
                                        <td><span class="subject-badge">${record.subject || '-'}</span></td>
                                        <td><span class="time-badge">${recordHours > 0 ? recordHours + '시간 ' : ''}${recordMinutes}분</span></td>
                                        <td>${record.content || record.item || '-'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                ` : '<p style="color: var(--text-muted); text-align: center;">학습 기록이 없습니다</p>';

                return `
                    <div class="student-card">
                        <div class="student-header">
                            <div class="student-info">
                                <h3>
                                    <i class="fas fa-user-graduate" style="color: var(--primary);"></i>
                                    ${student.studentName || '이름없음'}
                                </h3>
                                <div class="id">ID: ${student.studentId || '-'}</div>
                            </div>
                            <div class="total-time">
                                <div class="value">${hours > 0 ? hours + '시간 ' : ''}${minutes}분</div>
                                <div class="label">총 학습 시간</div>
                            </div>
                        </div>
                        ${recordsHtml}
                    </div>
                `;
            }).join('');

            contentContainer.innerHTML = `<div class="student-list">${html}</div>`;
        }

        function filterStudents(searchTerm) {
            if (!searchTerm.trim()) {
                displayStudents(allStudents);
                return;
            }

            const filtered = allStudents.filter(student => 
                student.studentName && student.studentName.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            displayStudents(filtered);
        }
    </script>
</body>
</html>
