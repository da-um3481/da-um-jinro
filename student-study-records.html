<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 학습 기록 조회 - DA.UM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- 상단 헤더 - DA.UM 아이덴티티 -->
    <header class="bg-gradient-to-r from-indigo-600 to-gray-600 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <!-- 로고 및 타이틀 (왼편 배치) -->
                <div class="flex items-center space-x-3">
                    <img src="images/daum-logo-transparent.png" alt="DA.UM Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl shadow-lg bg-white p-1" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black">DA.UM 학습 기록</h1>
                        <p class="text-xs sm:text-sm text-green-8100 font-medium">Study Records Management</p>
                    </div>
                </div>
                <!-- 네비게이션 -->
                <nav class="hidden md:flex space-x-2">
                    <a href="index.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="students.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-users mr-2"></i>학생 관리
                    </a>
                    <a href="student-study-records.html" class="px-4 py-2 bg-white/30 rounded-lg transition">
                        <i class="fas fa-chart-line mr-2"></i>학습 기록
                    </a>
                </nav>
                <!-- 모바일 메뉴 -->
                <button onclick="window.location.href='index.html'" class="md:hidden px-3 py-2 hover:bg-white/20 rounded-lg transition">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 학생 선택 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">
                <i class="fas fa-user-graduate text-green-800 mr-2"></i>학생 선택
            </h2>
            <select id="studentSelect" onchange="loadStudentRecords()" 
                    class="w-full md:w-1/2 px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-800">
                <option value="">학생을 선택하세요</option>
            </select>
        </div>

        <!-- 학생 정보 -->
        <div id="studentInfo" class="hidden bg-gradient-to-r from-blue-500 to-gray-600 text-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-sm opacity-90">학생 정보</div>
                    <div class="text-2xl font-bold mt-1" id="studentName">-</div>
                    <div class="text-sm mt-1" id="studentGrade">-</div>
                </div>
                <div class="text-right">
                    <div class="text-sm opacity-90">평균 점수</div>
                    <div class="text-3xl font-bold" id="studentAvg">-</div>
                    <div class="text-sm mt-1" id="studentLevel">-</div>
                </div>
            </div>
        </div>

        <!-- 주간 요약 & 피드백 섹션 -->
        <div id="weeklySummaryContainer" class="hidden mb-6">
            <div class="bg-gradient-to-r from-green-500 to-teal-600 text-white rounded-lg shadow-lg p-6 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-2xl font-bold">
                        <i class="fas fa-calendar-week mr-2"></i>이번 주 학습 요약
                    </h2>
                    <button onclick="generate4WeekReport()" class="px-6 py-3 bg-white text-green-600 rounded-lg font-bold hover:bg-green-50 transition shadow-lg">
                        <i class="fas fa-file-pdf mr-2"></i>4주 보고서 생성
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white/20 rounded-lg p-4">
                        <div class="text-sm opacity-90">총 학습일</div>
                        <div class="text-3xl font-bold" id="weeklyDays">0일</div>
                    </div>
                    <div class="bg-white/20 rounded-lg p-4">
                        <div class="text-sm opacity-90">총 학습시간</div>
                        <div class="text-3xl font-bold" id="weeklyHours">0시간</div>
                    </div>
                    <div class="bg-white/20 rounded-lg p-4">
                        <div class="text-sm opacity-90">일평균</div>
                        <div class="text-3xl font-bold" id="weeklyAvg">0시간</div>
                    </div>
                </div>
            </div>

            <!-- 주간 피드백 작성 -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold">
                        <i class="fas fa-comment-dots text-green-800 mr-2"></i>주간 피드백 작성
                    </h3>
                    <span class="text-sm text-gray-500">학생 포털에서 확인 가능</span>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-star text-yellow-500 mr-1"></i>칭찬할 점
                        </label>
                        <textarea id="feedbackPraise" rows="2" 
                                  class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-800"
                                  placeholder="이번 주 학생이 잘한 점, 칭찬할 부분을 작성하세요..."></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lightbulb text-orange-500 mr-1"></i>개선 제안
                        </label>
                        <textarea id="feedbackImprovement" rows="2" 
                                  class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-800"
                                  placeholder="앞으로 개선하면 좋을 점을 작성하세요..."></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-heart text-red-500 mr-1"></i>응원 메시지
                        </label>
                        <textarea id="feedbackEncouragement" rows="2" 
                                  class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-800"
                                  placeholder="학생에게 전하는 응원의 메시지를 작성하세요..."></textarea>
                    </div>
                    
                    <button onclick="saveFeedback()" 
                            class="w-full px-6 py-4 bg-gradient-to-r from-blue-500 to-gray-600 text-white rounded-lg font-bold hover:from-blue-600 hover:to-gray-700 transition shadow-lg">
                        <i class="fas fa-save mr-2"></i>피드백 저장하기
                    </button>
                </div>

                <!-- 기존 피드백 목록 -->
                <div id="feedbackHistory" class="mt-6">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>

        <!-- 학습 기록 목록 -->
        <div id="recordsContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold">
                        <i class="fas fa-clipboard-list text-gray-600 mr-2"></i>학습 기록
                    </h2>
                    <div class="text-sm text-gray-600">
                        총 <span id="totalRecords" class="font-bold text-gray-600">0</span>일 기록
                    </div>
                </div>

                <div id="recordsList" class="space-y-4">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>

        <!-- 기록 없음 메시지 -->
        <div id="noRecords" class="hidden bg-white rounded-lg shadow-md p-12 text-center">
            <div class="text-6xl mb-4">📝</div>
            <p class="text-xl font-bold text-gray-700 mb-2">학습 기록이 없습니다</p>
            <p class="text-gray-500">학생이 학습을 시작하면 기록이 표시됩니다</p>
        </div>
    </div>

    <script>
        // 페이지 로드 시 학생 목록 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
        });

        // 학생 목록 로드
        function loadStudents() {
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const select = document.getElementById('studentSelect');
            
            select.innerHTML = '<option value="">학생을 선택하세요</option>';
            
            students.forEach(student => {
                const option = document.createElement('option');
                option.value = student.id;
                option.textContent = `${student.name} (${student.grade}학년 ${student.class_num}반)`;
                select.appendChild(option);
            });
        }

        // 학생 학습 기록 로드
        function loadStudentRecords() {
            const studentId = document.getElementById('studentSelect').value;
            
            if (!studentId) {
                document.getElementById('studentInfo').classList.add('hidden');
                document.getElementById('weeklySummaryContainer').classList.add('hidden');
                document.getElementById('recordsContainer').classList.add('hidden');
                document.getElementById('noRecords').classList.add('hidden');
                return;
            }

            // 학생 정보 표시
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const student = students.find(s => s.id === studentId);
            
            if (student) {
                document.getElementById('studentInfo').classList.remove('hidden');
                document.getElementById('studentName').textContent = student.name;
                document.getElementById('studentGrade').textContent = 
                    `${student.grade}학년 ${student.class_num}반 ${student.student_num}번`;
                
                const avg = (
                    (student.korean_score || 0) +
                    (student.english_score || 0) +
                    (student.math_score || 0) +
                    (student.science_score || 0) +
                    (student.social_score || 0)
                ) / 5;
                
                document.getElementById('studentAvg').textContent = avg.toFixed(1);
                document.getElementById('studentLevel').textContent = `레벨: ${student.level}`;
            }

            // 학습 기록 로드
            const studyRecords = JSON.parse(localStorage.getItem('study_records')) || [];
            const studentRecords = studyRecords.filter(r => r.student_id === studentId);
            
            if (studentRecords.length === 0) {
                document.getElementById('weeklySummaryContainer').classList.add('hidden');
                document.getElementById('recordsContainer').classList.add('hidden');
                document.getElementById('noRecords').classList.remove('hidden');
                return;
            }

            // 날짜순 정렬 (최신순)
            studentRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

            document.getElementById('weeklySummaryContainer').classList.remove('hidden');
            document.getElementById('recordsContainer').classList.remove('hidden');
            document.getElementById('noRecords').classList.add('hidden');
            document.getElementById('totalRecords').textContent = studentRecords.length;

            // 주간 요약 계산
            calculateWeeklySummary(studentRecords);
            
            // 기존 피드백 로드
            loadFeedbackHistory(studentId);

            displayRecords(studentRecords);
        }

        // 주간 요약 계산 (최근 7일)
        function calculateWeeklySummary(records) {
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            
            const weeklyRecords = records.filter(r => {
                const recordDate = new Date(r.date);
                return recordDate >= weekAgo && recordDate <= today;
            });

            let totalMinutes = 0;
            weeklyRecords.forEach(record => {
                for (const subject of Object.values(record.subjects || {})) {
                    totalMinutes += subject.time || 0;
                }
            });

            const totalHours = (totalMinutes / 60).toFixed(1);
            const avgHours = weeklyRecords.length > 0 ? (totalMinutes / 60 / weeklyRecords.length).toFixed(1) : 0;

            document.getElementById('weeklyDays').textContent = `${weeklyRecords.length}일`;
            document.getElementById('weeklyHours').textContent = `${totalHours}시간`;
            document.getElementById('weeklyAvg').textContent = `${avgHours}시간`;
        }

        // 피드백 저장
        function saveFeedback() {
            const studentId = document.getElementById('studentSelect').value;
            if (!studentId) {
                alert('학생을 선택해주세요.');
                return;
            }

            const praise = document.getElementById('feedbackPraise').value.trim();
            const improvement = document.getElementById('feedbackImprovement').value.trim();
            const encouragement = document.getElementById('feedbackEncouragement').value.trim();

            if (!praise && !improvement && !encouragement) {
                alert('피드백 내용을 입력해주세요.');
                return;
            }

            const feedback = {
                id: `feedback_${Date.now()}`,
                student_id: studentId,
                date: new Date().toISOString().split('T')[0],
                created_at: new Date().toISOString(),
                praise: praise,
                improvement: improvement,
                encouragement: encouragement,
                week_number: getWeekNumber(new Date())
            };

            // localStorage에 저장
            const feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];
            feedbacks.push(feedback);
            localStorage.setItem('feedbacks', JSON.stringify(feedbacks));

            alert('✅ 피드백이 저장되었습니다! 학생 포털에서 확인할 수 있습니다.');

            // 입력 필드 초기화
            document.getElementById('feedbackPraise').value = '';
            document.getElementById('feedbackImprovement').value = '';
            document.getElementById('feedbackEncouragement').value = '';

            // 피드백 히스토리 새로고침
            loadFeedbackHistory(studentId);
        }

        // 피드백 히스토리 로드
        function loadFeedbackHistory(studentId) {
            const feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];
            const studentFeedbacks = feedbacks.filter(f => f.student_id === studentId);
            
            // 최신순 정렬
            studentFeedbacks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const container = document.getElementById('feedbackHistory');
            
            if (studentFeedbacks.length === 0) {
                container.innerHTML = `
                    <div class="mt-4 p-4 bg-gray-50 rounded-lg text-center text-gray-500">
                        아직 작성된 피드백이 없습니다.
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <h4 class="font-bold text-gray-700 mb-3 mt-6">
                    <i class="fas fa-history mr-2"></i>피드백 이력 (총 ${studentFeedbacks.length}개)
                </h4>
                <div class="space-y-3">
                    ${studentFeedbacks.map(fb => {
                        const date = new Date(fb.created_at);
                        const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;
                        
                        return `
                            <div class="p-4 bg-blue-50 border-2 border-green-200 rounded-lg">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="font-bold text-blue-900">📅 ${dateStr} (${fb.week_number}주차)</span>
                                    <button onclick="deleteFeedback('${fb.id}')" class="text-sm text-red-500 hover:text-red-700">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                                ${fb.praise ? `<p class="text-sm text-gray-700 mb-1"><strong>칭찬:</strong> ${fb.praise}</p>` : ''}
                                ${fb.improvement ? `<p class="text-sm text-gray-700 mb-1"><strong>개선:</strong> ${fb.improvement}</p>` : ''}
                                ${fb.encouragement ? `<p class="text-sm text-gray-700"><strong>응원:</strong> ${fb.encouragement}</p>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // 피드백 삭제
        function deleteFeedback(feedbackId) {
            if (!confirm('이 피드백을 삭제하시겠습니까?')) return;

            let feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];
            feedbacks = feedbacks.filter(f => f.id !== feedbackId);
            localStorage.setItem('feedbacks', JSON.stringify(feedbacks));

            const studentId = document.getElementById('studentSelect').value;
            loadFeedbackHistory(studentId);
            alert('피드백이 삭제되었습니다.');
        }

        // 주차 계산
        function getWeekNumber(date) {
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - startOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + startOfYear.getDay() + 1) / 7);
        }

        // 학습 기록 표시
        function displayRecords(records) {
            const container = document.getElementById('recordsList');
            
            container.innerHTML = records.map(record => {
                const date = new Date(record.date);
                const dateStr = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
                const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];
                
                // 과목별 정보
                const subjectInfo = {
                    'math': { name: '수학', color: 'blue', icon: 'calculator' },
                    'english': { name: '영어', color: 'green', icon: 'language' },
                    'korean': { name: '국어', color: 'red', icon: 'book' },
                    'science': { name: '과학', color: 'purple', icon: 'flask' },
                    'social': { name: '사회', color: 'yellow', icon: 'globe' }
                };

                let subjectsHTML = '';
                let totalTime = 0;

                for (const [subjectKey, data] of Object.entries(record.subjects || {})) {
                    const info = subjectInfo[subjectKey] || { name: subjectKey, color: 'gray', icon: 'book' };
                    const time = data.time || 0;
                    const content = data.content || '내용 없음';
                    
                    totalTime += time;

                    subjectsHTML += `
                        <div class="p-4 bg-${info.color}-50 rounded-lg border-2 border-${info.color}-200">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-${info.icon} text-${info.color}-600"></i>
                                    <span class="font-bold text-${info.color}-900">${info.name}</span>
                                </div>
                                <span class="text-lg font-bold text-${info.color}-700">${time}분</span>
                            </div>
                            <div class="text-sm text-gray-700 bg-white/50 rounded p-2 mt-2">
                                <i class="fas fa-pencil-alt text-gray-500 mr-1"></i>
                                ${content}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="border-2 border-gray-200 rounded-xl p-6 hover:shadow-lg transition">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <div class="text-lg font-bold text-gray-800">${dateStr} (${dayOfWeek})</div>
                                <div class="text-sm text-gray-600 mt-1">
                                    총 학습 시간: <span class="font-bold text-gray-600">${totalTime}분 (${(totalTime / 60).toFixed(1)}시간)</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl">${totalTime >= 180 ? '🎉' : totalTime >= 120 ? '😊' : '📚'}</div>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${subjectsHTML || '<p class="text-gray-500 text-center py-4">학습 기록 없음</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 4주 보고서 생성
        function generate4WeekReport() {
            const studentId = document.getElementById('studentSelect').value;
            if (!studentId) {
                alert('학생을 선택해주세요.');
                return;
            }

            // 학생 정보
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const student = students.find(s => s.id === studentId);

            // 최근 4주 (28일) 데이터 수집
            const studyRecords = JSON.parse(localStorage.getItem('study_records')) || [];
            const today = new Date();
            const fourWeeksAgo = new Date(today.getTime() - 28 * 24 * 60 * 60 * 1000);
            
            const recentRecords = studyRecords.filter(r => {
                if (r.student_id !== studentId) return false;
                const recordDate = new Date(r.date);
                return recordDate >= fourWeeksAgo && recordDate <= today;
            });

            // 피드백 수집
            const feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];
            const recentFeedbacks = feedbacks.filter(f => {
                if (f.student_id !== studentId) return false;
                const feedbackDate = new Date(f.created_at);
                return feedbackDate >= fourWeeksAgo && feedbackDate <= today;
            });

            // 통계 계산
            let totalMinutes = 0;
            const subjectTotals = {};
            
            recentRecords.forEach(record => {
                for (const [subject, data] of Object.entries(record.subjects || {})) {
                    const time = data.time || 0;
                    totalMinutes += time;
                    subjectTotals[subject] = (subjectTotals[subject] || 0) + time;
                }
            });

            const totalHours = (totalMinutes / 60).toFixed(1);
            const avgDailyHours = recentRecords.length > 0 ? (totalMinutes / 60 / recentRecords.length).toFixed(1) : 0;

            // 보고서 HTML 생성
            const reportHTML = `
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4주 학습 보고서 - ${student.name}</title>
    <style>
        @media print {
            @page { margin: 1cm; }
            body { margin: 0; }
            .no-print { display: none !important; }
        }
        * { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; padding: 20px; }
        .report-container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid #667eea; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #667eea; margin-bottom: 10px; }
        .header p { color: #666; font-size: 14px; }
        .section { margin-bottom: 30px; }
        .section-title { font-size: 20px; color: #333; border-left: 4px solid #667eea; padding-left: 12px; margin-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .info-box { padding: 15px; background: #f8f9ff; border-radius: 8px; border-left: 3px solid #667eea; }
        .info-label { font-size: 12px; color: #666; margin-bottom: 5px; }
        .info-value { font-size: 24px; font-weight: bold; color: #667eea; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { text-align: center; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 10px; }
        .stat-number { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .subject-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .subject-table th, .subject-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        .subject-table th { background: #f8f9ff; color: #667eea; font-weight: bold; }
        .feedback-box { padding: 15px; background: #fff8e1; border-radius: 8px; margin-bottom: 15px; border-left: 3px solid #ffc107; }
        .feedback-date { font-size: 12px; color: #666; margin-bottom: 8px; }
        .feedback-content { font-size: 14px; color: #333; line-height: 1.6; }
        .signature-area { margin-top: 50px; text-align: right; }
        .signature-line { display: inline-block; width: 200px; border-top: 1px solid #333; padding-top: 10px; margin-top: 20px; }
        .print-btn { background: #667eea; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 20px auto; display: block; }
        .print-btn:hover { background: #5568d3; }
    </style>
</head>
<body>
    <button class="print-btn no-print" onclick="window.print()">📄 인쇄하기 / PDF 저장</button>
    
    <div class="report-container">
        <div class="header">
            <h1>📊 4주 학습 보고서</h1>
            <p>${new Date().getFullYear()}년 ${new Date().getMonth() + 1}월 ${new Date().getDate()}일 작성</p>
        </div>

        <div class="section">
            <h2 class="section-title">학생 정보</h2>
            <div class="info-grid">
                <div class="info-box">
                    <div class="info-label">학생명</div>
                    <div class="info-value">${student.name}</div>
                </div>
                <div class="info-box">
                    <div class="info-label">학년/반</div>
                    <div class="info-value">${student.grade}학년 ${student.class_num}반</div>
                </div>
                <div class="info-box">
                    <div class="info-label">평균 점수</div>
                    <div class="info-value">${((student.korean_score || 0) + (student.english_score || 0) + (student.math_score || 0) + (student.science_score || 0) + (student.social_score || 0)) / 5}점</div>
                </div>
                <div class="info-box">
                    <div class="info-label">학습 레벨</div>
                    <div class="info-value">${student.level}</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">학습 통계 (최근 4주)</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number">${recentRecords.length}</div>
                    <div class="stat-label">학습일수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalHours}</div>
                    <div class="stat-label">총 학습시간</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${avgDailyHours}</div>
                    <div class="stat-label">일평균 시간</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">과목별 학습 시간</h2>
            <table class="subject-table">
                <thead>
                    <tr>
                        <th>과목</th>
                        <th>총 학습시간</th>
                        <th>비율</th>
                    </tr>
                </thead>
                <tbody>
                    ${Object.entries(subjectTotals).map(([subject, minutes]) => {
                        const subjectNames = {
                            'math': '수학', 'english': '영어', 'korean': '국어',
                            'science': '과학', 'social': '사회'
                        };
                        const hours = (minutes / 60).toFixed(1);
                        const percentage = totalMinutes > 0 ? ((minutes / totalMinutes) * 100).toFixed(1) : 0;
                        return `
                            <tr>
                                <td><strong>${subjectNames[subject] || subject}</strong></td>
                                <td>${hours}시간 (${minutes}분)</td>
                                <td>${percentage}%</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2 class="section-title">선생님 피드백 (총 ${recentFeedbacks.length}회)</h2>
            ${recentFeedbacks.length === 0 ? 
                '<p style="color: #999; text-align: center; padding: 20px;">작성된 피드백이 없습니다.</p>' :
                recentFeedbacks.map(fb => {
                    const date = new Date(fb.created_at);
                    const dateStr = `${date.getMonth() + 1}월 ${date.getDate()}일`;
                    return `
                        <div class="feedback-box">
                            <div class="feedback-date">📅 ${dateStr} (${fb.week_number}주차)</div>
                            ${fb.praise ? `<div class="feedback-content"><strong>✨ 칭찬:</strong> ${fb.praise}</div>` : ''}
                            ${fb.improvement ? `<div class="feedback-content"><strong>💡 개선:</strong> ${fb.improvement}</div>` : ''}
                            ${fb.encouragement ? `<div class="feedback-content"><strong>💪 응원:</strong> ${fb.encouragement}</div>` : ''}
                        </div>
                    `;
                }).join('')
            }
        </div>

        <div class="section">
            <h2 class="section-title">종합 의견</h2>
            <div style="padding: 20px; background: #f8f9ff; border-radius: 8px; line-height: 1.8;">
                ${student.name} 학생은 최근 4주 동안 총 ${recentRecords.length}일 학습하였으며, 
                총 ${totalHours}시간의 학습 시간을 기록하였습니다. 
                일평균 ${avgDailyHours}시간의 꾸준한 학습 패턴을 보이고 있습니다.
                ${recentFeedbacks.length > 0 ? '선생님의 정기적인 피드백을 통해 지속적인 학습 동기를 유지하고 있습니다.' : ''}
            </div>
        </div>

        <div class="signature-area">
            <div>DA.UM 다움진로진학컨설팅</div>
            <div class="signature-line">담당 교사 (인)</div>
        </div>
    </div>

    <button class="print-btn no-print" onclick="window.print()">📄 인쇄하기 / PDF 저장</button>
</body>
</html>
            `;

            // 새 창에서 보고서 열기
            const reportWindow = window.open('', '_blank');
            reportWindow.document.write(reportHTML);
            reportWindow.document.close();
        }
    </script>
</body>
</html>
