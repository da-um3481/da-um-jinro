<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 학습 기록 조회 - DA.UM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- 상단 네비게이션 -->
    <nav class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-xl">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">📊 학생 학습 기록 조회</h1>
                    <p class="text-sm text-indigo-200">학생별 일일 학습 시간 및 내용 확인</p>
                </div>
                <div class="flex space-x-4">
                    <a href="index.html" class="px-4 py-2 hover:bg-indigo-700 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="students.html" class="px-4 py-2 hover:bg-indigo-700 rounded-lg transition">
                        <i class="fas fa-users mr-2"></i>학생 관리
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 학생 선택 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">
                <i class="fas fa-user-graduate text-blue-600 mr-2"></i>학생 선택
            </h2>
            <select id="studentSelect" onchange="loadStudentRecords()" 
                    class="w-full md:w-1/2 px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">학생을 선택하세요</option>
            </select>
        </div>

        <!-- 학생 정보 -->
        <div id="studentInfo" class="hidden bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-sm opacity-90">학생 정보</div>
                    <div class="text-2xl font-bold mt-1" id="studentName">-</div>
                    <div class="text-sm mt-1" id="studentGrade">-</div>
                </div>
                <div class="text-right">
                    <div class="text-sm opacity-90">평균 점수</div>
                    <div class="text-3xl font-bold" id="studentAvg">-</div>
                    <div class="text-sm mt-1" id="studentLevel">-</div>
                </div>
            </div>
        </div>

        <!-- 학습 기록 목록 -->
        <div id="recordsContainer" class="hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold">
                        <i class="fas fa-clipboard-list text-purple-600 mr-2"></i>학습 기록
                    </h2>
                    <div class="text-sm text-gray-600">
                        총 <span id="totalRecords" class="font-bold text-purple-600">0</span>일 기록
                    </div>
                </div>

                <div id="recordsList" class="space-y-4">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>

        <!-- 기록 없음 메시지 -->
        <div id="noRecords" class="hidden bg-white rounded-lg shadow-md p-12 text-center">
            <div class="text-6xl mb-4">📝</div>
            <p class="text-xl font-bold text-gray-700 mb-2">학습 기록이 없습니다</p>
            <p class="text-gray-500">학생이 학습을 시작하면 기록이 표시됩니다</p>
        </div>
    </div>

    <script>
        // 페이지 로드 시 학생 목록 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadStudents();
        });

        // 학생 목록 로드
        function loadStudents() {
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const select = document.getElementById('studentSelect');
            
            select.innerHTML = '<option value="">학생을 선택하세요</option>';
            
            students.forEach(student => {
                const option = document.createElement('option');
                option.value = student.id;
                option.textContent = `${student.name} (${student.grade}학년 ${student.class_num}반)`;
                select.appendChild(option);
            });
        }

        // 학생 학습 기록 로드
        function loadStudentRecords() {
            const studentId = document.getElementById('studentSelect').value;
            
            if (!studentId) {
                document.getElementById('studentInfo').classList.add('hidden');
                document.getElementById('recordsContainer').classList.add('hidden');
                document.getElementById('noRecords').classList.add('hidden');
                return;
            }

            // 학생 정보 표시
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const student = students.find(s => s.id === studentId);
            
            if (student) {
                document.getElementById('studentInfo').classList.remove('hidden');
                document.getElementById('studentName').textContent = student.name;
                document.getElementById('studentGrade').textContent = 
                    `${student.grade}학년 ${student.class_num}반 ${student.student_num}번`;
                
                const avg = (
                    (student.korean_score || 0) +
                    (student.english_score || 0) +
                    (student.math_score || 0) +
                    (student.science_score || 0) +
                    (student.social_score || 0)
                ) / 5;
                
                document.getElementById('studentAvg').textContent = avg.toFixed(1);
                document.getElementById('studentLevel').textContent = `레벨: ${student.level}`;
            }

            // 학습 기록 로드
            const studyRecords = JSON.parse(localStorage.getItem('study_records')) || [];
            const studentRecords = studyRecords.filter(r => r.student_id === studentId);
            
            if (studentRecords.length === 0) {
                document.getElementById('recordsContainer').classList.add('hidden');
                document.getElementById('noRecords').classList.remove('hidden');
                return;
            }

            // 날짜순 정렬 (최신순)
            studentRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

            document.getElementById('recordsContainer').classList.remove('hidden');
            document.getElementById('noRecords').classList.add('hidden');
            document.getElementById('totalRecords').textContent = studentRecords.length;

            displayRecords(studentRecords);
        }

        // 학습 기록 표시
        function displayRecords(records) {
            const container = document.getElementById('recordsList');
            
            container.innerHTML = records.map(record => {
                const date = new Date(record.date);
                const dateStr = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
                const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];
                
                // 과목별 정보
                const subjectInfo = {
                    'math': { name: '수학', color: 'blue', icon: 'calculator' },
                    'english': { name: '영어', color: 'green', icon: 'language' },
                    'korean': { name: '국어', color: 'red', icon: 'book' },
                    'science': { name: '과학', color: 'purple', icon: 'flask' },
                    'social': { name: '사회', color: 'yellow', icon: 'globe' }
                };

                let subjectsHTML = '';
                let totalTime = 0;

                for (const [subjectKey, data] of Object.entries(record.subjects || {})) {
                    const info = subjectInfo[subjectKey] || { name: subjectKey, color: 'gray', icon: 'book' };
                    const time = data.time || 0;
                    const content = data.content || '내용 없음';
                    
                    totalTime += time;

                    subjectsHTML += `
                        <div class="p-4 bg-${info.color}-50 rounded-lg border-2 border-${info.color}-200">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center space-x-2">
                                    <i class="fas fa-${info.icon} text-${info.color}-600"></i>
                                    <span class="font-bold text-${info.color}-900">${info.name}</span>
                                </div>
                                <span class="text-lg font-bold text-${info.color}-700">${time}분</span>
                            </div>
                            <div class="text-sm text-gray-700 bg-white/50 rounded p-2 mt-2">
                                <i class="fas fa-pencil-alt text-gray-500 mr-1"></i>
                                ${content}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="border-2 border-gray-200 rounded-xl p-6 hover:shadow-lg transition">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <div class="text-lg font-bold text-gray-800">${dateStr} (${dayOfWeek})</div>
                                <div class="text-sm text-gray-600 mt-1">
                                    총 학습 시간: <span class="font-bold text-purple-600">${totalTime}분 (${(totalTime / 60).toFixed(1)}시간)</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl">${totalTime >= 180 ? '🎉' : totalTime >= 120 ? '😊' : '📚'}</div>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${subjectsHTML || '<p class="text-gray-500 text-center py-4">학습 기록 없음</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
