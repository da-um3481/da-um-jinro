<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 학교/기관 관리 시스템 - DA.UM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans KR', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-school text-3xl text-indigo-600"></i>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">학교/기관 관리</h1>
                        <p class="text-sm text-gray-600">DA.UM 학습관리 시스템</p>
                    </div>
                </div>
                <button onclick="showAddSchoolModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium transition-all duration-300 shadow-lg hover:shadow-xl">
                    <i class="fas fa-plus mr-2"></i>학교 등록
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 통계 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">전체 학교</p>
                        <p class="text-3xl font-bold text-indigo-600" id="totalSchools">0</p>
                    </div>
                    <i class="fas fa-school text-4xl text-indigo-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">활성 계약</p>
                        <p class="text-3xl font-bold text-green-600" id="activeContracts">0</p>
                    </div>
                    <i class="fas fa-check-circle text-4xl text-green-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">전체 학생</p>
                        <p class="text-3xl font-bold text-blue-600" id="totalStudents">0</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-200"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">월 매출</p>
                        <p class="text-3xl font-bold text-purple-600" id="monthlyRevenue">0원</p>
                    </div>
                    <i class="fas fa-won-sign text-4xl text-purple-200"></i>
                </div>
            </div>
        </div>

        <!-- 학교 목록 -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-800">등록된 학교 목록</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">학교명</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">유형</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">프로그램</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">계약기간</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">학생수</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">월 계약금액</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">담당자</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">관리</th>
                        </tr>
                    </thead>
                    <tbody id="schoolsTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="9" class="px-6 py-8 text-center text-gray-500">
                                <i class="fas fa-inbox text-5xl mb-4 text-gray-300"></i>
                                <p>등록된 학교가 없습니다. '학교 등록' 버튼을 눌러 시작하세요.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 학교 등록/수정 모달 -->
    <div id="schoolModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">학교 등록</h3>
            </div>
            <div class="p-6">
                <form id="schoolForm" class="space-y-4">
                    <input type="hidden" id="schoolId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">학교명 *</label>
                        <input type="text" id="schoolName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">학교 유형 *</label>
                        <select id="schoolType" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <option value="">선택하세요</option>
                            <option value="middle_school">🏫 중학교</option>
                            <option value="high_school">🎓 고등학교</option>
                            <option value="individual">👤 개별학생</option>
                            <option value="learning_center">📖 학원/교습소</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">주요 프로그램 *</label>
                        <select id="mainProgram" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <option value="">선택하세요</option>
                            <option value="winter_30days">❄️ 겨울방학 30일</option>
                            <option value="regular_100days">📚 정규학기 100일</option>
                            <option value="custom">✨ 맞춤형 프로그램</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">계약 시작일 *</label>
                            <input type="date" id="contractStartDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">계약 종료일 *</label>
                            <input type="date" id="contractEndDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">월 계약금액 (원) *</label>
                            <input type="number" id="monthlyFee" required min="0" step="10000" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">학생 수</label>
                            <input type="number" id="studentCount" min="0" value="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">담당자 이름</label>
                            <input type="text" id="contactName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">담당자 연락처</label>
                            <input type="tel" id="contactPhone" placeholder="010-1234-5678" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">계약 상태 *</label>
                        <select id="contractStatus" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <option value="active">✅ 활성</option>
                            <option value="pending">⏳ 대기</option>
                            <option value="expired">❌ 종료</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">메모</label>
                        <textarea id="memo" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">취소</button>
                <button onclick="saveSchool()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">저장</button>
            </div>
        </div>
    </div>

    <script>
        // LocalStorage를 사용한 간단한 데이터 저장
        const STORAGE_KEY = 'daum_schools';

        // 데이터 로드
        function loadSchools() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 데이터 저장
        function saveSchools(schools) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(schools));
        }

        // 통계 업데이트
        function updateStatistics() {
            const schools = loadSchools();
            const activeSchools = schools.filter(s => s.contractStatus === 'active');
            const totalStudents = schools.reduce((sum, s) => sum + (parseInt(s.studentCount) || 0), 0);
            const monthlyRevenue = activeSchools.reduce((sum, s) => sum + (parseInt(s.monthlyFee) || 0), 0);

            document.getElementById('totalSchools').textContent = schools.length;
            document.getElementById('activeContracts').textContent = activeSchools.length;
            document.getElementById('totalStudents').textContent = totalStudents;
            document.getElementById('monthlyRevenue').textContent = monthlyRevenue.toLocaleString() + '원';
        }

        // 학교 목록 렌더링
        function renderSchools() {
            const schools = loadSchools();
            const tbody = document.getElementById('schoolsTableBody');

            if (schools.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-6 py-8 text-center text-gray-500">
                            <i class="fas fa-inbox text-5xl mb-4 text-gray-300"></i>
                            <p>등록된 학교가 없습니다. '학교 등록' 버튼을 눌러 시작하세요.</p>
                        </td>
                    </tr>
                `;
                updateStatistics();
                return;
            }

            tbody.innerHTML = schools.map(school => {
                const typeLabels = {
                    'middle_school': '🏫 중학교',
                    'high_school': '🎓 고등학교',
                    'individual': '👤 개별학생',
                    'learning_center': '📖 학원/교습소'
                };

                const programLabels = {
                    'winter_30days': '❄️ 겨울방학 30일',
                    'regular_100days': '📚 정규학기 100일',
                    'custom': '✨ 맞춤형'
                };

                const statusLabels = {
                    'active': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-800">✅ 활성</span>',
                    'pending': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-yellow-100 text-yellow-800">⏳ 대기</span>',
                    'expired': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-red-100 text-red-800">❌ 종료</span>'
                };

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="font-medium text-gray-900">${school.schoolName}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                            ${typeLabels[school.schoolType] || school.schoolType}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                            ${programLabels[school.mainProgram] || school.mainProgram}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                            ${school.contractStartDate} ~ ${school.contractEndDate}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">
                            ${school.studentCount || 0}명
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">
                            ${parseInt(school.monthlyFee || 0).toLocaleString()}원
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                            <div>${school.contactName || '-'}</div>
                            <div class="text-xs text-gray-500">${school.contactPhone || '-'}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            ${statusLabels[school.contractStatus] || school.contractStatus}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <button onclick="editSchool('${school.id}')" class="text-indigo-600 hover:text-indigo-900 mr-3">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteSchool('${school.id}')" class="text-red-600 hover:text-red-900">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            updateStatistics();
        }

        // 모달 열기
        function showAddSchoolModal() {
            document.getElementById('modalTitle').textContent = '학교 등록';
            document.getElementById('schoolForm').reset();
            document.getElementById('schoolId').value = '';
            document.getElementById('schoolModal').classList.remove('hidden');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('schoolModal').classList.add('hidden');
        }

        // 학교 저장
        function saveSchool() {
            const form = document.getElementById('schoolForm');
            if (!form.checkValidity()) {
                alert('필수 항목을 모두 입력해주세요.');
                return;
            }

            const schools = loadSchools();
            const schoolId = document.getElementById('schoolId').value;

            const schoolData = {
                id: schoolId || 'school_' + Date.now(),
                schoolName: document.getElementById('schoolName').value,
                schoolType: document.getElementById('schoolType').value,
                mainProgram: document.getElementById('mainProgram').value,
                contractStartDate: document.getElementById('contractStartDate').value,
                contractEndDate: document.getElementById('contractEndDate').value,
                monthlyFee: document.getElementById('monthlyFee').value,
                studentCount: document.getElementById('studentCount').value || 0,
                contactName: document.getElementById('contactName').value,
                contactPhone: document.getElementById('contactPhone').value,
                contractStatus: document.getElementById('contractStatus').value,
                memo: document.getElementById('memo').value,
                createdAt: schoolId ? schools.find(s => s.id === schoolId)?.createdAt : new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            if (schoolId) {
                const index = schools.findIndex(s => s.id === schoolId);
                if (index !== -1) {
                    schools[index] = schoolData;
                }
            } else {
                schools.push(schoolData);
            }

            saveSchools(schools);
            closeModal();
            renderSchools();
            alert('저장되었습니다.');
        }

        // 학교 수정
        function editSchool(id) {
            const schools = loadSchools();
            const school = schools.find(s => s.id === id);
            if (!school) return;

            document.getElementById('modalTitle').textContent = '학교 수정';
            document.getElementById('schoolId').value = school.id;
            document.getElementById('schoolName').value = school.schoolName;
            document.getElementById('schoolType').value = school.schoolType;
            document.getElementById('mainProgram').value = school.mainProgram;
            document.getElementById('contractStartDate').value = school.contractStartDate;
            document.getElementById('contractEndDate').value = school.contractEndDate;
            document.getElementById('monthlyFee').value = school.monthlyFee;
            document.getElementById('studentCount').value = school.studentCount;
            document.getElementById('contactName').value = school.contactName;
            document.getElementById('contactPhone').value = school.contactPhone;
            document.getElementById('contractStatus').value = school.contractStatus;
            document.getElementById('memo').value = school.memo;

            document.getElementById('schoolModal').classList.remove('hidden');
        }

        // 학교 삭제
        function deleteSchool(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;

            let schools = loadSchools();
            schools = schools.filter(s => s.id !== id);
            saveSchools(schools);
            renderSchools();
            alert('삭제되었습니다.');
        }

        // 초기 로드
        document.addEventListener('DOMContentLoaded', function() {
            renderSchools();
        });
    </script>
</body>
</html>
