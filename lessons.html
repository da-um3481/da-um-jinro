<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 수업 관리 - DA.UM 학습관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        @media (max-width: 768px) {
            body { font-size: 14px; }
            nav h1 { font-size: 1rem !important; }
            nav p { font-size: 0.75rem !important; display: none; }
            .container { padding-left: 1rem !important; padding-right: 1rem !important; }
            .md\:grid-cols-2, .md\:grid-cols-3, .md\:grid-cols-4 { grid-template-columns: 1fr !important; }
            .glass-effect, .bg-white { padding: 1rem !important; }
            input, select, textarea { font-size: 0.875rem !important; padding: 0.75rem !important; }
            button { font-size: 0.875rem !important; padding: 0.75rem !important; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 상단 헤더 - DA.UM 아이덴티티 -->
    <header class="bg-gradient-to-r from-green-800 to-green-700 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <!-- 로고 및 타이틀 (왼편 배치) -->
                <div class="flex items-center space-x-3">
                    <img src="images/daum-logo-transparent.png" alt="DA.UM Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl shadow-lg bg-white p-1" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black">DA.UM 수업 관리</h1>
                        <p class="text-xs sm:text-sm text-green-8100 font-medium">School Lesson Management</p>
                    </div>
                </div>
                <!-- 네비게이션 -->
                <nav class="hidden md:flex space-x-2">
                    <a href="index.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="students.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-users mr-2"></i>학생 관리
                    </a>
                    <a href="lessons.html" class="px-4 py-2 bg-white/30 rounded-lg transition">
                        <i class="fas fa-book mr-2"></i>수업 관리
                    </a>
                    <a href="materials.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-book-open mr-2"></i>교재 관리
                    </a>
                </nav>
                <!-- 모바일 메뉴 -->
                <button onclick="window.location.href='index.html'" class="md:hidden px-3 py-2 hover:bg-white/20 rounded-lg transition">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <div class="container mx-auto px-4 py-8">
        <!-- 수업 내용 입력 폼 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-bold mb-6">📝 수업 내용 등록</h2>
            <form id="lessonForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">날짜 *</label>
                    <input type="date" id="date" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-700">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">학년 *</label>
                    <select id="grade" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-700">
                        <option value="">선택하세요</option>
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">과목 *</label>
                    <select id="subject" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-700">
                        <option value="">선택하세요</option>
                        <option value="국어">국어</option>
                        <option value="영어">영어</option>
                        <option value="수학">수학</option>
                        <option value="과학">과학</option>
                        <option value="사회">사회</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">단원/챕터</label>
                    <input type="text" id="chapter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-700" 
                        placeholder="예: 2단원. 문학의 이해">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">중요도 *</label>
                    <select id="importance" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-700">
                        <option value="보통">보통</option>
                        <option value="높음">높음 (시험 출제 가능성 높음)</option>
                        <option value="낮음">낮음</option>
                    </select>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">수업 내용 *</label>
                    <textarea id="content" required rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-700" 
                        placeholder="오늘 배운 내용을 자세히 입력해주세요.&#10;예: 일차함수의 그래프 그리기, y=ax+b 형태의 그래프 특징 학습"></textarea>
                </div>
                
                <div class="md:col-span-2 flex justify-end space-x-4">
                    <button type="button" onclick="resetForm()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fas fa-redo mr-2"></i>초기화
                    </button>
                    <button type="submit" class="px-6 py-2 bg-green-800 text-white rounded-lg hover:bg-green-800 transition">
                        <i class="fas fa-save mr-2"></i>저장
                    </button>
                </div>
            </form>
        </div>

        <!-- 날짜별 조회 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">📅 날짜별 조회</h2>
            <div class="flex space-x-4">
                <input type="date" id="searchDate" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg">
                <button onclick="searchByDate()" class="px-6 py-2 bg-green-800 text-white rounded-lg hover:bg-green-800">
                    <i class="fas fa-search mr-2"></i>검색
                </button>
            </div>
        </div>

        <!-- 수업 내용 목록 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-6">📚 등록된 수업 내용</h2>
            
            <!-- 필터 -->
            <div class="flex flex-wrap gap-4 mb-6">
                <select id="filterGrade" onchange="loadLessons()" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">전체 학년</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                </select>
                
                <select id="filterSubject" onchange="loadLessons()" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">전체 과목</option>
                    <option value="국어">국어</option>
                    <option value="영어">영어</option>
                    <option value="수학">수학</option>
                    <option value="과학">과학</option>
                    <option value="사회">사회</option>
                </select>
            </div>
            
            <div id="lessonsList" class="space-y-4">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-lg font-bold mb-4">⚠️ 수업 내용 삭제 확인</h3>
            <p class="text-gray-600 mb-6">정말로 이 수업 내용을 삭제하시겠습니까?</p>
            <div class="flex justify-end space-x-4">
                <button onclick="closeDeleteModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    취소
                </button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    삭제
                </button>
            </div>
        </div>
    </div>

    <script src="js/lessons.js"></script>
</body>
</html>
