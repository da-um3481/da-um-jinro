<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 프로그램 - 나도 공부 잘하는 아이 될래요!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .info-section {
            padding: 40px;
            background: linear-gradient(135deg, #7B1FA2 0%, #9C27B0 100%);
            color: white;
            text-align: center;
        }
        
        .info-section h2 {
            font-size: 32px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .benefit-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
        }
        
        .apply-box {
            background: #FFF59D;
            color: #E65100;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 22px;
            font-weight: bold;
        }
        
        .contact {
            font-size: 18px;
            margin-top: 20px;
        }
        
        .download-btn {
            display: inline-block;
            background: white;
            color: #7B1FA2;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                max-width: none;
            }
            .info-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.genspark.ai/api/files/s/HCvxYrrV" alt="근화여중 겨울방학 프로그램 모집 포스터" class="poster-image">
        
        <div class="info-section">
            <h2>🌟 이번 겨울, 나를 바꿀 기회!</h2>
            
            <div class="benefits-grid">
                <div class="benefit-item">✨ 성적이 쑥쑥!</div>
                <div class="benefit-item">🎮 친구들이랑 재미있게!</div>
                <div class="benefit-item">🎁 공부 습관 완성!</div>
                <div class="benefit-item">💪 자신감 UP!</div>
                <div class="benefit-item">🏆 내신 완벽 대비!</div>
                <div class="benefit-item">🎯 내 꿈 찾기!</div>
            </div>
            
            <div class="apply-box">
                📝 신청은 담임쌤 or 진로쌤께!
            </div>
            
            <div class="contact">
                <p><strong>대상:</strong> 근화여자중학교 1, 2학년</p>
                <p><strong>문의:</strong> 010-2657-3481 (정라미)</p>
            </div>
            
            <a href="https://www.genspark.ai/api/files/s/HCvxYrrV" download class="download-btn">
                🎨 포스터 다운로드하기
            </a>
        </div>
    </div>
</body>
</html>
