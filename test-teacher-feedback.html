<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 피드백 테스트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .step {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f8f9fa;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 교사 피드백 시스템 테스트</h1>
        
        <div class="step">
            <h3>Step 1: Google Sheets에서 학생 목록 불러오기</h3>
            <button onclick="testGetStudents()">학생 목록 조회</button>
            <div id="students-result" class="result info" style="display:none;"></div>
        </div>

        <div class="step">
            <h3>Step 2: 교사 피드백 작성</h3>
            <label>학생 ID: <input type="text" id="student-id" placeholder="student_xxx" style="padding: 8px; width: 200px;"></label><br><br>
            <label>학생 이름: <input type="text" id="student-name" placeholder="학생 이름" style="padding: 8px; width: 200px;"></label><br><br>
            <label>피드백 내용:</label><br>
            <textarea id="feedback-content" placeholder="피드백 내용을 입력하세요..." style="width: 100%; height: 100px; padding: 8px; margin-top: 10px;"></textarea><br>
            <button onclick="testSendFeedback()">피드백 전송</button>
            <div id="send-result" class="result info" style="display:none;"></div>
        </div>

        <div class="step">
            <h3>Step 3: 학생 피드백 조회</h3>
            <label>학생 ID: <input type="text" id="check-student-id" placeholder="student_xxx" style="padding: 8px; width: 200px;"></label>
            <button onclick="testGetFeedback()">피드백 조회</button>
            <div id="get-result" class="result info" style="display:none;"></div>
        </div>
    </div>

    <script src="google-sheets-api.js"></script>
    <script>
        async function testGetStudents() {
            const result = document.getElementById('students-result');
            result.style.display = 'block';
            result.textContent = '⏳ 학생 목록 조회 중...';
            result.className = 'result info';
            
            try {
                const data = await getDiagnosticResultsFromCloud();
                
                if (data.status === 'success' && data.data.length > 0) {
                    const studentMap = new Map();
                    data.data.forEach(r => {
                        if (!studentMap.has(r.student_id)) {
                            studentMap.set(r.student_id, {
                                id: r.student_id,
                                name: r.student_name,
                                grade: r.grade
                            });
                        }
                    });
                    
                    const students = Array.from(studentMap.values());
                    result.className = 'result success';
                    result.textContent = `✅ 학생 ${students.length}명 발견!\n\n${JSON.stringify(students, null, 2)}`;
                    
                    // 첫 번째 학생 자동 입력
                    if (students.length > 0) {
                        document.getElementById('student-id').value = students[0].id;
                        document.getElementById('student-name').value = students[0].name;
                        document.getElementById('check-student-id').value = students[0].id;
                    }
                } else {
                    result.className = 'result error';
                    result.textContent = '❌ 학생이 없습니다.\n\n먼저 학생 포털에서 진단평가를 완료하세요.';
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `❌ 에러 발생:\n${error.message}`;
            }
        }

        async function testSendFeedback() {
            const studentId = document.getElementById('student-id').value;
            const studentName = document.getElementById('student-name').value;
            const content = document.getElementById('feedback-content').value;
            const result = document.getElementById('send-result');
            
            if (!studentId || !studentName || !content) {
                alert('모든 필드를 입력해주세요!');
                return;
            }
            
            result.style.display = 'block';
            result.textContent = '⏳ 피드백 전송 중...';
            result.className = 'result info';
            
            try {
                const feedback = {
                    student_id: studentId,
                    student_name: studentName,
                    date: new Date().toISOString().split('T')[0],
                    feedback_type: 'general',
                    content: content
                };
                
                const response = await saveTeacherFeedbackToCloud(feedback);
                
                if (response.status === 'success') {
                    result.className = 'result success';
                    result.textContent = `✅ 피드백 전송 성공!\n\n전송된 데이터:\n${JSON.stringify(feedback, null, 2)}`;
                } else {
                    result.className = 'result error';
                    result.textContent = `❌ 전송 실패:\n${response.message}`;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `❌ 에러 발생:\n${error.message}`;
            }
        }

        async function testGetFeedback() {
            const studentId = document.getElementById('check-student-id').value;
            const result = document.getElementById('get-result');
            
            if (!studentId) {
                alert('학생 ID를 입력해주세요!');
                return;
            }
            
            result.style.display = 'block';
            result.textContent = '⏳ 피드백 조회 중...';
            result.className = 'result info';
            
            try {
                const response = await getTeacherFeedbackFromCloud(studentId);
                
                if (response.status === 'success') {
                    result.className = 'result success';
                    result.textContent = `✅ 피드백 ${response.data.length}개 발견!\n\n${JSON.stringify(response.data, null, 2)}`;
                } else {
                    result.className = 'result error';
                    result.textContent = `❌ 조회 실패:\n${response.message}`;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `❌ 에러 발생:\n${error.message}`;
            }
        }
    </script>
</body>
</html>
