<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학교 과목별 학습관리시스템 - DA.UM</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
        .font-black-han {
            font-family: 'Black Han Sans', sans-serif;
        }
        .font-noto {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fadeInDown 1s ease-out;
        }
    </style>
</head>
<body>
    <div class="relative w-full min-h-screen overflow-hidden flex flex-col justify-center items-center bg-gray-900 text-white font-noto" id="slide-container">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img alt="Education Technology Background" class="w-full h-full object-cover opacity-90" src="https://www.genspark.ai/api/files/s/fPWLe6Jk?cache_control=3600"/>
            <!-- Overlay Gradient -->
            <div class="absolute inset-0 bg-blue-900 opacity-80 mix-blend-multiply"></div>
            <div class="absolute inset-0 bg-black opacity-40"></div>
        </div>

        <!-- Home Button -->
        <a href="index.html" class="absolute top-8 left-8 z-20 flex items-center space-x-2 bg-white bg-opacity-10 hover:bg-opacity-20 px-4 py-2 rounded-lg transition-all duration-300 border border-white border-opacity-30">
            <i class="fas fa-home text-white"></i>
            <span class="text-white font-medium">메인으로</span>
        </a>

        <!-- Content Wrapper -->
        <div class="relative z-10 flex flex-col items-center justify-center w-full h-full px-8 md:px-16 py-20">
            <!-- Top Decoration -->
            <div class="mb-10 animate-fade-in-down">
                <div class="flex items-center space-x-3 bg-blue-600 bg-opacity-30 px-6 py-2 rounded-full border border-blue-400 border-opacity-30">
                    <i class="fas fa-graduation-cap text-blue-300 text-xl"></i>
                    <p class="text-blue-100 font-medium tracking-wide text-sm">미래 교육을 여는 스마트 솔루션</p>
                </div>
            </div>

            <!-- Main Title Area -->
            <div class="text-center mb-12">
                <h1 class="font-black-han text-5xl md:text-7xl mb-6 leading-tight text-shadow tracking-tight text-white">
                    중학교 과목별<br/>
                    <span class="text-blue-400">학습관리시스템</span>
                </h1>
                <div class="w-24 h-2 bg-blue-500 mx-auto rounded-full mb-8"></div>
                <h2 class="text-2xl md:text-3xl font-light text-gray-200 tracking-wider">
                    2022 개정 교육과정 기반 LMS
                </h2>
            </div>

            <!-- Description / Features Badge Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16 w-full max-w-4xl">
                <div class="glass-panel rounded-xl p-5 text-center transform hover:scale-105 transition-transform duration-300">
                    <div class="text-blue-300 mb-3 text-2xl"><i class="fas fa-book-reader"></i></div>
                    <p class="font-bold text-lg mb-1">맞춤형 학습</p>
                    <p class="text-xs text-gray-300">학생 주도적 성장 지원</p>
                </div>
                <div class="glass-panel rounded-xl p-5 text-center transform hover:scale-105 transition-transform duration-300">
                    <div class="text-blue-300 mb-3 text-2xl"><i class="fas fa-chart-line"></i></div>
                    <p class="font-bold text-lg mb-1">데이터 분석</p>
                    <p class="text-xs text-gray-300">성취기준 기반 평가 관리</p>
                </div>
                <div class="glass-panel rounded-xl p-5 text-center transform hover:scale-105 transition-transform duration-300">
                    <div class="text-blue-300 mb-3 text-2xl"><i class="fas fa-users-cog"></i></div>
                    <p class="font-bold text-lg mb-1">자유학기 연계</p>
                    <p class="text-xs text-gray-300">창의적 체험활동 통합</p>
                </div>
            </div>

            <!-- CTA Button -->
            <div class="mb-12">
                <a href="index.html" class="inline-flex items-center space-x-3 bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-full text-lg font-bold transition-all duration-300 transform hover:scale-105 shadow-2xl">
                    <span>시스템 둘러보기</span>
                    <i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <!-- Footer Info -->
            <div class="w-full max-w-6xl flex flex-col md:flex-row justify-between items-center border-t border-gray-600 border-opacity-50 pt-6 gap-6">
                <div class="text-center md:text-left">
                    <p class="text-gray-400 text-sm font-light mb-1">Presentation by</p>
                    <p class="text-xl font-bold text-white flex items-center justify-center md:justify-start">
                        <i class="fas fa-building mr-2 text-blue-500"></i> DA.UM 다움진로진학컨설팅
                    </p>
                </div>
                <div class="text-center md:text-right">
                    <p class="text-gray-400 text-sm font-light mb-1">Date</p>
                    <p class="text-xl font-bold text-white">2025. 12. 17.</p>
                </div>
            </div>
        </div>

        <!-- Decorative Elements -->
        <div class="absolute top-0 right-0 p-10 opacity-20 hidden lg:block">
            <i class="fas fa-laptop-code text-9xl text-white transform rotate-12"></i>
        </div>
        <div class="absolute bottom-20 left-10 opacity-10 hidden lg:block">
            <i class="fas fa-network-wired text-8xl text-white transform -rotate-12"></i>
        </div>
    </div>
</body>
</html>
