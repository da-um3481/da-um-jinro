<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교/기관 관리 - DA.UM 학습관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            
            nav h1 {
                font-size: 1rem !important;
            }
            
            nav p {
                font-size: 0.75rem !important;
                display: none;
            }
            
            nav .flex.space-x-4 {
                display: none !important;
            }
            
            .container {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            
            /* 배너 최적화 */
            .bg-gradient-to-r.from-blue-500 {
                padding: 1.5rem !important;
            }
            
            .bg-gradient-to-r.from-blue-500 h2 {
                font-size: 1.25rem !important;
            }
            
            .bg-gradient-to-r.from-blue-500 p {
                font-size: 0.875rem !important;
            }
            
            .bg-gradient-to-r.from-blue-500 .text-6xl {
                display: none;
            }
            
            /* 그리드 1열 */
            .md\\:grid-cols-3,
            .md\\:grid-cols-2 {
                grid-template-columns: 1fr !important;
            }
            
            /* 폼 최적화 */
            .bg-white.rounded-2xl {
                padding: 1rem !important;
            }
            
            .bg-white.rounded-2xl h2 {
                font-size: 1.1rem !important;
            }
            
            input,
            select,
            textarea {
                font-size: 0.875rem !important;
                padding: 0.75rem !important;
            }
            
            button {
                font-size: 0.875rem !important;
                padding: 0.75rem 1rem !important;
            }
            
            /* 학교 카드 */
            .rounded-2xl.shadow-xl {
                padding: 1rem !important;
                margin-bottom: 1rem !important;
            }
        }
        
        @media (max-width: 480px) {
            nav h1 {
                font-size: 0.9rem !important;
            }
            
            .bg-gradient-to-r.from-blue-500 h2 {
                font-size: 1.1rem !important;
            }
        }
    </style>
    <script src="js/security.js"></script>
</head>
<body class="bg-gray-50">
    <!-- 상단 네비게이션 -->
    <!-- 상단 헤더 - DA.UM 아이덴티티 -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <!-- 로고 및 타이틀 (왼편 배치) -->
                <div class="flex items-center space-x-3">
                    <img src="images/daum-logo-transparent.png" alt="DA.UM Logo" class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl shadow-lg bg-white p-1" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black">DA.UM 학교 관리</h1>
                        <p class="text-xs sm:text-sm text-indigo-100 font-medium">Schools & Institution Management</p>
                    </div>
                </div>
                <!-- 네비게이션 -->
                <nav class="hidden md:flex space-x-2">
                    <a href="index.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-home mr-2"></i>대시보드
                    </a>
                    <a href="students.html" class="px-4 py-2 hover:bg-white/20 rounded-lg transition">
                        <i class="fas fa-users mr-2"></i>학생 관리
                    </a>
                    <a href="schools-management.html" class="px-4 py-2 bg-white/30 rounded-lg transition">
                        <i class="fas fa-school mr-2"></i>학교 관리
                    </a>
                </nav>
                <!-- 모바일 메뉴 -->
                <button onclick="window.location.href='index.html'" class="md:hidden px-3 py-2 hover:bg-white/20 rounded-lg transition">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 안내 배너 -->
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-2xl shadow-2xl p-8 mb-8">
            <div class="flex items-start justify-between">
                <div class="flex-1">
                    <h2 class="text-3xl font-bold mb-3">🎯 학교별 독립 관리 시스템</h2>
                    <p class="text-lg text-blue-100 mb-4">여러 학교와 개별 학생을 동시에 관리할 수 있습니다</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                        <div class="bg-white bg-opacity-20 rounded-lg p-4">
                            <div class="text-2xl font-bold">📚 중학교</div>
                            <div class="text-sm text-blue-100 mt-1">중1, 중2, 중3</div>
                        </div>
                        <div class="bg-white bg-opacity-20 rounded-lg p-4">
                            <div class="text-2xl font-bold">🎓 고등학교</div>
                            <div class="text-sm text-blue-100 mt-1">고1, 고2, 고3</div>
                        </div>
                        <div class="bg-white bg-opacity-20 rounded-lg p-4">
                            <div class="text-2xl font-bold">👤 개별학생</div>
                            <div class="text-sm text-blue-100 mt-1">1:1 맞춤 관리</div>
                        </div>
                    </div>
                </div>
                <div class="text-6xl ml-6">
                    🏫
                </div>
            </div>
        </div>

        <!-- 학교 등록 폼 -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                <i class="fas fa-plus-circle text-blue-600 mr-3"></i>
                새 학교/기관 등록
            </h2>

            <form id="schoolForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 학교명 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-school mr-2 text-blue-600"></i>학교/기관명 *
                        </label>
                        <input type="text" id="schoolName" required 
                               placeholder="예: A중학교, B고등학교, 개별학생"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- 학교 유형 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-tag mr-2 text-purple-600"></i>유형 *
                        </label>
                        <select id="schoolType" required 
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                            <option value="">선택하세요</option>
                            <option value="middle_school">🏫 중학교</option>
                            <option value="high_school">🎓 고등학교</option>
                            <option value="individual">👤 개별학생</option>
                            <option value="learning_center">📖 학원/교습소</option>
                        </select>
                    </div>

                    <!-- 계약 시작일 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-calendar-check mr-2 text-green-600"></i>계약 시작일
                        </label>
                        <input type="date" id="contractStartDate"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500">
                    </div>

                    <!-- 계약 종료일 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-calendar-times mr-2 text-red-600"></i>계약 종료일
                        </label>
                        <input type="date" id="contractEndDate"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500">
                    </div>

                    <!-- 월 계약금액 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-won-sign mr-2 text-yellow-600"></i>월 계약금액 (원)
                        </label>
                        <input type="number" id="monthlyFee" min="0" step="10000"
                               placeholder="예: 1500000"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500">
                    </div>

                    <!-- 학생 수 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-users mr-2 text-indigo-600"></i>학생 수 (명)
                        </label>
                        <input type="number" id="studentCount" min="0"
                               placeholder="예: 30"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>

                    <!-- 담당자명 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-user-tie mr-2 text-teal-600"></i>담당자명
                        </label>
                        <input type="text" id="contactName"
                               placeholder="예: 김선생님"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                    </div>

                    <!-- 담당자 연락처 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-phone mr-2 text-pink-600"></i>담당자 연락처
                        </label>
                        <input type="tel" id="contactPhone"
                               placeholder="010-1234-5678"
                               class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500">
                    </div>

                    <!-- 계약 상태 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-check-circle mr-2 text-green-600"></i>계약 상태 *
                        </label>
                        <select id="contractStatus" required
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500">
                            <option value="active">✅ 활성 (계약 진행 중)</option>
                            <option value="pending">⏳ 대기 (계약 준비 중)</option>
                            <option value="expired">❌ 종료 (계약 만료)</option>
                        </select>
                    </div>

                    <!-- 프로그램 유형 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">
                            <i class="fas fa-clipboard-list mr-2 text-blue-600"></i>주 프로그램
                        </label>
                        <select id="mainProgram"
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">선택하세요</option>
                            <option value="winter_30days">❄️ 겨울방학 30일</option>
                            <option value="regular_100days">📚 정규학기 100일</option>
                            <option value="custom">✨ 맞춤형 프로그램</option>
                        </select>
                    </div>
                </div>

                <!-- 메모 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fas fa-sticky-note mr-2 text-orange-600"></i>메모 (선택사항)
                    </label>
                    <textarea id="schoolMemo" rows="3"
                              placeholder="특이사항, 요청사항 등을 자유롭게 기록하세요"
                              class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"></textarea>
                </div>

                <!-- 버튼 -->
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="resetForm()" 
                            class="px-6 py-3 border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition font-bold">
                        <i class="fas fa-redo mr-2"></i>초기화
                    </button>
                    <button type="submit" 
                            class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg hover:from-blue-600 hover:to-purple-700 transition font-bold shadow-lg">
                        <i class="fas fa-save mr-2"></i>저장
                    </button>
                </div>
            </form>
        </div>

        <!-- 학교 목록 -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center justify-between">
                <span>
                    <i class="fas fa-list text-purple-600 mr-3"></i>
                    등록된 학교/기관 목록
                </span>
                <span class="text-sm font-normal text-gray-600">
                    총 <span id="totalCount" class="text-blue-600 font-bold">0</span>개
                </span>
            </h2>

            <!-- 필터 -->
            <div class="mb-6 flex flex-wrap gap-4">
                <select id="filterType" onchange="filterSchools()" 
                        class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">전체 유형</option>
                    <option value="middle_school">🏫 중학교</option>
                    <option value="high_school">🎓 고등학교</option>
                    <option value="individual">👤 개별학생</option>
                    <option value="learning_center">📖 학원/교습소</option>
                </select>

                <select id="filterStatus" onchange="filterSchools()"
                        class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                    <option value="">전체 상태</option>
                    <option value="active">✅ 활성</option>
                    <option value="pending">⏳ 대기</option>
                    <option value="expired">❌ 종료</option>
                </select>
            </div>

            <!-- 테이블 -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">학교/기관명</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">유형</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">학생수</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">월 계약금액</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">계약기간</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">담당자</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">상태</th>
                            <th class="px-6 py-4 text-left text-xs font-bold uppercase">작업</th>
                        </tr>
                    </thead>
                    <tbody id="schoolList" class="bg-white divide-y divide-gray-200">
                        <!-- 동적으로 생성됨 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold mb-4 text-red-600">
                <i class="fas fa-exclamation-triangle mr-2"></i>삭제 확인
            </h3>
            <p class="text-gray-600 mb-6">
                정말로 이 학교/기관을 삭제하시겠습니까?<br>
                <strong class="text-red-600">소속 학생 데이터는 유지됩니다.</strong>
            </p>
            <div class="flex justify-end space-x-4">
                <button onclick="closeDeleteModal()" 
                        class="px-6 py-3 border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition font-bold">
                    취소
                </button>
                <button id="confirmDeleteBtn" 
                        class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-bold">
                    삭제
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentEditId = null;
        let deleteSchoolId = null;

        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', function() {
            initializeSchoolsData();
            loadSchools();
            setupFormHandler();
        });

        // 초기 학교 데이터 설정
        function initializeSchoolsData() {
            const existingSchools = localStorage.getItem('schools');
            if (!existingSchools) {
                const defaultSchools = [
                    {
                        id: 'school_1',
                        school_name: '근화여자중학교',
                        school_type: 'middle_school',
                        contract_status: 'active',
                        main_program: 'winter_30days',
                        student_count: 30,
                        monthly_fee: 1500000,
                        contact_name: '담당선생님',
                        contact_phone: '010-1234-5678',
                        contract_start_date: '2025-01-05',
                        contract_end_date: '2025-02-04',
                        memo: '겨울방학 30일 프로그램',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    },
                    {
                        id: 'school_2',
                        school_name: 'DA.UM 진로진학컨설팅',
                        school_type: 'learning_center',
                        contract_status: 'active',
                        main_program: 'custom',
                        student_count: 0,
                        monthly_fee: 0,
                        contact_name: '김은숙',
                        contact_phone: '010-9876-5432',
                        memo: '통합 학습 관리 시스템',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    }
                ];
                localStorage.setItem('schools', JSON.stringify(defaultSchools));
            }
        }

        // 폼 핸들러 설정
        function setupFormHandler() {
            document.getElementById('schoolForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await saveSchool();
            });
        }

        // 학교 목록 로드 (localStorage 기반)
        async function loadSchools() {
            try {
                const schools = JSON.parse(localStorage.getItem('schools')) || [];
                displaySchools(schools);
            } catch (error) {
                console.error('학교 목록 로드 오류:', error);
                displaySchools([]);
            }
        }

        // 학교 목록 표시
        function displaySchools(schools) {
            const tbody = document.getElementById('schoolList');
            document.getElementById('totalCount').textContent = schools.length;

            if (schools.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-6 py-8 text-center text-gray-500">
                            <div class="text-4xl mb-3">🏫</div>
                            <div>등록된 학교/기관이 없습니다.</div>
                            <div class="text-sm mt-2">위의 폼에서 새로 등록하세요!</div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = schools.map(school => {
                const typeEmoji = {
                    'middle_school': '🏫 중학교',
                    'high_school': '🎓 고등학교',
                    'individual': '👤 개별학생',
                    'learning_center': '📖 학원/교습소'
                };

                const statusBadge = {
                    'active': '<span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-bold">✅ 활성</span>',
                    'pending': '<span class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-bold">⏳ 대기</span>',
                    'expired': '<span class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-xs font-bold">❌ 종료</span>'
                };

                const contractPeriod = school.contract_start_date || school.contract_end_date ? 
                    `${school.contract_start_date || '-'} ~ ${school.contract_end_date || '-'}` : '-';

                const monthlyFee = school.monthly_fee ? 
                    `${parseInt(school.monthly_fee).toLocaleString()}원` : '-';

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 font-bold text-gray-900">${school.school_name}</td>
                        <td class="px-6 py-4 text-sm">${typeEmoji[school.school_type] || school.school_type}</td>
                        <td class="px-6 py-4 text-sm">${school.student_count || 0}명</td>
                        <td class="px-6 py-4 text-sm font-semibold text-blue-600">${monthlyFee}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${contractPeriod}</td>
                        <td class="px-6 py-4 text-sm">
                            ${school.contact_name || '-'}<br>
                            <span class="text-xs text-gray-500">${school.contact_phone || ''}</span>
                        </td>
                        <td class="px-6 py-4">${statusBadge[school.contract_status] || '-'}</td>
                        <td class="px-6 py-4 text-sm space-x-2">
                            <button onclick="editSchool('${school.id}')" 
                                    class="text-blue-600 hover:text-blue-900" title="수정">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="showDeleteModal('${school.id}')" 
                                    class="text-red-600 hover:text-red-900" title="삭제">
                                <i class="fas fa-trash"></i>
                            </button>
                            <a href="students.html?school=${school.id}" 
                               class="text-green-600 hover:text-green-900" title="학생 보기">
                                <i class="fas fa-users"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 학교 저장 (localStorage 기반)
        async function saveSchool() {
            try {
                const schools = JSON.parse(localStorage.getItem('schools')) || [];
                
                const schoolData = {
                    id: currentEditId || 'school_' + Date.now(),
                    school_name: document.getElementById('schoolName').value,
                    school_type: document.getElementById('schoolType').value,
                    contract_start_date: document.getElementById('contractStartDate').value || null,
                    contract_end_date: document.getElementById('contractEndDate').value || null,
                    monthly_fee: parseInt(document.getElementById('monthlyFee').value) || 0,
                    student_count: parseInt(document.getElementById('studentCount').value) || 0,
                    contact_name: document.getElementById('contactName').value || null,
                    contact_phone: document.getElementById('contactPhone').value || null,
                    contract_status: document.getElementById('contractStatus').value,
                    main_program: document.getElementById('mainProgram').value || null,
                    memo: document.getElementById('schoolMemo').value || null,
                    created_at: currentEditId ? schools.find(s => s.id === currentEditId)?.created_at : new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };

                if (currentEditId) {
                    // 수정
                    const index = schools.findIndex(s => s.id === currentEditId);
                    if (index !== -1) {
                        schools[index] = schoolData;
                    }
                } else {
                    // 신규 등록
                    schools.push(schoolData);
                }

                localStorage.setItem('schools', JSON.stringify(schools));
                alert(currentEditId ? '✅ 수정되었습니다!' : '✅ 등록되었습니다!');
                resetForm();
                loadSchools();
            } catch (error) {
                console.error('저장 오류:', error);
                alert('❌ 저장에 실패했습니다.');
            }
        }

        // 학교 수정 (localStorage 기반)
        async function editSchool(id) {
            try {
                const schools = JSON.parse(localStorage.getItem('schools')) || [];
                const school = schools.find(s => s.id === id);

                if (!school) {
                    alert('❌ 학교 정보를 찾을 수 없습니다.');
                    return;
                }

                currentEditId = id;
                document.getElementById('schoolName').value = school.school_name;
                document.getElementById('schoolType').value = school.school_type;
                document.getElementById('contractStartDate').value = school.contract_start_date || '';
                document.getElementById('contractEndDate').value = school.contract_end_date || '';
                document.getElementById('monthlyFee').value = school.monthly_fee || '';
                document.getElementById('studentCount').value = school.student_count || '';
                document.getElementById('contactName').value = school.contact_name || '';
                document.getElementById('contactPhone').value = school.contact_phone || '';
                document.getElementById('contractStatus').value = school.contract_status;
                document.getElementById('mainProgram').value = school.main_program || '';
                document.getElementById('schoolMemo').value = school.memo || '';

                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (error) {
                console.error('수정 로드 오류:', error);
                alert('❌ 데이터를 불러오지 못했습니다.');
            }
        }

        // 삭제 모달
        function showDeleteModal(id) {
            deleteSchoolId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('confirmDeleteBtn').onclick = () => deleteSchool();
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            deleteSchoolId = null;
        }

        // 학교 삭제 (localStorage 기반)
        async function deleteSchool() {
            try {
                const schools = JSON.parse(localStorage.getItem('schools')) || [];
                const updatedSchools = schools.filter(s => s.id !== deleteSchoolId);
                
                localStorage.setItem('schools', JSON.stringify(updatedSchools));
                alert('✅ 삭제되었습니다!');
                closeDeleteModal();
                loadSchools();
            } catch (error) {
                console.error('삭제 오류:', error);
                alert('❌ 삭제에 실패했습니다.');
            }
        }

        // 폼 초기화
        function resetForm() {
            document.getElementById('schoolForm').reset();
            currentEditId = null;
        }

        // 필터링
        function filterSchools() {
            const typeFilter = document.getElementById('filterType').value;
            const statusFilter = document.getElementById('filterStatus').value;

            const rows = document.querySelectorAll('#schoolList tr');
            rows.forEach(row => {
                const matchType = !typeFilter || row.textContent.includes(typeFilter);
                const matchStatus = !statusFilter || row.textContent.includes(statusFilter);
                row.style.display = matchType && matchStatus ? '' : 'none';
            });
        }
    </script>
</body>
</html>
