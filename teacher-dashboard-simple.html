<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 대시보드 - 학생 학습 기록</title>
    
    <!-- 버전 정보 -->
    <meta name="version" content="1.8.0">
    <meta name="build-date" content="2026-01-06">
    
    <!-- 캐시 무효화 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #4ade80;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            padding: 4rem;
        }

        .loading i {
            font-size: 3rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .date-summary {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .date-summary h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .date-stat-item {
            text-align: center;
        }

        .date-stat-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .date-stat-item .label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .student-list {
            display: grid;
            gap: 1.5rem;
        }

        .student-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .student-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.2);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .student-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .student-info .meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .total-time {
            text-align: right;
        }

        .total-time .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .total-time .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .subject-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
        }

        .subject-item .subject-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .subject-item .subject-stats {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .expand-btn {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .expand-btn:hover {
            background: var(--primary);
            color: white;
        }

        .records-detail {
            margin-top: 1rem;
            display: none;
        }

        .records-detail.show {
            display: block;
        }

        .feedback-section {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid var(--accent);
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 8px;
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .feedback-header h5 {
            color: var(--accent);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .feedback-textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.75rem;
            background: var(--bg-dark);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            transition: all 0.3s;
        }

        .feedback-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(240, 147, 251, 0.3);
        }

        .feedback-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-ai {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-ai:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-save {
            background: linear-gradient(135deg, var(--success), #22c55e);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-edit {
            background: rgba(102, 126, 234, 0.2);
            color: var(--primary);
        }

        .btn-edit:hover {
            background: var(--primary);
            color: white;
        }

        .feedback-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 6px;
            color: var(--text);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .records-table th {
            text-align: left;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .records-table td {
            padding: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
        }

        .empty-state i {
            font-size: 4rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> 교사 대시보드</h1>
            <p>학생 학습 기록 - 실시간 Google Sheets 연동</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 학생 이름으로 검색...">
            </div>
            <div class="search-box">
                <input type="date" id="dateFilter" min="2026-01-05" max="2026-01-30">
            </div>
            <button class="btn" onclick="showAllRecords()" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);">
                <i class="fas fa-list"></i>
                전체 기록 보기
            </button>
            <button class="btn" onclick="loadData()">
                <i class="fas fa-sync-alt"></i>
                새로고침
            </button>
            <button class="btn" onclick="exportToExcel()" style="background: linear-gradient(135deg, #10b981, #059669);">
                <i class="fas fa-file-excel"></i>
                엑셀 내보내기
            </button>
        </div>

        <div id="statsContainer"></div>
        <div id="contentContainer"></div>
    </div>

    <script>
        // 🔧 Google Sheets CSV URL
        // 스프레드시트 ID: 1UNGlEFfXRwqBy-LUm9trBTJRlgkHsOGKfBI7hCqRpeo
        // 시트 gid: 1158249397 (study_records)
        // ⚠️ 주의: "웹에 게시"가 활성화되어 있어야 합니다!
        // 🆕 업데이트: 2026-01-06 (새 발행 URL)
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0yhSielFTmjrIIfRxSQPqAA1OyIK-uvE8Z4D1b7JhFCbVwH3-adK7jnI-bU9_JGCHuEXp00nCMcvf/pub?gid=1158249397&single=true&output=csv';
        
        let allStudents = [];
        let allRecords = [];
        let feedbacks = {}; // { "studentName_date": "feedback text" }

        // 피드백 로드
        function loadFeedbacks() {
            const saved = localStorage.getItem('teacher_feedbacks');
            if (saved) {
                try {
                    feedbacks = JSON.parse(saved);
                } catch (e) {
                    feedbacks = {};
                }
            }
        }

        // 피드백 저장
        function saveFeedbacks() {
            localStorage.setItem('teacher_feedbacks', JSON.stringify(feedbacks));
        }

        // 피드백 키 생성
        function getFeedbackKey(studentName, date) {
            return `${studentName}_${date}`;
        }

        // AI 자동 피드백 생성
        function generateAIFeedback(studentName, date, dateData) {
            const totalMinutes = dateData.totalMinutes;
            const totalHours = Math.floor(totalMinutes / 60);
            const remainMinutes = totalMinutes % 60;
            const records = dateData.records;
            
            // 과목별 그룹화
            const subjectGroups = {};
            records.forEach(r => {
                if (!subjectGroups[r.subject]) {
                    subjectGroups[r.subject] = { count: 0, totalTime: 0, contents: [] };
                }
                subjectGroups[r.subject].count++;
                subjectGroups[r.subject].totalTime += r.time;
                if (r.content && r.content !== '학습 완료') {
                    subjectGroups[r.subject].contents.push(r.content);
                }
            });
            
            const subjects = Object.keys(subjectGroups);
            const subjectCount = subjects.length;
            
            let feedback = '';
            
            // 1. 총 학습 시간 평가
            if (totalMinutes >= 180) {
                feedback += '✅ 오늘 총 ' + (totalHours > 0 ? totalHours + '시간 ' : '') + remainMinutes + '분 동안 매우 충실하게 학습했습니다!\n\n';
            } else if (totalMinutes >= 120) {
                feedback += '✅ 오늘 총 ' + (totalHours > 0 ? totalHours + '시간 ' : '') + remainMinutes + '분 동안 꾸준히 학습했습니다.\n\n';
            } else if (totalMinutes >= 60) {
                feedback += '✅ 오늘 총 ' + (totalHours > 0 ? totalHours + '시간 ' : '') + remainMinutes + '분 학습했습니다.\n\n';
            } else {
                feedback += '✅ 오늘 ' + remainMinutes + '분 학습했습니다.\n\n';
            }
            
            // 2. 과목별 분석
            feedback += '📚 학습 내역:\n';
            subjects.forEach(subject => {
                const group = subjectGroups[subject];
                const h = Math.floor(group.totalTime / 60);
                const m = group.totalTime % 60;
                
                feedback += '  • ' + subject + ': ';
                if (h > 0) feedback += h + '시간 ';
                feedback += m + '분';
                
                if (group.count > 1) {
                    feedback += ' (' + group.count + '회 반복)';
                    if (group.count >= 3) {
                        feedback += ' - 개념을 확실히 다졌습니다!';
                    } else {
                        feedback += ' - 꾸준히 복습하고 있습니다.';
                    }
                }
                
                if (group.contents.length > 0) {
                    feedback += '\n    내용: ' + group.contents.slice(0, 3).join(', ');
                    if (group.contents.length > 3) {
                        feedback += ' 외 ' + (group.contents.length - 3) + '개';
                    }
                }
                feedback += '\n';
            });
            
            feedback += '\n';
            
            // 3. 과목 균형 평가
            if (subjectCount >= 3) {
                feedback += '💪 다양한 과목을 균형있게 학습하는 훌륭한 습관을 보여주고 있습니다.\n';
            } else if (subjectCount === 2) {
                feedback += '💪 두 과목을 집중적으로 학습했습니다.\n';
            } else {
                feedback += '💪 한 과목에 집중하여 깊이있게 학습했습니다.\n';
            }
            
            // 4. 격려 메시지
            if (totalMinutes >= 120) {
                feedback += '\n🌟 오늘도 최선을 다한 모습이 멋집니다. 내일도 화이팅!';
            } else if (totalMinutes >= 60) {
                feedback += '\n🌟 꾸준한 학습 태도가 좋습니다. 계속 이 페이스를 유지하세요!';
            } else {
                feedback += '\n🌟 시작이 중요합니다. 내일은 조금 더 시간을 투자해보세요!';
            }
            
            return feedback;
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 버전 정보 출력
            const version = document.querySelector('meta[name="version"]')?.content || 'unknown';
            const buildDate = document.querySelector('meta[name="build-date"]')?.content || 'unknown';
            console.log(`🎯 교사 대시보드 v${version} (빌드: ${buildDate})`);
            
            loadFeedbacks();
            loadData(); // 데이터 로드 (processData에서 날짜 자동 설정)
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterData();
            });
            document.getElementById('dateFilter').addEventListener('change', (e) => {
                filterData();
            });
        });

        // 🆕 전체 기록 보기 (날짜 필터 제거)
        function showAllRecords() {
            const dateFilter = document.getElementById('dateFilter');
            dateFilter.value = ''; // 날짜 필터 비우기
            filterData(); // 전체 데이터 표시
            console.log('📋 전체 학습 기록을 표시합니다');
        }

        // 엑셀 내보내기 함수
        function exportToExcel() {
            const selectedDate = document.getElementById('dateFilter').value;
            
            if (!selectedDate) {
                alert('📅 날짜를 먼저 선택해주세요!\n\n엑셀 내보내기는 특정 날짜를 선택한 후 사용할 수 있습니다.');
                return;
            }
            
            // 선택된 날짜의 데이터 필터링
            const dateStudents = allStudents.filter(student => 
                student.records.some(r => r.date === selectedDate)
            ).map(student => {
                // 해당 날짜의 기록만 필터링
                const dateRecords = student.records.filter(r => r.date === selectedDate);
                
                // 날짜별 과목 그룹화
                const dateSubjects = {};
                dateRecords.forEach(record => {
                    const subject = record.subject;
                    if (!dateSubjects[subject]) {
                        dateSubjects[subject] = { count: 0, totalMinutes: 0, contents: [] };
                    }
                    dateSubjects[subject].count++;
                    dateSubjects[subject].totalMinutes += record.time;
                    if (record.content) {
                        dateSubjects[subject].contents.push(record.content);
                    }
                });
                
                return {
                    studentName: student.studentName,
                    date: selectedDate,
                    dateRecords,
                    dateSubjects
                };
            });
            
            if (dateStudents.length === 0) {
                alert(`${selectedDate}에 학습 기록이 없습니다.`);
                return;
            }
            
            // 엑셀 데이터 생성
            const excelData = [];
            
            // 헤더 추가
            excelData.push(['학생 이름', '날짜', '과목', '학습 시간', '학습 횟수', '학습 내용', '교사 피드백']);
            
            dateStudents.forEach(student => {
                const feedbackKey = getFeedbackKey(student.studentName, selectedDate);
                const feedback = feedbacks[feedbackKey] || '';
                
                let firstRow = true;
                Object.entries(student.dateSubjects).forEach(([subject, data]) => {
                    const hours = Math.floor(data.totalMinutes / 60);
                    const mins = data.totalMinutes % 60;
                    const timeStr = hours > 0 ? `${hours}시간 ${mins}분` : `${mins}분`;
                    const content = data.contents.join(', ') || '학습 완료';
                    
                    if (firstRow) {
                        excelData.push([
                            student.studentName,
                            selectedDate,
                            subject,
                            timeStr,
                            `${data.count}회`,
                            content,
                            feedback
                        ]);
                        firstRow = false;
                    } else {
                        excelData.push([
                            '',
                            '',
                            subject,
                            timeStr,
                            `${data.count}회`,
                            content,
                            ''
                        ]);
                    }
                });
                
                // 빈 줄 추가 (학생 구분)
                excelData.push(['', '', '', '', '', '', '']);
            });
            
            // 통계 요약 추가
            const totalMinutes = dateStudents.reduce((sum, s) => {
                return sum + s.dateRecords.reduce((rSum, r) => rSum + r.time, 0);
            }, 0);
            const totalHours = Math.floor(totalMinutes / 60);
            const avgMinutes = dateStudents.length > 0 ? Math.round(totalMinutes / dateStudents.length) : 0;
            
            excelData.push(['']);
            excelData.push(['=== 통계 요약 ===']);
            excelData.push(['날짜', selectedDate]);
            excelData.push(['학습한 학생 수', `${dateStudents.length}명`]);
            excelData.push(['총 학습 시간', `${totalHours}시간 ${totalMinutes % 60}분`]);
            excelData.push(['학생당 평균 시간', `${avgMinutes}분`]);
            
            // 엑셀 파일 생성

        function loadData() {
            const contentContainer = document.getElementById('contentContainer');
            contentContainer.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p style="margin-top: 1rem; color: var(--text-muted);">Google Sheets에서 데이터를 불러오는 중...</p>
                </div>
            `;

            // 🔧 캐시 우회: URL에 타임스탬프 추가
            const cacheBuster = `&_=${Date.now()}`;
            const urlWithCacheBuster = CSV_URL + cacheBuster;
            
            console.log('📡 CSV URL (캐시 우회):', urlWithCacheBuster);

            // 🔧 CSV 직접 로드 후 2번째 헤더 줄 제거
            fetch(urlWithCacheBuster)
                .then(response => response.text())
                .then(csvText => {
                    console.log('✅ CSV 원본 다운로드 완료');
                    
                    // CSV 줄 분리
                    const lines = csvText.split(/\r?\n/);
                    console.log('📋 원본 전체 줄 수:', lines.length);
                    
                    // 🔧 헤더 정리: 필수 컬럼만 추출
                    if (lines.length > 0) {
                        const headerLine = lines[0];
                        const headers = headerLine.split(',');
                        
                        // 필수 컬럼 인덱스 찾기
                        const requiredColumns = ['id', 'name', 'date', 'subject', 'time', 'content'];
                        const columnIndexes = requiredColumns.map(col => 
                            headers.findIndex(h => h.trim().toLowerCase() === col)
                        );
                        
                        console.log('📋 컬럼 인덱스:', columnIndexes);
                        
                        // 필수 컬럼만 추출
                        const cleanedLines = [];
                        cleanedLines.push(requiredColumns.join(',')); // 깨끗한 헤더
                        
                        // 2번째 줄이 중복 헤더면 건너뛰기
                        let startRow = 1;
                        if (lines.length > 1 && lines[1].startsWith('id,')) {
                            console.log('⚠️ 2번째 헤더 줄 감지 - 건너뛰기');
                            startRow = 2;
                        }
                        
                        // 데이터 행 처리
                        for (let i = startRow; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;
                            
                            const cells = line.split(',');
                            
                            // 필수 컬럼 값만 추출
                            const cleanedCells = columnIndexes.map(idx => {
                                if (idx === -1) return '';
                                // 쌍따옴표로 묶인 셀 처리
                                let cell = cells[idx] || '';
                                // 쉼표가 포함된 내용은 따옴표로 묶기
                                if (cell.includes(',') || cell.includes('"')) {
                                    cell = '"' + cell.replace(/"/g, '""') + '"';
                                }
                                return cell;
                            });
                            
                            cleanedLines.push(cleanedCells.join(','));
                        }
                        
                        console.log('✅ 정리된 줄 수:', cleanedLines.length);
                        lines.length = 0;
                        lines.push(...cleanedLines);
                    }
                    
                    // 수정된 CSV 재조합
                    const cleanedCSV = lines.join('\n');
                    
                    // Papa.parse로 파싱
                    Papa.parse(cleanedCSV, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            console.log('✅ CSV 파싱 완료');
                            console.log('📊 전체 레코드 수:', results.data.length);
                            console.log('📋 첫 5개 샘플:', results.data.slice(0, 5));
                            processData(results.data);
                        },
                        error: function(error) {
                            console.error('❌ CSV 파싱 실패:', error);
                            contentContainer.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    <p>CSV 파싱 실패</p>
                                    <p style="font-size: 14px; margin-top: 10px;">${error.message}</p>
                                </div>
                            `;
                        }
                    });
                })
                .catch(error => {
                    console.error('❌ CSV 로드 실패:', error);
                    contentContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>데이터 로드 실패</p>
                            <p style="font-size: 14px; margin-top: 10px;">Google Sheets "웹에 게시"가 활성화되어 있는지 확인하세요</p>
                        </div>
                    `;
                });
        }

        function processData(records) {
            // 테스트 학생 제외 필터링
            allRecords = records.filter(record => {
                if (!record.name || record.name === 'name') return false;
                // 테스트 학생 제외
                const name = record.name.toLowerCase();
                if (name.includes('테스트') || name.includes('test')) return false;
                return true;
            });
            
            console.log('📊 CSV에서 불러온 전체 기록 수:', records.length);
            console.log('📊 필터링 후 기록 수:', allRecords.length);
            console.log('📊 첫 3개 기록 샘플:', allRecords.slice(0, 3));
            
            // 🆕 가장 최근 날짜 찾기
            const allDates = new Set();
            allRecords.forEach(record => {
                let normalizedDate = null;
                
                // 날짜 정규화: 두 가지 형식 지원
                if (record.date) {
                    if (record.date.includes('.')) {
                        // 한국 형식: 2026. 1. 6
                        const parts = record.date.split('.').map(p => p.trim());
                        if (parts.length >= 3) {
                            const year = parts[0];
                            const month = parts[1].padStart(2, '0');
                            const day = parts[2].padStart(2, '0');
                            normalizedDate = `${year}-${month}-${day}`;
                        }
                    } else if (record.date.includes('-')) {
                        // ISO 형식: 2026-01-06
                        normalizedDate = record.date.split('T')[0]; // 타임스탬프 제거
                    }
                    
                    if (normalizedDate) {
                        allDates.add(normalizedDate);
                    }
                }
            });
            
            console.log('📅 발견된 모든 날짜:', Array.from(allDates).sort());
            const latestDate = Array.from(allDates).sort().reverse()[0];
            console.log('📅 가장 최근 날짜:', latestDate);
            
            // 오늘 날짜에 데이터가 없으면 가장 최근 날짜로 설정
            const today = new Date().toISOString().split('T')[0];
            const dateFilter = document.getElementById('dateFilter');
            const todayHasData = Array.from(allDates).includes(today);
            
            if (!todayHasData && latestDate) {
                dateFilter.value = latestDate;
                console.log('⚠️ 오늘 데이터 없음 → 가장 최근 날짜로 설정:', latestDate);
            } else {
                dateFilter.value = today;
                console.log('✅ 오늘 날짜로 설정:', today);
            }
            
            // 학생별로 그룹화
            const studentMap = {};

            allRecords.forEach(record => {
                const name = record.name;

                if (!studentMap[name]) {
                    studentMap[name] = {
                        name: name,
                        totalMinutes: 0,
                        recordCount: 0,
                        subjects: {},
                        records: [],
                        dateMap: {} // 날짜별 기록
                    };
                }

                // 시간 계산 (time 열이 있으면 사용, 없으면 45분 기본)
                const timeValue = parseInt(record.time) || 45;
                studentMap[name].totalMinutes += timeValue;
                studentMap[name].recordCount++;

                // 과목별 통계
                const subject = record.subject || '기타';
                if (!studentMap[name].subjects[subject]) {
                    studentMap[name].subjects[subject] = {
                        count: 0,
                        totalMinutes: 0
                    };
                }
                studentMap[name].subjects[subject].count++;
                studentMap[name].subjects[subject].totalMinutes += timeValue;

                // 날짜 정규화 (2026. 1. 5 → 2026-01-05 또는 2026-01-06 → 2026-01-06)
                let normalizedDate = record.date;
                if (record.date) {
                    if (record.date.includes('.')) {
                        // 한국 형식: 2026. 1. 6
                        const parts = record.date.split('.').map(p => p.trim());
                        if (parts.length >= 3) {
                            const year = parts[0];
                            const month = parts[1].padStart(2, '0');
                            const day = parts[2].padStart(2, '0');
                            normalizedDate = `${year}-${month}-${day}`;
                        }
                    } else if (record.date.includes('-')) {
                        // ISO 형식: 2026-01-06 또는 2026-01-06T12:34:56Z
                        normalizedDate = record.date.split('T')[0];
                    }
                }

                // 날짜별 기록
                if (!studentMap[name].dateMap[normalizedDate]) {
                    studentMap[name].dateMap[normalizedDate] = {
                        date: normalizedDate,
                        totalMinutes: 0,
                        records: []
                    };
                }
                studentMap[name].dateMap[normalizedDate].totalMinutes += timeValue;
                studentMap[name].dateMap[normalizedDate].records.push({
                    subject: subject,
                    time: timeValue,
                    content: record.content || '학습 완료'
                });

                // 기록 저장
                studentMap[name].records.push({
                    date: normalizedDate,
                    subject: subject,
                    time: timeValue,
                    content: record.content || '학습 완료'
                });
            });

            allStudents = Object.values(studentMap);
            console.log('그룹화된 학생:', allStudents);

            // 🆕 데이터 로드 후 필터링 실행 (오늘 날짜로 자동 필터링)
            filterData();
        }

                    .map(student => {
                        // 해당 날짜의 데이터만 표시
                        const dateRecords = student.records.filter(r => r.date === selectedDate);
                        
                        const filteredStudent = {
                            ...student,
                            records: dateRecords,
                            recordCount: dateRecords.length,
                            totalMinutes: dateRecords.reduce((sum, r) => sum + r.time, 0),
                            dateMap: {
                                [selectedDate]: student.dateMap[selectedDate] || { 
                                    date: selectedDate, 
                                    totalMinutes: dateRecords.reduce((sum, r) => sum + r.time, 0),
                                    records: dateRecords.map(r => ({
                                        subject: r.subject,
                                        time: r.time,
                                        content: r.content
                                    }))
                                }
                            }
                        };

                        // 과목별 재계산
                        filteredStudent.subjects = {};
                        dateRecords.forEach(record => {
                            if (!filteredStudent.subjects[record.subject]) {
                                filteredStudent.subjects[record.subject] = {
                                    count: 0,
                                    totalMinutes: 0
                                };
                            }
                            filteredStudent.subjects[record.subject].count++;
                            filteredStudent.subjects[record.subject].totalMinutes += record.time;
                        });

                        return filteredStudent;
                    });
            }

            // 학생 이름 필터
            if (searchTerm.trim()) {
                filtered = filtered.filter(student => 
                    student.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            
            displayStats();
            displayStudents(filtered);
        }

        function filterStudents(searchTerm) {
            filterData();
        }

        // 피드백 저장
        function saveFeedback(key) {
            const textarea = document.getElementById(`feedback-text-${key}`);
            const feedbackText = textarea.value.trim();
            
            if (feedbackText) {
                feedbacks[key] = feedbackText;
                saveFeedbacks();
                
                // UI 업데이트
                document.getElementById(`feedback-display-${key}`).innerHTML = `<div class="feedback-display">${feedbackText}</div>`;
                document.getElementById(`feedback-display-${key}`).style.display = 'block';
                document.getElementById(`feedback-edit-${key}`).style.display = 'none';
                
                // 수정 버튼 추가
                const header = document.getElementById(`feedback-display-${key}`).previousElementSibling;
                if (!header.querySelector('.btn-edit')) {
                    header.innerHTML = `
                        <h5><i class="fas fa-comment-dots"></i> 교사 피드백</h5>
                        <button class="btn-small btn-edit" onclick="editFeedback('${key}')"><i class="fas fa-edit"></i> 수정</button>
                    `;
                }
                
                alert('✅ 피드백이 저장되었습니다!');
            } else {
                alert('⚠️ 피드백 내용을 입력해주세요.');
            }
        }

        // 피드백 수정
        function editFeedback(key) {
            document.getElementById(`feedback-display-${key}`).style.display = 'none';
            document.getElementById(`feedback-edit-${key}`).style.display = 'block';
        }

        // 피드백 취소
        function cancelFeedback(key) {
            const existingFeedback = feedbacks[key] || '';
            document.getElementById(`feedback-text-${key}`).value = existingFeedback;
            document.getElementById(`feedback-display-${key}`).style.display = 'block';
            document.getElementById(`feedback-edit-${key}`).style.display = 'none';
        }

        // AI 피드백 생성 및 적용
        function generateAndSetFeedback(studentName, date, feedbackKey) {
            // 학생의 해당 날짜 데이터 찾기
            const student = allStudents.find(s => s.name === studentName);
            if (!student || !student.dateMap || !student.dateMap[date]) {
                alert('⚠️ 학습 데이터를 찾을 수 없습니다.');
                return;
            }

            const dateData = student.dateMap[date];
            const aiFeedback = generateAIFeedback(studentName, date, dateData);
            
            // textarea에 자동 생성된 피드백 입력
            document.getElementById(`feedback-text-${feedbackKey}`).value = aiFeedback;
            
            // 안내 메시지
            alert('🤖 AI 피드백이 생성되었습니다!\n\n수정 후 [저장] 버튼을 눌러주세요.');
        }
    </script>
</body>
