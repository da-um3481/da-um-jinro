<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 대시보드 - 학생 학습 기록</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #4ade80;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .loading {
            text-align: center;
            padding: 4rem;
        }

        .loading i {
            font-size: 3rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .date-summary {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .date-summary h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .date-stat-item {
            text-align: center;
        }

        .date-stat-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .date-stat-item .label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .student-list {
            display: grid;
            gap: 1.5rem;
        }

        .student-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .student-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.2);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .student-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .student-info .meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .total-time {
            text-align: right;
        }

        .total-time .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .total-time .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .subject-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
        }

        .subject-item .subject-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .subject-item .subject-stats {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .expand-btn {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .expand-btn:hover {
            background: var(--primary);
            color: white;
        }

        .records-detail {
            margin-top: 1rem;
            display: none;
        }

        .records-detail.show {
            display: block;
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .records-table th {
            text-align: left;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .records-table td {
            padding: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
        }

        .empty-state i {
            font-size: 4rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> 교사 대시보드</h1>
            <p>학생 학습 기록 - 실시간 Google Sheets 연동</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 학생 이름으로 검색...">
            </div>
            <div class="search-box">
                <input type="date" id="dateFilter" min="2026-01-05" max="2026-01-30">
            </div>
            <button class="btn" onclick="loadData()">
                <i class="fas fa-sync-alt"></i>
                새로고침
            </button>
        </div>

        <div id="statsContainer"></div>
        <div id="contentContainer"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6qWy7j413iykH1VxStxh-Jer0w721-a2fC0Vnbf_JQfs8hV8gRW6lBXluawBtQd80YkPPRyKItEGN/pub?gid=1158249397&single=true&output=csv';
        
        let allStudents = [];
        let allRecords = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterData();
            });
            document.getElementById('dateFilter').addEventListener('change', (e) => {
                filterData();
            });
        });

        function loadData() {
            const contentContainer = document.getElementById('contentContainer');
            contentContainer.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p style="margin-top: 1rem; color: var(--text-muted);">Google Sheets에서 데이터를 불러오는 중...</p>
                </div>
            `;

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    console.log('CSV 데이터:', results.data);
                    processData(results.data);
                },
                error: function(error) {
                    console.error('CSV 로드 실패:', error);
                    contentContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>데이터 로드 실패</p>
                        </div>
                    `;
                }
            });
        }

        function processData(records) {
            // 테스트 학생 제외 필터링
            allRecords = records.filter(record => {
                if (!record.name || record.name === 'name') return false;
                // 테스트 학생 제외
                const name = record.name.toLowerCase();
                if (name.includes('테스트') || name.includes('test')) return false;
                return true;
            });
            
            // 학생별로 그룹화
            const studentMap = {};

            allRecords.forEach(record => {
                const name = record.name;

                if (!studentMap[name]) {
                    studentMap[name] = {
                        name: name,
                        totalMinutes: 0,
                        recordCount: 0,
                        subjects: {},
                        records: [],
                        dateMap: {} // 날짜별 기록
                    };
                }

                // 시간 계산 (time 열이 있으면 사용, 없으면 45분 기본)
                const timeValue = parseInt(record.time) || 45;
                studentMap[name].totalMinutes += timeValue;
                studentMap[name].recordCount++;

                // 과목별 통계
                const subject = record.subject || '기타';
                if (!studentMap[name].subjects[subject]) {
                    studentMap[name].subjects[subject] = {
                        count: 0,
                        totalMinutes: 0
                    };
                }
                studentMap[name].subjects[subject].count++;
                studentMap[name].subjects[subject].totalMinutes += timeValue;

                // 날짜 정규화 (2026. 1. 5 → 2026-01-05)
                let normalizedDate = record.date;
                if (record.date && record.date.includes('.')) {
                    const parts = record.date.split('.').map(p => p.trim());
                    if (parts.length >= 3) {
                        const year = parts[0];
                        const month = parts[1].padStart(2, '0');
                        const day = parts[2].padStart(2, '0');
                        normalizedDate = `${year}-${month}-${day}`;
                    }
                }

                // 날짜별 기록
                if (!studentMap[name].dateMap[normalizedDate]) {
                    studentMap[name].dateMap[normalizedDate] = {
                        date: normalizedDate,
                        totalMinutes: 0,
                        records: []
                    };
                }
                studentMap[name].dateMap[normalizedDate].totalMinutes += timeValue;
                studentMap[name].dateMap[normalizedDate].records.push({
                    subject: subject,
                    time: timeValue,
                    content: record.content || '학습 완료'
                });

                // 기록 저장
                studentMap[name].records.push({
                    date: normalizedDate,
                    subject: subject,
                    time: timeValue,
                    content: record.content || '학습 완료'
                });
            });

            allStudents = Object.values(studentMap);
            console.log('그룹화된 학생:', allStudents);

            displayStats();
            displayStudents(allStudents);
        }

        function displayStats() {
            const selectedDate = document.getElementById('dateFilter').value;
            
            if (selectedDate) {
                // 특정 날짜 선택 시 해당 날짜 통계만 표시
                const dateStudents = allStudents.filter(student => 
                    student.records.some(r => r.date === selectedDate)
                );
                
                const dateRecords = [];
                dateStudents.forEach(student => {
                    dateRecords.push(...student.records.filter(r => r.date === selectedDate));
                });
                
                const totalMinutes = dateRecords.reduce((sum, r) => sum + r.time, 0);
                const totalHours = Math.floor(totalMinutes / 60);
                
                document.getElementById('statsContainer').innerHTML = `
                    <div class="date-summary">
                        <h3>
                            <i class="fas fa-calendar-day"></i>
                            ${selectedDate} 학습 현황
                        </h3>
                        <div class="date-stats">
                            <div class="date-stat-item">
                                <div class="value">${dateStudents.length}</div>
                                <div class="label">학습한 학생</div>
                            </div>
                            <div class="date-stat-item">
                                <div class="value">${dateRecords.length}</div>
                                <div class="label">총 학습 세션</div>
                            </div>
                            <div class="date-stat-item">
                                <div class="value">${totalHours}시간 ${totalMinutes % 60}분</div>
                                <div class="label">총 학습 시간</div>
                            </div>
                            <div class="date-stat-item">
                                <div class="value">${dateStudents.length > 0 ? Math.round(totalMinutes / dateStudents.length) : 0}분</div>
                                <div class="label">학생당 평균</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // 전체 통계
                const totalStudents = allStudents.length;
                const totalRecords = allStudents.reduce((sum, s) => sum + s.recordCount, 0);
                const totalMinutes = allStudents.reduce((sum, s) => sum + s.totalMinutes, 0);
                const totalHours = Math.floor(totalMinutes / 60);
                const avgMinutes = totalStudents > 0 ? Math.round(totalMinutes / totalStudents) : 0;

                // 학습한 날짜 목록
                const uniqueDates = new Set();
                allStudents.forEach(student => {
                    student.records.forEach(record => {
                        if (record.date) uniqueDates.add(record.date);
                    });
                });
                const totalDays = uniqueDates.size;

                document.getElementById('statsContainer').innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="icon">👥</div>
                            <div class="value">${totalStudents}</div>
                            <div class="label">총 학생 수</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📚</div>
                            <div class="value">${totalRecords}</div>
                            <div class="label">총 학습 기록</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📅</div>
                            <div class="value">${totalDays}</div>
                            <div class="label">학습한 날짜</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">⏱️</div>
                            <div class="value">${totalHours}시간</div>
                            <div class="label">총 학습 시간</div>
                        </div>
                    </div>
                `;
            }
        }

        function displayStudents(students) {
            const contentContainer = document.getElementById('contentContainer');
            
            if (students.length === 0) {
                contentContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>검색 결과가 없습니다</p>
                    </div>
                `;
                return;
            }

            const html = students.map((student, index) => {
                const hours = Math.floor(student.totalMinutes / 60);
                const minutes = student.totalMinutes % 60;

                const subjectsHtml = Object.keys(student.subjects).map(subject => {
                    const stats = student.subjects[subject];
                    const subHours = Math.floor(stats.totalMinutes / 60);
                    const subMinutes = stats.totalMinutes % 60;
                    
                    return `
                        <div class="subject-item">
                            <div class="subject-name">${subject}</div>
                            <div class="subject-stats">
                                ${stats.count}회 | ${subHours > 0 ? subHours + '시간 ' : ''}${subMinutes}분
                            </div>
                        </div>
                    `;
                }).join('');

                const recordsHtml = student.records.map(record => {
                    const recordHours = Math.floor(record.time / 60);
                    const recordMinutes = record.time % 60;
                    return `
                        <tr>
                            <td>${record.date}</td>
                            <td>${record.subject}</td>
                            <td>${recordHours > 0 ? recordHours + '시간 ' : ''}${recordMinutes}분</td>
                            <td>${record.content}</td>
                        </tr>
                    `;
                }).join('');

                // 날짜별 기록 HTML
                const dateRecordsHtml = Object.values(student.dateMap || {})
                    .sort((a, b) => new Date(b.date) - new Date(a.date)) // 최신순
                    .map(dateData => {
                        const dateHours = Math.floor(dateData.totalMinutes / 60);
                        const dateMinutes = dateData.totalMinutes % 60;
                        
                        const dateSubRecords = dateData.records.map(r => {
                            const h = Math.floor(r.time / 60);
                            const m = r.time % 60;
                            return `
                                <div style="padding: 0.5rem; background: rgba(255,255,255,0.03); border-radius: 5px; margin-top: 0.5rem;">
                                    <strong>${r.subject}</strong> | ${h > 0 ? h + '시간 ' : ''}${m}분 | ${r.content}
                                </div>
                            `;
                        }).join('');

                        return `
                            <div style="border-left: 3px solid var(--primary); padding-left: 1rem; margin-bottom: 1rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                    <strong style="font-size: 1.1rem;">${dateData.date}</strong>
                                    <span style="color: var(--accent); font-weight: 700;">
                                        ${dateHours > 0 ? dateHours + '시간 ' : ''}${dateMinutes}분
                                    </span>
                                </div>
                                ${dateSubRecords}
                            </div>
                        `;
                    }).join('');

                return `
                    <div class="student-card">
                        <div class="student-header">
                            <div class="student-info">
                                <h3>
                                    <i class="fas fa-user-graduate" style="color: var(--primary);"></i>
                                    ${student.name}
                                </h3>
                                <div class="meta">총 ${student.recordCount}개의 학습 기록</div>
                            </div>
                            <div class="total-time">
                                <div class="value">${hours > 0 ? hours + '시간 ' : ''}${minutes}분</div>
                                <div class="label">총 학습 시간</div>
                            </div>
                        </div>
                        
                        <div class="subjects">
                            ${subjectsHtml}
                        </div>

                        <button class="expand-btn" onclick="toggleRecords(${index})">
                            <i class="fas fa-calendar-alt"></i> 날짜별 학습 기록 보기
                        </button>

                        <div class="records-detail" id="records-${index}">
                            <h4 style="margin-bottom: 1rem; color: var(--primary);">
                                <i class="fas fa-calendar-week"></i> 날짜별 학습 기록
                            </h4>
                            ${dateRecordsHtml || '<p style="color: var(--text-muted);">학습 기록이 없습니다.</p>'}
                        </div>
                    </div>
                `;
            }).join('');

            contentContainer.innerHTML = `<div class="student-list">${html}</div>`;
        }

        function toggleRecords(index) {
            const element = document.getElementById(`records-${index}`);
            element.classList.toggle('show');
        }

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value;
            const selectedDate = document.getElementById('dateFilter').value;

            let filtered = allStudents;

            // 날짜 필터 (우선 적용)
            if (selectedDate) {
                filtered = filtered
                    .filter(student => 
                        // 해당 날짜에 학습한 학생만 포함
                        student.records.some(r => r.date === selectedDate)
                    )
                    .map(student => {
                        // 해당 날짜의 데이터만 표시
                        const dateRecords = student.records.filter(r => r.date === selectedDate);
                        
                        const filteredStudent = {
                            ...student,
                            records: dateRecords,
                            recordCount: dateRecords.length,
                            totalMinutes: dateRecords.reduce((sum, r) => sum + r.time, 0),
                            dateMap: {
                                [selectedDate]: student.dateMap[selectedDate] || { 
                                    date: selectedDate, 
                                    totalMinutes: dateRecords.reduce((sum, r) => sum + r.time, 0),
                                    records: dateRecords.map(r => ({
                                        subject: r.subject,
                                        time: r.time,
                                        content: r.content
                                    }))
                                }
                            }
                        };

                        // 과목별 재계산
                        filteredStudent.subjects = {};
                        dateRecords.forEach(record => {
                            if (!filteredStudent.subjects[record.subject]) {
                                filteredStudent.subjects[record.subject] = {
                                    count: 0,
                                    totalMinutes: 0
                                };
                            }
                            filteredStudent.subjects[record.subject].count++;
                            filteredStudent.subjects[record.subject].totalMinutes += record.time;
                        });

                        return filteredStudent;
                    });
            }

            // 학생 이름 필터
            if (searchTerm.trim()) {
                filtered = filtered.filter(student => 
                    student.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            
            displayStats();
            displayStudents(filtered);
        }

        function filterStudents(searchTerm) {
            filterData();
        }
    </script>
</body>
</html>
