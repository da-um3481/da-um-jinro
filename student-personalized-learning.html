<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 수준별 맞춤 학습 - DA.UM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans KR', sans-serif; }
        body { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #0369a1 100%); min-height: 100vh; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .level-badge { display: inline-flex; align-items: center; padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 700; }
        .level-basic { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
        .level-intermediate { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; }
        .level-advanced { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        .level-top { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; }
    </style>
</head>
<body>
    <header class="glass-effect shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-6 py-5">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://www.genspark.ai/api/files/s/3voQr3x8" alt="DA.UM Logo" class="w-14 h-14 rounded-xl shadow-lg">
                    <div>
                        <h1 class="text-2xl font-black bg-gradient-to-r from-cyan-600 to-blue-600 bg-clip-text text-transparent">수준별 맞춤 학습</h1>
                        <p class="text-xs text-gray-600 font-medium">🎯 나만을 위한 맞춤형 교재와 강의</p>
                    </div>
                </div>
                <nav class="flex space-x-2">
                    <a href="teacher-dashboard.html" class="px-4 py-2.5 text-gray-700 hover:bg-gray-100 rounded-xl transition font-medium"><i class="fas fa-chalkboard-teacher mr-2"></i>관리 대시보드</a>
                    <a href="winter-index.html" class="px-4 py-2.5 text-gray-700 hover:bg-gray-100 rounded-xl transition font-medium"><i class="fas fa-home mr-2"></i>학습 대시보드</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        <!-- 학생 선택 -->
        <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-black text-gray-800 mb-2"><i class="fas fa-user-graduate text-indigo-600 mr-2"></i>학생 선택</h2>
                    <p class="text-sm text-gray-600">학생을 선택하면 해당 학생의 진단 결과에 따른 맞춤 학습 자료가 표시됩니다</p>
                </div>
                <select id="studentSelect" onchange="loadPersonalizedLearning()" class="px-6 py-3 border-2 border-indigo-300 rounded-xl text-lg font-bold focus:outline-none focus:border-indigo-600">
                    <option value="">학생을 선택하세요</option>
                </select>
            </div>
        </div>

        <!-- 학생 정보 및 진단 결과 -->
        <div id="studentInfo" class="hidden">
            <!-- 학생 기본 정보 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="text-3xl font-black text-gray-800 mb-2" id="studentName"></h3>
                        <p class="text-gray-600 font-medium" id="studentDetails"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-600 mb-2">학습 수준</p>
                        <div id="studentLevel" class="level-badge"></div>
                    </div>
                </div>
            </div>

            <!-- 진단 평가 점수 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <h3 class="text-2xl font-black text-gray-800 mb-6"><i class="fas fa-chart-bar text-blue-500 mr-2"></i>EBS AI 진단 평가 결과</h3>
                <div class="grid grid-cols-5 gap-4" id="diagnosticScores">
                </div>
            </div>

            <!-- 과목별 맞춤 교재 및 강의 -->
            <div id="subjectMaterials">
                <!-- 수학 -->
                <div class="subject-section mb-6">
                    <div class="glass-effect rounded-2xl p-6 shadow-xl">
                        <h3 class="text-2xl font-black text-gray-800 mb-6">
                            <i class="fas fa-calculator text-blue-500 mr-2"></i>수학
                            <span class="ml-3 text-lg font-medium text-gray-600" id="mathLevel"></span>
                        </h3>
                        <div class="grid grid-cols-2 gap-6">
                            <!-- 추천 교재 -->
                            <div class="bg-blue-50 rounded-xl p-5 border-2 border-blue-200">
                                <h4 class="text-lg font-bold text-blue-800 mb-4"><i class="fas fa-book mr-2"></i>추천 교재</h4>
                                <div id="mathBooks" class="space-y-3"></div>
                            </div>
                            <!-- EBS 강의 -->
                            <div class="bg-green-50 rounded-xl p-5 border-2 border-green-200">
                                <h4 class="text-lg font-bold text-green-800 mb-4"><i class="fas fa-video mr-2"></i>EBS 강의</h4>
                                <div id="mathLectures" class="space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 영어 -->
                <div class="subject-section mb-6">
                    <div class="glass-effect rounded-2xl p-6 shadow-xl">
                        <h3 class="text-2xl font-black text-gray-800 mb-6">
                            <i class="fas fa-language text-red-500 mr-2"></i>영어
                            <span class="ml-3 text-lg font-medium text-gray-600" id="englishLevel"></span>
                        </h3>
                        <div class="grid grid-cols-2 gap-6">
                            <div class="bg-red-50 rounded-xl p-5 border-2 border-red-200">
                                <h4 class="text-lg font-bold text-red-800 mb-4"><i class="fas fa-book mr-2"></i>추천 교재</h4>
                                <div id="englishBooks" class="space-y-3"></div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-5 border-2 border-green-200">
                                <h4 class="text-lg font-bold text-green-800 mb-4"><i class="fas fa-video mr-2"></i>EBS 강의</h4>
                                <div id="englishLectures" class="space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 국어 -->
                <div class="subject-section mb-6">
                    <div class="glass-effect rounded-2xl p-6 shadow-xl">
                        <h3 class="text-2xl font-black text-gray-800 mb-6">
                            <i class="fas fa-book-reader text-purple-500 mr-2"></i>국어
                            <span class="ml-3 text-lg font-medium text-gray-600" id="koreanLevel"></span>
                        </h3>
                        <div class="grid grid-cols-2 gap-6">
                            <div class="bg-purple-50 rounded-xl p-5 border-2 border-purple-200">
                                <h4 class="text-lg font-bold text-purple-800 mb-4"><i class="fas fa-book mr-2"></i>추천 교재</h4>
                                <div id="koreanBooks" class="space-y-3"></div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-5 border-2 border-green-200">
                                <h4 class="text-lg font-bold text-green-800 mb-4"><i class="fas fa-video mr-2"></i>EBS 강의</h4>
                                <div id="koreanLectures" class="space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 과학 -->
                <div class="subject-section mb-6">
                    <div class="glass-effect rounded-2xl p-6 shadow-xl">
                        <h3 class="text-2xl font-black text-gray-800 mb-6">
                            <i class="fas fa-flask text-teal-500 mr-2"></i>과학
                            <span class="ml-3 text-lg font-medium text-gray-600" id="scienceLevel"></span>
                        </h3>
                        <div class="grid grid-cols-2 gap-6">
                            <div class="bg-teal-50 rounded-xl p-5 border-2 border-teal-200">
                                <h4 class="text-lg font-bold text-teal-800 mb-4"><i class="fas fa-book mr-2"></i>추천 교재</h4>
                                <div id="scienceBooks" class="space-y-3"></div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-5 border-2 border-green-200">
                                <h4 class="text-lg font-bold text-green-800 mb-4"><i class="fas fa-video mr-2"></i>EBS 강의</h4>
                                <div id="scienceLectures" class="space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 사회 -->
                <div class="subject-section mb-6">
                    <div class="glass-effect rounded-2xl p-6 shadow-xl">
                        <h3 class="text-2xl font-black text-gray-800 mb-6">
                            <i class="fas fa-globe-asia text-amber-500 mr-2"></i>사회
                            <span class="ml-3 text-lg font-medium text-gray-600" id="socialLevel"></span>
                        </h3>
                        <div class="grid grid-cols-2 gap-6">
                            <div class="bg-amber-50 rounded-xl p-5 border-2 border-amber-200">
                                <h4 class="text-lg font-bold text-amber-800 mb-4"><i class="fas fa-book mr-2"></i>추천 교재</h4>
                                <div id="socialBooks" class="space-y-3"></div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-5 border-2 border-green-200">
                                <h4 class="text-lg font-bold text-green-800 mb-4"><i class="fas fa-video mr-2"></i>EBS 강의</h4>
                                <div id="socialLectures" class="space-y-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 맞춤형 주간 학습 플랜 -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-6">
                <h3 class="text-2xl font-black text-gray-800 mb-6"><i class="fas fa-calendar-alt text-indigo-500 mr-2"></i>맞춤형 주간 학습 플랜</h3>
                <div class="bg-indigo-50 rounded-xl p-5 border-2 border-indigo-200">
                    <div id="weeklyPlan"></div>
                    <button onclick="generatePersonalizedSchedule()" class="mt-6 w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all">
                        <i class="fas fa-magic mr-2"></i>맞춤형 스케줄 자동 생성
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STUDENTS_KEY = 'daum_students';
        const SCHOOLS_KEY = 'daum_schools';

        // 수준별 교재 데이터베이스
        const MATERIALS_DATABASE = {
            math: {
                basic: {
                    books: ['체크체크 수학', '개념쎈 라이트', '기초탄탄 개념', '개념+유형 기초탄탄편'],
                    lectures: ['EBS 중학 프리미엄 수학 - 기본', 'EBS 만점왕 수학', 'EBS AI 코스웨어 기초']
                },
                intermediate: {
                    books: ['개념원리', '수학의 정석', '일등급 수학', '쎈'],
                    lectures: ['EBS 중학 프리미엄 수학 - 실력', 'EBS 올림포스', 'EBS AI 코스웨어 표준']
                },
                advanced: {
                    books: ['일품', '블랙라벨', 'RPM', '최고득점'],
                    lectures: ['EBS 수능특강 수학', 'EBS 수능완성', 'EBS AI 코스웨어 심화']
                }
            },
            english: {
                basic: {
                    books: ['기초 탄탄 문법', '중학 영문법 핵심', '영문법 완전정복', 'Grammar Inside'],
                    lectures: ['EBS 중학 프리미엄 영어 - 기본', 'EBS 만점왕 영어', 'EBS AI 코스웨어 기초']
                },
                intermediate: {
                    books: ['자이스토리 영어독해', '수능 영어 독해 연습', '리딩튜터', '영어 듣기 모의고사'],
                    lectures: ['EBS 중학 프리미엄 영어 - 실력', 'EBS 올림포스 영어', 'EBS AI 코스웨어 표준']
                },
                advanced: {
                    books: ['리딩파워', '수능특강 영어', 'EBS 수능완성', 'MAPO 영어독해'],
                    lectures: ['EBS 수능특강 영어', 'EBS 수능완성 영어', 'EBS AI 코스웨어 심화']
                }
            },
            korean: {
                basic: {
                    books: ['기초부터 차근차근 국어', '개념씨 국어', '중학 국어 비문학', '국어 문법 기본'],
                    lectures: ['EBS 중학 국어 - 기본', 'EBS 만점왕 국어', 'EBS AI 코스웨어 기초']
                },
                intermediate: {
                    books: ['자이스토리 국어', '올림포스 국어', '고등 국어 독해', '국어 문법 총정리'],
                    lectures: ['EBS 올림포스 국어', 'EBS 고교특강 국어', 'EBS AI 코스웨어 표준']
                },
                advanced: {
                    books: ['수능특강 국어', '수능완성 국어', 'MAPO 국어', '국어 기출 분석'],
                    lectures: ['EBS 수능특강 국어', 'EBS 수능완성 국어', 'EBS AI 코스웨어 심화']
                }
            },
            science: {
                basic: {
                    books: ['중학 과학 개념', '완자 과학', '체크체크 과학', '개념쎈 과학'],
                    lectures: ['EBS 중학 프리미엄 과학 - 기본', 'EBS 만점왕 과학', 'EBS AI 코스웨어 기초']
                },
                intermediate: {
                    books: ['오투 과학', '자이스토리 과학', '완자 고등 과학', '올림포스 과학'],
                    lectures: ['EBS 중학 프리미엄 과학 - 실력', 'EBS 올림포스 과학', 'EBS AI 코스웨어 표준']
                },
                advanced: {
                    books: ['수능특강 통합과학', '수능완성 과학', '블랙라벨 과학', 'RPM 과학'],
                    lectures: ['EBS 수능특강 과학', 'EBS 수능완성 과학', 'EBS AI 코스웨어 심화']
                }
            },
            social: {
                basic: {
                    books: ['중학 사회 개념', '완자 사회', '체크체크 사회', '개념쎈 사회'],
                    lectures: ['EBS 중학 프리미엄 사회 - 기본', 'EBS 만점왕 사회', 'EBS AI 코스웨어 기초']
                },
                intermediate: {
                    books: ['오투 사회', '자이스토리 사회', '올림포스 사회', '고등 사회탐구'],
                    lectures: ['EBS 중학 프리미엄 사회 - 실력', 'EBS 올림포스 사회', 'EBS AI 코스웨어 표준']
                },
                advanced: {
                    books: ['수능특강 사회탐구', '수능완성 사회', '사회탐구 기출 분석', 'MAPO 사회'],
                    lectures: ['EBS 수능특강 사회탐구', 'EBS 수능완성 사회', 'EBS AI 코스웨어 심화']
                }
            }
        };

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadStudentOptions();
        });

        function loadStudents() {
            const data = localStorage.getItem(STUDENTS_KEY);
            return data ? JSON.parse(data) : [];
        }

        function loadStudentOptions() {
            const students = loadStudents();
            const select = document.getElementById('studentSelect');
            select.innerHTML = '<option value="">학생을 선택하세요</option>';
            
            students.forEach(student => {
                const option = document.createElement('option');
                option.value = student.id;
                option.textContent = `${student.name} (${getGradeText(student.grade)})`;
                select.appendChild(option);
            });
        }

        function getGradeText(grade) {
            const gradeMap = {1: '중1', 2: '중2', 3: '중3', 4: '고1', 5: '고2', 6: '고3'};
            return gradeMap[grade] || grade;
        }

        function loadPersonalizedLearning() {
            const studentId = document.getElementById('studentSelect').value;
            if (!studentId) {
                document.getElementById('studentInfo').classList.add('hidden');
                return;
            }

            const students = loadStudents();
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            // 학생 정보 표시
            document.getElementById('studentInfo').classList.remove('hidden');
            document.getElementById('studentName').textContent = student.name;
            document.getElementById('studentDetails').textContent = 
                `${getGradeText(student.grade)} | ${student.schoolName || '학교 정보 없음'} | 평균: ${student.average || 0}점`;

            // 학습 수준 표시
            const levelBadge = document.getElementById('studentLevel');
            levelBadge.textContent = student.level || '미분류';
            levelBadge.className = 'level-badge ' + getLevelClass(student.average);

            // 진단 평가 점수 표시
            displayDiagnosticScores(student);

            // 과목별 맞춤 교재 및 강의 표시
            displaySubjectMaterials(student);

            // 주간 학습 플랜 생성
            displayWeeklyPlan(student);
        }

        function getLevelClass(average) {
            if (average >= 85) return 'level-top';
            if (average >= 70) return 'level-advanced';
            if (average >= 50) return 'level-intermediate';
            return 'level-basic';
        }

        function displayDiagnosticScores(student) {
            const container = document.getElementById('diagnosticScores');
            const subjects = [
                {name: '국어', score: student.koreanScore || 0, icon: 'book-reader', color: 'purple'},
                {name: '영어', score: student.englishScore || 0, icon: 'language', color: 'red'},
                {name: '수학', score: student.mathScore || 0, icon: 'calculator', color: 'blue'},
                {name: '과학', score: student.scienceScore || 0, icon: 'flask', color: 'teal'},
                {name: '사회', score: student.socialScore || 0, icon: 'globe-asia', color: 'amber'}
            ];

            container.innerHTML = subjects.map(subj => `
                <div class="bg-${subj.color}-50 rounded-xl p-5 border-2 border-${subj.color}-200 text-center">
                    <i class="fas fa-${subj.icon} text-3xl text-${subj.color}-600 mb-3"></i>
                    <p class="text-sm font-bold text-gray-700 mb-2">${subj.name}</p>
                    <p class="text-4xl font-black text-${subj.color}-600">${subj.score}</p>
                    <p class="text-xs text-gray-600 mt-1">점</p>
                </div>
            `).join('');
        }

        function displaySubjectMaterials(student) {
            const subjects = ['math', 'english', 'korean', 'science', 'social'];
            const subjectNames = {math: '수학', english: '영어', korean: '국어', science: '과학', social: '사회'};
            
            subjects.forEach(subject => {
                const score = student[`${subject}Score`] || 0;
                const level = getSubjectLevel(score);
                const materials = MATERIALS_DATABASE[subject][level];

                // 수준 표시
                const levelText = level === 'basic' ? '🟢 기초' : level === 'intermediate' ? '🔵 중급' : '🔴 심화';
                document.getElementById(`${subject}Level`).textContent = `${score}점 - ${levelText}`;

                // 교재 표시
                const booksContainer = document.getElementById(`${subject}Books`);
                booksContainer.innerHTML = materials.books.map((book, idx) => `
                    <div class="flex items-center space-x-3 p-3 bg-white rounded-lg shadow hover:shadow-md transition">
                        <span class="flex-shrink-0 w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-full flex items-center justify-center font-bold">${idx + 1}</span>
                        <span class="font-medium text-gray-800">${book}</span>
                    </div>
                `).join('');

                // 강의 표시
                const lecturesContainer = document.getElementById(`${subject}Lectures`);
                lecturesContainer.innerHTML = materials.lectures.map((lecture, idx) => `
                    <div class="flex items-center space-x-3 p-3 bg-white rounded-lg shadow hover:shadow-md transition cursor-pointer" onclick="openEBSLecture('${lecture}')">
                        <span class="flex-shrink-0 w-8 h-8 bg-gradient-to-br from-green-500 to-teal-600 text-white rounded-full flex items-center justify-center font-bold">${idx + 1}</span>
                        <span class="font-medium text-gray-800 flex-1">${lecture}</span>
                        <i class="fas fa-external-link-alt text-green-600"></i>
                    </div>
                `).join('');
            });
        }

        function displayWeeklyPlan(student) {
            const weakSubjects = getWeakSubjects(student);
            const container = document.getElementById('weeklyPlan');
            
            container.innerHTML = `
                <h4 class="text-lg font-bold text-indigo-800 mb-4">
                    <i class="fas fa-bullseye mr-2"></i>취약 과목 집중 학습 전략
                </h4>
                <div class="space-y-3 mb-6">
                    ${weakSubjects.map(subj => `
                        <div class="flex items-center justify-between p-4 bg-white rounded-lg shadow">
                            <div class="flex items-center space-x-3">
                                <i class="fas fa-exclamation-triangle text-red-500 text-xl"></i>
                                <div>
                                    <p class="font-bold text-gray-800">${subj.name}</p>
                                    <p class="text-sm text-gray-600">현재 ${subj.score}점 → 목표: ${subj.target}점</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-2xl font-black text-indigo-600">${subj.hours}시간</p>
                                <p class="text-xs text-gray-600">주당 학습</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="bg-white rounded-lg p-4">
                    <p class="text-sm text-gray-700 leading-relaxed">
                        <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                        <strong>${student.name}</strong> 학생은 <strong class="text-red-600">${weakSubjects[0]?.name}</strong>을(를) 우선적으로 학습하면 
                        전체 평균을 <strong class="text-green-600">${calculatePotentialGrowth(student)}점</strong> 향상시킬 수 있습니다!
                    </p>
                </div>
            `;
        }

        function getWeakSubjects(student) {
            const subjects = [
                {name: '국어', score: student.koreanScore || 0, key: 'korean'},
                {name: '영어', score: student.englishScore || 0, key: 'english'},
                {name: '수학', score: student.mathScore || 0, key: 'math'},
                {name: '과학', score: student.scienceScore || 0, key: 'science'},
                {name: '사회', score: student.socialScore || 0, key: 'social'}
            ];

            // 점수가 낮은 순으로 정렬
            const sorted = subjects.filter(s => s.score > 0).sort((a, b) => a.score - b.score);
            
            return sorted.slice(0, 3).map(subj => ({
                ...subj,
                target: Math.min(100, subj.score + 20),
                hours: subj.score < 50 ? 8 : subj.score < 70 ? 6 : 4
            }));
        }

        function calculatePotentialGrowth(student) {
            const scores = [
                student.koreanScore || 0,
                student.englishScore || 0,
                student.mathScore || 0,
                student.scienceScore || 0,
                student.socialScore || 0
            ].filter(s => s > 0);

            const minScore = Math.min(...scores);
            const improvement = Math.min(20, 85 - minScore);
            return (improvement * 0.2).toFixed(1);
        }

        function generatePersonalizedSchedule() {
            const studentId = document.getElementById('studentSelect').value;
            if (!studentId) {
                alert('학생을 먼저 선택해주세요.');
                return;
            }

            const students = loadStudents();
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            // 맞춤형 스케줄 생성
            const schedule = createPersonalizedSchedule(student);
            
            // LocalStorage에 저장
            localStorage.setItem(`personalized_schedule_${student.name}`, JSON.stringify(schedule));

            alert(`✅ ${student.name} 학생의 맞춤형 주간 스케줄이 생성되었습니다!\n\n📅 주간 일정 페이지에서 확인하실 수 있습니다.`);
            
            // 주간 일정 페이지로 이동할지 확인
            if (confirm('주간 일정 페이지로 이동하시겠습니까?')) {
                window.location.href = 'winter-weekly-schedule.html';
            }
        }

        function createPersonalizedSchedule(student) {
            const weakSubjects = getWeakSubjects(student);
            const schedule = {
                studentName: student.name,
                createdAt: new Date().toISOString(),
                totalHours: 25,
                weeklyPlan: {}
            };

            const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const dayLabels = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];

            days.forEach((day, index) => {
                const isWeekend = day === 'saturday' || day === 'sunday';
                const hours = isWeekend ? 5 : 3;
                
                // 취약 과목 우선 배치
                const subjects = [];
                if (isWeekend) {
                    subjects.push(
                        {name: weakSubjects[0]?.name || '수학', hours: 2},
                        {name: weakSubjects[1]?.name || '영어', hours: 1.5},
                        {name: weakSubjects[2]?.name || '국어', hours: 1},
                        {name: '복습', hours: 0.5}
                    );
                } else {
                    subjects.push(
                        {name: weakSubjects[0]?.name || '수학', hours: 1.5},
                        {name: weakSubjects[1]?.name || '영어', hours: 1},
                        {name: weakSubjects[2]?.name || '국어', hours: 0.5}
                    );
                }

                schedule.weeklyPlan[day] = {
                    label: dayLabels[index],
                    totalHours: hours,
                    subjects: subjects
                };
            });

            return schedule;
        }
