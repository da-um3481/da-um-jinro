<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 프로그램 - 나도 공부 잘하는 아이 될래요!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #E8D5F2 0%, #D5E5F7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        
        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .info-section {
            padding: 40px;
            background: linear-gradient(135deg, #E8D5F2 0%, #D5E5F7 100%);
            text-align: center;
        }
        
        .info-section h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #7B1FA2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            font-size: 20px;
            color: #E91E63;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .benefit-item {
            background: white;
            padding: 18px;
            border-radius: 15px;
            font-size: 16px;
            color: #424242;
            box-shadow: 0 3px 10px rgba(123, 31, 162, 0.15);
            font-weight: bold;
        }
        
        .benefit-item.special {
            background: linear-gradient(135deg, #FFF9C4 0%, #FFF59D 100%);
            border: 2px solid #FBC02D;
        }
        
        .apply-box {
            background: linear-gradient(135deg, #FFF59D 0%, #FFF176 100%);
            color: #E65100;
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 193, 7, 0.4);
            border: 3px solid #FBC02D;
        }
        
        .contact {
            font-size: 18px;
            margin-top: 20px;
            color: #424242;
        }
        
        .contact p {
            margin: 8px 0;
        }
        
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #7B1FA2 0%, #9C27B0 100%);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(123, 31, 162, 0.3);
        }
        
        .download-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(123, 31, 162, 0.4);
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                max-width: none;
            }
            .info-section {
                display: none;
            }
        }
        
        @media (max-width: 600px) {
            .benefits-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.genspark.ai/api/files/s/FXAgi01L" alt="근화여중 겨울방학 프로그램 모집 포스터" class="poster-image">
        
        <div class="info-section">
            <h2>🌟 이번 겨울, 나를 바꿀 기회!</h2>
            <div class="subtitle">나도 공부 잘하는 아이 될래요! ✨</div>
            
            <div class="benefits-grid">
                <div class="benefit-item">✨ 성적이 쑥쑥!</div>
                <div class="benefit-item">🎮 친구들이랑 재미있게!</div>
                <div class="benefit-item">🎁 공부 습관 완성!</div>
                <div class="benefit-item">💪 자신감 UP!</div>
                <div class="benefit-item">🏆 내신 완벽 대비!</div>
                <div class="benefit-item">🎯 내 꿈 찾기!</div>
                <div class="benefit-item">📱 스마트 학습!</div>
                <div class="benefit-item special">📚 혼자 공부해도<br>어떤 공부할지 알려줘서 좋아!</div>
            </div>
            
            <div class="apply-box">
                ⭐ 신청은 담임쌤 or 진로쌤께! ⭐
            </div>
            
            <div class="contact">
                <p><strong>📍 대상:</strong> 경주 근화여자중학교 1, 2학년</p>
                <p><strong>❄️ 기간:</strong> 겨울방학 30일</p>
                <p><strong>📞 문의:</strong> 010-2657-3481 (정라미)</p>
            </div>
            
            <a href="https://www.genspark.ai/api/files/s/FXAgi01L" download class="download-btn">
                🎨 포스터 다운로드하기
            </a>
        </div>
    </div>
</body>
</html>
