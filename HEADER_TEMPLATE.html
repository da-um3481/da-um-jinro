<!-- ✨ DA.UM 표준 헤더 (모든 페이지 공통) -->
<header class="glass-effect shadow-2xl sticky top-0 z-50">
    <div class="container mx-auto px-4 sm:px-6 py-4">
        <div class="flex justify-between items-center">
            <!-- 로고 및 타이틀 -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <img src="images/daum-logo-transparent.png" alt="DA.UM Logo" class="w-10 h-10 sm:w-14 sm:h-14 rounded-xl shadow-lg" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-base sm:text-2xl font-black bg-gradient-to-r from-cyan-600 to-blue-600 bg-clip-text text-transparent">
                        {PAGE_TITLE}
                    </h1>
                    <p class="hidden sm:block text-xs text-gray-600 font-medium">{PAGE_SUBTITLE}</p>
                </div>
            </div>
            
            <!-- 네비게이션 (페이지별 커스터마이징) -->
            <nav class="hidden md:flex space-x-2">
                <a href="index.html" class="px-4 py-2.5 text-gray-700 hover:bg-gray-100 rounded-xl transition font-medium">
                    <i class="fas fa-home mr-2"></i>홈
                </a>
                {CUSTOM_NAV_LINKS}
            </nav>
            
            <!-- 모바일 메뉴 버튼 -->
            <button onclick="window.location.href='index.html'" class="md:hidden px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-xl transition">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
    </div>
</header>

<style>
    .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
</style>
