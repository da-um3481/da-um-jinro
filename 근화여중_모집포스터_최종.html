<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근화여중 겨울방학 프로그램 모집</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        
        .poster-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .info-section {
            padding: 30px;
            background: linear-gradient(135deg, #7B1FA2 0%, #9C27B0 100%);
            color: white;
            text-align: center;
        }
        
        .info-section h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        .info-section p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .download-btn {
            display: inline-block;
            background: white;
            color: #7B1FA2;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        
        .download-btn:hover {
            transform: scale(1.05);
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                max-width: none;
            }
            .info-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.genspark.ai/api/files/s/ibQ2xtst" alt="근화여중 겨울방학 프로그램 모집 포스터" class="poster-image">
        
        <div class="info-section">
            <h2>📢 지금 바로 신청하세요!</h2>
            <p><strong>신청 방법:</strong> 담임 선생님 또는 진로 선생님께 문의</p>
            <p><strong>문의:</strong> 010-2657-3481 (정라미)</p>
            <p><strong>대상:</strong> 근화여자중학교 1, 2학년</p>
            <a href="https://www.genspark.ai/api/files/s/ibQ2xtst" download class="download-btn">🎨 포스터 다운로드</a>
        </div>
    </div>
</body>
</html>
