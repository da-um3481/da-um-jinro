<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 기초학력 탄탄 - 학생 학습 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 50%, #312e81 100%);
            min-height: 100vh;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .subject-card {
            transition: all 0.3s ease;
        }
        
        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="p-4">
    <!-- 헤더 -->
    <nav class="glass-effect rounded-2xl shadow-2xl p-4 mb-6 animate-slide-up">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center text-2xl">
                    📚
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-800">기초학력 탄탄</h1>
                    <p class="text-xs text-gray-600">중1~중3 공통 학습 프로그램</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-sm font-bold text-gray-800" id="studentName">학생 이름</p>
                <p class="text-xs text-gray-600" id="currentDay">DAY 1/30</p>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto space-y-6">
        <!-- 학생 정보 입력 -->
        <div id="nameInputSection" class="glass-effect rounded-2xl shadow-xl p-6 animate-slide-up">
            <h2 class="text-2xl font-black text-gray-800 mb-4 text-center">
                <i class="fas fa-user-circle text-blue-600 mr-2"></i>학습 시작하기
            </h2>
            <div class="max-w-md mx-auto space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">이름</label>
                    <input type="text" id="nameInput" 
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none"
                        placeholder="이름을 입력하세요">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">학년</label>
                    <select id="gradeInput" 
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none">
                        <option value="1">중학교 1학년</option>
                        <option value="2">중학교 2학년</option>
                        <option value="3">중학교 3학년</option>
                    </select>
                </div>
                <button onclick="startLearning()" 
                    class="w-full py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-black rounded-lg hover:shadow-xl transition-all">
                    <i class="fas fa-rocket mr-2"></i>학습 시작하기
                </button>
            </div>
        </div>

        <!-- 프로그램 안내 -->
        <div class="glass-effect rounded-2xl shadow-xl p-6 animate-slide-up">
            <h3 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-info-circle text-blue-600 mr-2"></i>프로그램 안내
            </h3>
            <div class="grid md:grid-cols-3 gap-4">
                <div class="p-4 bg-blue-50 rounded-lg">
                    <div class="text-2xl mb-2">🎯</div>
                    <h4 class="font-bold text-gray-800 mb-1">학습 대상</h4>
                    <p class="text-sm text-gray-600">중1~중3 전 학년<br>동일한 내용 학습</p>
                </div>
                <div class="p-4 bg-purple-50 rounded-lg">
                    <div class="text-2xl mb-2">📖</div>
                    <h4 class="font-bold text-gray-800 mb-1">학습 과목</h4>
                    <p class="text-sm text-gray-600">수학, 영어, 국어<br>3과목 기초 다지기</p>
                </div>
                <div class="p-4 bg-indigo-50 rounded-lg">
                    <div class="text-2xl mb-2">📅</div>
                    <h4 class="font-bold text-gray-800 mb-1">학습 기간</h4>
                    <p class="text-sm text-gray-600">30일 연속<br>매일 학습 진행</p>
                </div>
            </div>
        </div>

        <!-- 오늘의 학습 -->
        <div id="todayLearningSection" class="glass-effect rounded-2xl shadow-xl p-6 animate-slide-up hidden">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-calendar-day text-blue-600 mr-2"></i>오늘의 학습 (<span id="todayDate"></span>)
                </h3>
                <div class="text-sm text-gray-600">
                    DAY <span id="currentDayNumber">1</span> / 30
                </div>
            </div>

            <!-- 3과목 학습 카드 -->
            <div class="grid md:grid-cols-3 gap-4" id="subjectsContainer">
                <!-- JavaScript로 동적 생성 -->
            </div>

            <!-- 오늘의 학습 시간 -->
            <div class="mt-6 p-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl text-white">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-sm opacity-90">오늘의 총 학습 시간</div>
                        <div class="text-3xl font-black mt-1" id="totalStudyTime">0분</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm opacity-90">목표 달성률</div>
                        <div class="text-3xl font-black mt-1" id="achievementRate">0%</div>
                    </div>
                </div>
                <div class="bg-white/20 rounded-full h-3 mt-3">
                    <div class="bg-white h-full rounded-full transition-all" id="achievementBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 30일 학습 캘린더 -->
        <div id="calendarSection" class="glass-effect rounded-2xl shadow-xl p-6 animate-slide-up hidden">
            <h3 class="text-lg font-bold text-gray-800 mb-4">
                <i class="fas fa-calendar-check text-blue-600 mr-2"></i>30일 학습 캘린더
            </h3>
            <div class="grid grid-cols-5 sm:grid-cols-10 gap-2" id="calendarGrid">
                <!-- JavaScript로 30일 캘린더 생성 -->
            </div>
            <div class="mt-4 flex items-center justify-center space-x-4 text-xs">
                <span>✅ 완료</span>
                <span>⏸️ 진행중</span>
                <span>⬜ 미완료</span>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 학습 데이터 (중1~중3 공통)
        // ==========================================
        const subjects = {
            '수학': {
                name: '수학',
                icon: '🔢',
                color: 'blue',
                topics: [
                    { day: 1, title: '정수와 유리수', content: '양수와 음수, 절댓값과 대소 관계' },
                    { day: 2, title: '정수와 유리수의 계산', content: '덧셈, 뺄셈, 곱셈, 나눗셈' },
                    { day: 3, title: '문자의 사용과 식의 계산', content: '문자를 사용한 식, 일차식의 계산' },
                    { day: 4, title: '일차방정식', content: '방정식의 풀이, 활용 문제' },
                    { day: 5, title: '좌표평면과 그래프', content: '좌표평면, 정비례와 반비례' },
                    { day: 6, title: '통계', content: '도수분포표, 상대도수, 히스토그램' },
                    { day: 7, title: '확률', content: '경우의 수, 확률의 계산' },
                    { day: 8, title: '복습 1주차', content: '1~7일차 복습 및 문제풀이' },
                    { day: 9, title: '기본 도형', content: '점, 선, 면, 각' },
                    { day: 10, title: '작도와 합동', content: '삼각형의 작도, 합동 조건' }
                ]
            },
            '영어': {
                name: '영어',
                icon: '🔤',
                color: 'purple',
                topics: [
                    { day: 1, title: 'be동사', content: 'am, are, is의 쓰임과 부정문, 의문문' },
                    { day: 2, title: '일반동사', content: '현재형, 3인칭 단수 현재형' },
                    { day: 3, title: '과거시제', content: 'be동사 과거형, 일반동사 과거형' },
                    { day: 4, title: '진행형', content: '현재진행형, 과거진행형' },
                    { day: 5, title: '조동사', content: 'can, may, must, should' },
                    { day: 6, title: '명사와 관사', content: '셀 수 있는 명사, a/an/the' },
                    { day: 7, title: '대명사', content: '인칭대명사, 지시대명사' },
                    { day: 8, title: '복습 1주차', content: '1~7일차 복습 및 문제풀이' },
                    { day: 9, title: '형용사', content: '형용사의 쓰임, 비교급, 최상급' },
                    { day: 10, title: '부사', content: '부사의 위치와 쓰임' }
                ]
            },
            '국어': {
                name: '국어',
                icon: '✍️',
                color: 'indigo',
                topics: [
                    { day: 1, title: '문법 - 품사', content: '명사, 대명사, 수사' },
                    { day: 2, title: '문법 - 용언', content: '동사, 형용사' },
                    { day: 3, title: '문법 - 수식언', content: '관형사, 부사' },
                    { day: 4, title: '문법 - 관계언과 독립언', content: '조사, 감탄사' },
                    { day: 5, title: '문학 - 시', content: '시의 운율, 심상, 표현 기법' },
                    { day: 6, title: '문학 - 소설', content: '소설의 구성, 인물, 배경' },
                    { day: 7, title: '문학 - 극과 수필', content: '희곡, 시나리오, 수필' },
                    { day: 8, title: '복습 1주차', content: '1~7일차 복습 및 문제풀이' },
                    { day: 9, title: '독서 - 사실적 독해', content: '중심 내용, 세부 내용 파악' },
                    { day: 10, title: '독서 - 추론적 독해', content: '추론하며 읽기' }
                ]
            }
        };

        let studentData = {
            name: '',
            grade: 1,
            currentDay: 1,
            studyLog: {},
            totalMinutes: 0
        };

        // ==========================================
        // 초기화
        // ==========================================
        function init() {
            loadStudentData();
            if (studentData.name) {
                document.getElementById('nameInputSection').classList.add('hidden');
                document.getElementById('todayLearningSection').classList.remove('hidden');
                document.getElementById('calendarSection').classList.remove('hidden');
                updateUI();
            }
        }

        // ==========================================
        // 학습 시작
        // ==========================================
        function startLearning() {
            const name = document.getElementById('nameInput').value.trim();
            const grade = parseInt(document.getElementById('gradeInput').value);
            
            if (!name) {
                alert('이름을 입력해주세요.');
                return;
            }
            
            studentData.name = name;
            studentData.grade = grade;
            saveStudentData();
            
            document.getElementById('nameInputSection').classList.add('hidden');
            document.getElementById('todayLearningSection').classList.remove('hidden');
            document.getElementById('calendarSection').classList.remove('hidden');
            
            updateUI();
        }

        // ==========================================
        // UI 업데이트
        // ==========================================
        function updateUI() {
            // 학생 정보
            document.getElementById('studentName').textContent = `${studentData.name} (중${studentData.grade})`;
            document.getElementById('currentDay').textContent = `DAY ${studentData.currentDay}/30`;
            document.getElementById('currentDayNumber').textContent = studentData.currentDay;
            
            // 오늘 날짜
            const today = new Date();
            document.getElementById('todayDate').textContent = 
                `${today.getMonth() + 1}월 ${today.getDate()}일`;
            
            // 과목 카드 생성
            renderSubjects();
            
            // 캘린더 생성
            renderCalendar();
            
            // 학습 시간 업데이트
            updateStudyTime();
        }

        // ==========================================
        // 과목 카드 렌더링
        // ==========================================
        function renderSubjects() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';
            
            Object.values(subjects).forEach(subject => {
                const topic = subject.topics[studentData.currentDay - 1] || subject.topics[0];
                const isCompleted = studentData.studyLog[studentData.currentDay]?.[subject.name] || false;
                
                const card = document.createElement('div');
                card.className = `subject-card p-6 bg-${subject.color}-50 rounded-xl border-2 border-${subject.color}-200 cursor-pointer`;
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-3xl">${subject.icon}</span>
                            <h4 class="font-bold text-gray-800">${subject.name}</h4>
                        </div>
                        <div class="text-2xl">${isCompleted ? '✅' : '⏸️'}</div>
                    </div>
                    <div class="space-y-2">
                        <p class="text-sm font-bold text-gray-700">📚 ${topic.title}</p>
                        <p class="text-xs text-gray-600">${topic.content}</p>
                        <button onclick="completeSubject('${subject.name}')" 
                            class="mt-3 w-full py-2 bg-${subject.color}-600 text-white font-bold rounded-lg hover:bg-${subject.color}-700 transition-all ${isCompleted ? 'opacity-50' : ''}">
                            ${isCompleted ? '완료됨' : '학습 완료 체크'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==========================================
        // 과목 완료 처리
        // ==========================================
        function completeSubject(subjectName) {
            if (!studentData.studyLog[studentData.currentDay]) {
                studentData.studyLog[studentData.currentDay] = {};
            }
            
            studentData.studyLog[studentData.currentDay][subjectName] = true;
            studentData.totalMinutes += 30; // 과목당 30분 가정
            
            saveStudentData();
            updateUI();
            
            // 3과목 모두 완료 시
            const completedCount = Object.keys(studentData.studyLog[studentData.currentDay]).length;
            if (completedCount === 3) {
                alert(`🎉 ${studentData.currentDay}일차 학습을 모두 완료했습니다!`);
                if (studentData.currentDay < 30) {
                    if (confirm('다음 날로 이동하시겠습니까?')) {
                        studentData.currentDay++;
                        saveStudentData();
                        updateUI();
                    }
                }
            }
        }

        // ==========================================
        // 캘린더 렌더링
        // ==========================================
        function renderCalendar() {
            const container = document.getElementById('calendarGrid');
            container.innerHTML = '';
            
            for (let day = 1; day <= 30; day++) {
                const dayData = studentData.studyLog[day];
                const completedCount = dayData ? Object.keys(dayData).length : 0;
                
                let emoji = '⬜';
                if (completedCount === 3) emoji = '✅';
                else if (completedCount > 0) emoji = '⏸️';
                
                const dayEl = document.createElement('div');
                dayEl.className = `p-3 text-center rounded-lg cursor-pointer transition-all ${
                    day === studentData.currentDay ? 'bg-blue-100 border-2 border-blue-600' : 'bg-gray-100'
                }`;
                dayEl.innerHTML = `
                    <div class="text-xs font-bold text-gray-600">Day ${day}</div>
                    <div class="text-2xl mt-1">${emoji}</div>
                `;
                dayEl.onclick = () => {
                    studentData.currentDay = day;
                    saveStudentData();
                    updateUI();
                };
                container.appendChild(dayEl);
            }
        }

        // ==========================================
        // 학습 시간 업데이트
        // ==========================================
        function updateStudyTime() {
            const todayCompleted = studentData.studyLog[studentData.currentDay] 
                ? Object.keys(studentData.studyLog[studentData.currentDay]).length 
                : 0;
            const todayMinutes = todayCompleted * 30;
            const targetMinutes = 90; // 3과목 × 30분
            const rate = Math.min(100, Math.round((todayMinutes / targetMinutes) * 100));
            
            document.getElementById('totalStudyTime').textContent = `${todayMinutes}분`;
            document.getElementById('achievementRate').textContent = `${rate}%`;
            document.getElementById('achievementBar').style.width = `${rate}%`;
        }

        // ==========================================
        // 로컬 스토리지
        // ==========================================
        function saveStudentData() {
            localStorage.setItem('tantan_student_data', JSON.stringify(studentData));
        }

        function loadStudentData() {
            const saved = localStorage.getItem('tantan_student_data');
            if (saved) {
                studentData = JSON.parse(saved);
            }
        }

        // ==========================================
        // 페이지 로드 시 초기화
        // ==========================================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
