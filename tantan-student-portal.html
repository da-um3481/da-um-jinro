<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 기초학력 탄탄 - 학생 학습 포털 v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 50%, #312e81 100%);
            min-height: 100vh;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .subject-card {
            transition: all 0.3s ease;
        }
        
        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .timer-display {
            font-variant-numeric: tabular-nums;
            font-size: 2rem;
            font-weight: 900;
        }
    </style>
</head>

        // ==========================================
        // 초기화
        // ==========================================
        function init() {
            loadStudentData();
            if (studentData.name) {
                document.getElementById('nameInputSection').classList.add('hidden');
                document.getElementById('todayLearningSection').classList.remove('hidden');
                document.getElementById('calendarSection').classList.remove('hidden');
                updateUI();
            }
        }

        // ==========================================
        // 학습 시작
        // ==========================================
        function startLearning() {
            const name = document.getElementById('nameInput').value.trim();
            const grade = parseInt(document.getElementById('gradeInput').value);
            
            if (!name) {
                alert('이름을 입력해주세요.');
                return;
            }
            
            studentData.name = name;
            studentData.grade = grade;
            saveStudentData();
            
            document.getElementById('nameInputSection').classList.add('hidden');
            document.getElementById('todayLearningSection').classList.remove('hidden');
            document.getElementById('calendarSection').classList.remove('hidden');
            
            updateUI();
        }

        // ==========================================
        // UI 업데이트
        // ==========================================
        function updateUI() {

            console.log('studentData:', studentData);
            
            // 학생 정보
            document.getElementById('studentName').textContent = `${studentData.name} (중${studentData.grade})`;
            document.getElementById('currentDay').textContent = `DAY ${studentData.currentDay}/30`;
            document.getElementById('currentDayNumber').textContent = studentData.currentDay;
            
            // 오늘 날짜

            document.getElementById('todayDate').textContent = 
                `${today.getMonth() + 1}월 ${today.getDate()}일`;
            
            // 과목 카드 생성

            renderSubjects();
            console.log('renderSubjects() completed');

            // 학습 시간 업데이트
            updateStudyTime();
        }

            Object.values(subjects).forEach(subject => {
                console.log(`Processing subject: ${subject.name}`);
                const topic = subject.topics[studentData.currentDay - 1] || subject.topics[0];
                console.log(`Topic for ${subject.name}:`, topic);
                const dayKey = `${studentData.currentDay}_${subject.name}`;
                const isCompleted = studentData.studyLog[studentData.currentDay]?.[subject.name]?.completed || false;
                const timerData = studentData.timers[dayKey] || { elapsed: 0, running: false };
                
                // 색상 매핑
                const colorClasses = {
                    'blue': 'bg-blue-50 border-blue-200',
                    'purple': 'bg-purple-50 border-purple-200',
                    'indigo': 'bg-indigo-50 border-indigo-200'
                };
                
                const card = document.createElement('div');
                card.className = `subject-card p-6 ${colorClasses[subject.color]} rounded-xl border-2`;
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-3xl">${subject.icon}</span>
                            <h4 class="font-bold text-gray-800 text-lg">${subject.name}</h4>
                        </div>
                        <div class="text-3xl">${isCompleted ? '✅' : '📝'}</div>
                    </div>
                    
                    <div class="space-y-4">
                        <!-- 오늘의 학습 주제 -->
                        <div class="p-4 bg-white rounded-lg border-2 border-gray-300">
                            <div class="flex items-start space-x-2">
                                <span class="text-xl">📚</span>
                                <div class="flex-1">
                                    <p class="font-bold text-gray-800 mb-1">Day ${topic.day}: ${topic.title}</p>
                                    <p class="text-sm text-gray-600 leading-relaxed">${topic.content}</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 타이머 영역 - 더 크고 명확하게 -->
                        <div class="p-5 bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl border-2 border-gray-300 shadow-md">
                            <div class="text-center mb-4">
                                <div class="text-sm font-bold text-gray-700 mb-2">⏱️ 학습 시간 측정</div>
                                <div class="timer-display text-5xl font-black" style="color: ${subject.color === 'blue' ? '#2563eb' : subject.color === 'purple' ? '#9333ea' : '#4f46e5'};" id="timer_${subject.name}">
                                    ${formatTime(timerData.elapsed)}
                                </div>
                                <div class="text-xs text-gray-500 mt-2">최소 1분 이상 학습 필요</div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="startTimer('${subject.name}')" 
                                    id="startBtn_${subject.name}"
                                    class="py-3 px-4 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition-all shadow-md ${timerData.running ? 'opacity-50 cursor-not-allowed' : 'hover:shadow-lg'}">
                                    <i class="fas fa-play mr-2"></i>시작
                                </button>
                                <button onclick="stopTimer('${subject.name}')" 
                                    id="stopBtn_${subject.name}"
                                    class="py-3 px-4 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition-all shadow-md ${!timerData.running ? 'opacity-50 cursor-not-allowed' : 'hover:shadow-lg'}">
                                    <i class="fas fa-stop mr-2"></i>정지
                                </button>
                            </div>
                        </div>
                        
                        <!-- 완료 버튼 -->
                        <button onclick="completeSubject('${subject.name}')" 
                            class="w-full py-4 font-black text-lg rounded-xl transition-all shadow-md hover:shadow-lg ${isCompleted ? 'bg-gray-400 text-white cursor-not-allowed' : subject.color === 'blue' ? 'bg-blue-600 hover:bg-blue-700 text-white' : subject.color === 'purple' ? 'bg-purple-600 hover:bg-purple-700 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}">
                            ${isCompleted ? '✅ 학습 완료됨' : '✓ 학습 완료 체크'}
                        </button>
                    </div>
                `;
                console.log(`✅ Card created for ${subject.name}`);
                container.appendChild(card);
                cardCount++;
                console.log(`✅ Card appended (total: ${cardCount})`);
                
                // 타이머가 실행 중이면 재시작
                if (timerData.running) {
                    startTimer(subject.name, true);
                }
            });
            console.log(`=== renderSubjects END (${cardCount} cards created) ===`);
        }

        // ==========================================
        // 타이머 시작
        // ==========================================
        function startTimer(subjectName, skipSave = false) {
            const dayKey = `${studentData.currentDay}_${subjectName}`;
            
            // 이미 실행 중이면 무시
            if (activeTimers[dayKey]) {
                return;
            }
            
            // 타이머 데이터 초기화
            if (!studentData.timers[dayKey]) {
                studentData.timers[dayKey] = { elapsed: 0, running: true };
            } else {
                studentData.timers[dayKey].running = true;
            }
            
            if (!skipSave) {
                saveStudentData();
            }
            
            // 타이머 시작
            activeTimers[dayKey] = setInterval(() => {
                studentData.timers[dayKey].elapsed++;
                document.getElementById(`timer_${subjectName}`).textContent = 
                    formatTime(studentData.timers[dayKey].elapsed);
                saveStudentData();
            }, 1000);
            
            // 버튼 상태 업데이트
            document.getElementById(`startBtn_${subjectName}`).classList.add('opacity-50');
            document.getElementById(`stopBtn_${subjectName}`).classList.remove('opacity-50');
        }

        // ==========================================
        // 타이머 정지
        // ==========================================
        function stopTimer(subjectName) {
            const dayKey = `${studentData.currentDay}_${subjectName}`;
            
            if (activeTimers[dayKey]) {
                clearInterval(activeTimers[dayKey]);
                delete activeTimers[dayKey];
            }
            
            if (studentData.timers[dayKey]) {
                studentData.timers[dayKey].running = false;
                saveStudentData();
            }
            
            // 버튼 상태 업데이트
            document.getElementById(`startBtn_${subjectName}`).classList.remove('opacity-50');
            document.getElementById(`stopBtn_${subjectName}`).classList.add('opacity-50');
        }

        // ==========================================
        // 시간 포맷팅 (초 -> MM:SS)
        // ==========================================
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // ==========================================
        // 과목 완료 처리
        // ==========================================
        function completeSubject(subjectName) {
            const dayKey = `${studentData.currentDay}_${subjectName}`;
            const timerData = studentData.timers[dayKey];
            
            if (!timerData || timerData.elapsed < 60) {
                alert('최소 1분 이상 학습해야 완료할 수 있습니다.');
                return;
            }
            
            // 타이머 정지
            stopTimer(subjectName);
            
            // 완료 처리
            if (!studentData.studyLog[studentData.currentDay]) {
                studentData.studyLog[studentData.currentDay] = {};
            }
            
            studentData.studyLog[studentData.currentDay][subjectName] = {
                completed: true,
                time: timerData.elapsed
            };
            
            studentData.totalMinutes += Math.floor(timerData.elapsed / 60);
            
            saveStudentData();
            updateUI();
            
            // 3과목 모두 완료 시
            const completedCount = Object.keys(studentData.studyLog[studentData.currentDay]).length;
            if (completedCount === 3) {
                alert(`🎉 ${studentData.currentDay}일차 학습을 모두 완료했습니다!`);
                if (studentData.currentDay < 30) {
                    if (confirm('다음 날로 이동하시겠습니까?')) {
                        studentData.currentDay++;
                        saveStudentData();
                        updateUI();
                    }
                }
            }
        }

        // ==========================================
        // 캘린더 렌더링
        // ==========================================
        function renderCalendar() {
            const container = document.getElementById('calendarGrid');
            container.innerHTML = '';
            
            for (let day = 1; day <= 30; day++) {
                const dayData = studentData.studyLog[day];
                const completedCount = dayData ? Object.keys(dayData).length : 0;
                
                let emoji = '⬜';
                if (completedCount === 3) emoji = '✅';
                else if (completedCount > 0) emoji = '⏸️';
                
                const dayEl = document.createElement('div');
                dayEl.className = `p-3 text-center rounded-lg cursor-pointer transition-all ${
                    day === studentData.currentDay ? 'bg-blue-100 border-2 border-blue-600' : 'bg-gray-100'
                }`;
                dayEl.innerHTML = `
                    <div class="text-xs font-bold text-gray-600">Day ${day}</div>
                    <div class="text-2xl mt-1">${emoji}</div>
                `;
                dayEl.onclick = () => {
                    // 모든 타이머 정지
                    Object.keys(activeTimers).forEach(key => {
                        const subjectName = key.split('_')[1];
                        stopTimer(subjectName);
                    });
                    
                    studentData.currentDay = day;
                    saveStudentData();
                    updateUI();
                };
                container.appendChild(dayEl);
            }
        }

        // ==========================================
        // 학습 시간 업데이트
        // ==========================================
        function updateStudyTime() {
            let todayMinutes = 0;
            const todayLog = studentData.studyLog[studentData.currentDay];
            
            if (todayLog) {
                Object.values(todayLog).forEach(log => {
                    if (log.time) {
                        todayMinutes += Math.floor(log.time / 60);
                    }
                });
            }
            
            const targetMinutes = 90; // 3과목 × 30분
            const rate = Math.min(100, Math.round((todayMinutes / targetMinutes) * 100));
            
            document.getElementById('totalStudyTime').textContent = `${todayMinutes}분`;
            document.getElementById('achievementRate').textContent = `${rate}%`;
            document.getElementById('achievementBar').style.width = `${rate}%`;
        }

        // ==========================================
        // 로컬 스토리지
        // ==========================================
        function saveStudentData() {
            localStorage.setItem('tantan_student_data', JSON.stringify(studentData));
        }

        function loadStudentData() {
            const saved = localStorage.getItem('tantan_student_data');
            if (saved) {
                studentData = JSON.parse(saved);
                // running 플래그 초기화 (페이지 새로고침 시)
                if (studentData.timers && typeof studentData.timers === 'object') {
                    Object.keys(studentData.timers).forEach(key => {
                        studentData.timers[key].running = false;
                    });
                }
            }
        }

        // ==========================================
        // 페이지 로드 시 초기화
        // ==========================================
        window.addEventListener('DOMContentLoaded', init);
        
        // 페이지 종료 시 모든 타이머 정지
        window.addEventListener('beforeunload', () => {
            Object.keys(activeTimers).forEach(key => {
                const subjectName = key.split('_')[1];
                stopTimer(subjectName);
            });
        });
    </script>
</body>
</html>
