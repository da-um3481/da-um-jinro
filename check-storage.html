<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage 데이터 확인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 2rem;
            text-align: center;
        }

        .section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .section h2 {
            color: #495057;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .data-display {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }

        .count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .empty {
            color: #dc3545;
            font-style: italic;
        }

        .actions {
            text-align: center;
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            margin: 0.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 localStorage 데이터 확인</h1>

        <div class="section">
            <h2>진단평가 결과 <span class="count" id="diagnosticCount">0</span></h2>
            <div class="data-display" id="diagnosticData"></div>
        </div>

        <div class="section">
            <h2>성장테스트 결과 <span class="count" id="growthCount">0</span></h2>
            <div class="data-display" id="growthData"></div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="refreshData()">🔄 새로고침</button>
            <button class="btn btn-success" onclick="goToDashboard()">📊 대시보드로 이동</button>
            <button class="btn btn-danger" onclick="clearGrowthData()">🗑️ 성장테스트 데이터 초기화</button>
        </div>
    </div>

    <script>
        function loadData() {
            // 진단평가 결과
            const diagnosticResults = JSON.parse(localStorage.getItem('diagnostic_results')) || [];
            document.getElementById('diagnosticCount').textContent = diagnosticResults.length;
            
            if (diagnosticResults.length === 0) {
                document.getElementById('diagnosticData').innerHTML = '<span class="empty">저장된 진단평가 결과가 없습니다.</span>';
            } else {
                document.getElementById('diagnosticData').textContent = JSON.stringify(diagnosticResults, null, 2);
            }

            // 성장테스트 결과
            const growthResults = JSON.parse(localStorage.getItem('growth_test_results')) || [];
            document.getElementById('growthCount').textContent = growthResults.length;
            
            if (growthResults.length === 0) {
                document.getElementById('growthData').innerHTML = '<span class="empty">저장된 성장테스트 결과가 없습니다.</span>';
            } else {
                document.getElementById('growthData').textContent = JSON.stringify(growthResults, null, 2);
            }

            console.log('📊 진단평가 결과:', diagnosticResults);
            console.log('🌱 성장테스트 결과:', growthResults);
        }

        function refreshData() {
            loadData();
            alert('✅ 데이터를 새로고침했습니다!');
        }

        function goToDashboard() {
            window.location.href = 'growth-test-results.html';
        }

        function clearGrowthData() {
            if (confirm('⚠️ 정말로 성장테스트 데이터를 모두 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다!')) {
                localStorage.removeItem('growth_test_results');
                loadData();
                alert('✅ 성장테스트 데이터가 삭제되었습니다.');
            }
        }

        // 페이지 로드 시 자동 실행
        loadData();
    </script>
</body>
</html>
